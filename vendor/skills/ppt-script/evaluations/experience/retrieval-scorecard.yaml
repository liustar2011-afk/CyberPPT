schema: ppt-script.experience-retrieval-scorecard.v1
scale: 0-5
criteria:
  - id: relevance
    name: 检索案例相关性
    weight: 25
  - id: negative-scope
    name: 不适用条件识别
    weight: 20
  - id: method-transfer
    name: 方法迁移有效性
    weight: 25
  - id: source-isolation
    name: 当前事实与历史经验隔离
    weight: 20
  - id: edit-reduction
    name: 人工返修减少程度
    weight: 10
hard_failures:
  - 历史案例被写入Source Truth Map
  - 非approved案例进入索引
  - 命中不适用条件仍直接套用
