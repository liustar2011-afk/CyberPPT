covered_threshold: 0.42
weak_threshold: 0.20
duplicate_threshold: 0.60
forbidden_phrases:
  - 需关注事项
  - 总体判断
  - 不是……而是……
  - 并非……而是……
  - 本报告认为
  - 本方案旨在
  - 编制过程中
  - 资料显示
speaker_notes_enabled: true
speaker_notes_required_for_substantive: true
speaker_notes_min_chars: 100
speaker_notes_max_repetition: 0.72
speaker_notes_default_seconds: 60
speaker_notes_simple_page_types: [封面, 目录, 章节过渡, 过渡页, 封底, 结束页]
target_duration_minutes: null
duration_tolerance_ratio: 0.15
