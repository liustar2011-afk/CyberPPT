schema: ppt-script.workflow-routes.v1
source_states:
  raw-materials: 原始材料或多份散乱材料
  formal-report: 已有正式报告、方案或研究材料
  existing-outline: 已有汇报提纲或章节结构
  existing-script: 已有逐页脚本
  approved-script: 已确认并准备视觉制作的脚本
  visual-reference: 已有源图或视觉参考
primary_goals:
  decision-support: 支撑领导判断和决策
  progress-reporting: 汇报进展、成果和下一步安排
  approval: 提请审议、批准或协调支持
  alignment: 统一认识、职责和实施安排
  communication: 形成清晰、易讲解的正式表达
  visual-production: 形成可直接进入视觉制作的输入
  quality-assurance: 核查来源、逻辑、文体和视觉可执行性
task_types:
  full-presentation:
    label: 原材料转完整PPT
    default_source_state: formal-report
    default_primary_goal: decision-support
    stages:
    - source-understanding
    - semantic-understanding
    - source-truth
    - cognitive-reading
    - cognitive-reconciliation
    - experience-retrieval
    - editorial-semantic-planning
    - editorial-independent
    - editorial-storyline-candidates
    - editorial-storyline
    - storyline
    - chapter-contracts
    - page-contracts
    - editorial-outline
    - editorial-red-team
    - editorial-red-team-response
    - page-script
    - speaker-notes
    - quality-review
    - visual-handoff
  report-to-presentation:
    label: 已有报告转PPT
    default_source_state: formal-report
    default_primary_goal: communication
    stages:
    - source-understanding
    - semantic-understanding
    - source-truth
    - cognitive-reading
    - cognitive-reconciliation
    - experience-retrieval
    - editorial-semantic-planning
    - editorial-independent
    - editorial-storyline-candidates
    - editorial-storyline
    - storyline
    - chapter-contracts
    - page-contracts
    - editorial-outline
    - editorial-red-team
    - editorial-red-team-response
    - page-script
    - speaker-notes
    - quality-review
    - visual-handoff
  optimize-existing-script:
    label: 已有脚本优化
    default_source_state: existing-script
    default_primary_goal: quality-assurance
    stages:
    - source-truth
    - experience-retrieval
    - quality-review
    - page-contracts
    - page-script
    - speaker-notes
    - visual-handoff
  single-page-design:
    label: 单页设计
    default_source_state: existing-outline
    default_primary_goal: communication
    stages:
    - source-truth
    - experience-retrieval
    - page-contracts
    - page-script
    - quality-review
    - visual-handoff
  leadership-compression:
    label: 领导汇报压缩
    default_source_state: formal-report
    default_primary_goal: approval
    stages:
    - source-understanding
    - semantic-understanding
    - source-truth
    - cognitive-reading
    - cognitive-reconciliation
    - experience-retrieval
    - editorial-semantic-planning
    - editorial-independent
    - editorial-storyline-candidates
    - editorial-storyline
    - storyline
    - chapter-contracts
    - page-contracts
    - editorial-outline
    - editorial-red-team
    - editorial-red-team-response
    - page-script
    - speaker-notes
    - quality-review
  presentation-extension:
    label: PPT增页
    default_source_state: existing-script
    default_primary_goal: alignment
    stages:
    - source-truth
    - experience-retrieval
    - storyline
    - page-contracts
    - page-script
    - quality-review
    - visual-handoff
  speaker-notes:
    label: 汇报讲解词
    default_source_state: existing-script
    default_primary_goal: communication
    stages:
    - source-truth
    - experience-retrieval
    - speaker-notes
    - quality-review
  visual-script:
    label: 纯视觉脚本
    default_source_state: approved-script
    default_primary_goal: visual-production
    stages:
    - experience-retrieval
    - page-contracts
    - visual-handoff
  quality-review:
    label: 质量检查
    default_source_state: existing-script
    default_primary_goal: quality-assurance
    stages:
    - source-truth
    - experience-retrieval
    - quality-review
  replica-rebuild:
    label: PPT复刻与重建
    default_source_state: visual-reference
    default_primary_goal: visual-production
    stages:
    - experience-retrieval
    - source-understanding
    - semantic-understanding
    - page-contracts
    - visual-handoff
