quality:
  p0_coverage_required: 1.0
  duplicate_similarity_warning: 0.72
  duplicate_similarity_error: 0.86
  duplicate_min_chars: 45
  speaker_notes_min_chars: 70
  speaker_notes_max_chars: 520
  max_consecutive_visual_intent: 2
  max_content_modules: 5
  min_content_modules: 2
  min_order_signal_modules: 3
  max_detail_body_chars: 90
  max_small_title_chars: 10
  min_visible_bullets: 6
  min_onscreen_full_ratio: 0.20
  max_onscreen_full_ratio: 0.45
  max_onscreen_full_ratio_min_full_chars: 300
  source_id_patterns:
    - "\\b(?:SRC|SU|A|P0)-[A-Za-z0-9_-]+\\b"
