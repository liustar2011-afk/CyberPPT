contract:
  name: cyberppt-imagegen-page-contract
  version: 2.0
  prompt_compiler: content-structure-style-v2
  visual_structure_mode: "contract"
  text_render_mode: full_image
  canvas:
    width: 2048
    height: 1024
    ratio: "2:1"
  key_text_limit: 7
  template_page_types:
    封面: cover
    cover: cover
    目录: contents
    agenda: contents
    contents: contents
    章节过渡页: chapter
    chapter: chapter
    封底: closing
    back_cover: closing
    closing: closing
  content_page_types:
    内容页: content
    content: content
  title_layer:
    handled_by_ppt: true
    draw_in_image: false
  visual_style:
    runtime_source: "visual/ACTIVE-STYLE.md"
    page_level_style_prose: false
    record_style_hash: true
  assembly:
    template_pages: "代码生成SVG并写入可编辑PPT"
    content_pages: "ImageGen生成正文区图片并放入PPT内容区"
    page_title: "代码在PPT标题层自动写入"
