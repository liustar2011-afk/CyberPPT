profile:
  id: cec_leadership
  name: 中电联政企领导汇报PPT脚本
  language: zh-CN
presentation:
  audience: 中电联及电力行业政企领导、项目决策与协同单位
  purpose: 内部汇报、领导演讲辅助、项目方案与场景运营汇报
  page_count_mode: auto
  target_page_count: 0
  min_page_count: 4
  max_page_count: 40
content:
  max_title_chars: 24
  max_subtitle_chars: 42
  max_modules_per_page: 5
  max_body_lines_per_page: 10
  max_body_line_chars: 34
  max_total_chars_per_page: 230
  prohibited_phrases:
    - 不是……而是……
    - 需关注事项
    - 总体判断
  rules:
    - 每页只承担一个页面使命、一个核心判断和一种主要逻辑关系。
    - 页面围绕领导需要理解、判断或决策的问题组织，不按原文章节机械摘要。
    - 标题、模块标题和正文短句化，每个字都服务于页面判断。
    - 关键数字、责任主体、政策依据、安全边界、限定条件和否定条件不得弱化。
    - 不得为凑结构擅自制造三项能力、四大机制等原文不存在的内容。
    - 可靠性、统计、数据服务等场景必须保留原始明细数据不外流、受控分析输出等边界。
    - 使用正式、公文式、央企内部汇报表达，避免咨询讲课腔和过程性自述。
visual:
  aspect_ratio: "16:9"
  font: Microsoft YaHei
  min_font_pt: 9
  title_rendering: ppt_text_layer
  requirements:
    - 白底或象牙白底，深蓝为主色，专业、克制、大气。
    - 以一个主视觉结构承载业务关系，形成清晰阅读路径和不均衡主次。
    - 优先采用真实行业场景或实景彩色插画，场景必须与业务逻辑融合。
    - 文字作为面板、标签、注释嵌入主视觉，不形成文字区与图片区割裂。
    - 箭头和连接关系干净，不使用脏污阴影、过度发光或装饰线。
    - 标题、副标题、页码、Logo和模板公共元素由PPT层处理，不在生图中绘制。
  avoid:
    - 正面人物肖像或可识别具体地点事件的人物叙事
    - 图标密集、一条文字对应一个图标
    - 三栏等宽卡片墙、平均分布模块
    - 独立装饰性大图或辅助区域形成第二视觉中心
    - 过度阴影、立体浮雕、玻璃拟态、强光效
    - 文字与实景图片彼此分离
chunking:
  single_call_character_limit: 70000
  chunk_character_limit: 36000
workflow:
  strict_semantic_audit: true
  preserve_intermediate_files: true
