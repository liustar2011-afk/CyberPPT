[project]
name = "source-to-ppt-script-skill"
version = "1.0.0"
description = "Deterministic helpers and references for a staged source-material to PPT-script skill"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5",
  "python-docx>=1.2,<2",
  "PyMuPDF>=1.26,<2",
  "python-pptx>=1.0,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"
