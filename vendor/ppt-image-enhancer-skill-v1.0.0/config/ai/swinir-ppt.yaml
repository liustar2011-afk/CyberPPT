super_resolution:
  backend: swinir
  text_guard:
    enabled: true
    fine_structure_blend: 0.78
    white_background_blend: 0.92
  swinir:
    scale: 4
    model_path: model_zoo/swinir/003_realSR_BSRGAN_DFO_s64w8_SwinIR-M_x4_GAN.pth
    tile: 400
    tile_overlap: 32
    large_model: false
output:
  # SwinIR runs native x4, then V3 downsamples to this final target scale.
  upscale_factor: 2.0
processing:
  denoise:
    strength: 0.08
  sharpen:
    amount: 0.32
