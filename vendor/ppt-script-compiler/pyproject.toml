[project]
name = "ppt-script-compiler"
version = "0.1.0"
description = "Staged source-material to PPT script compiler powered by Codex CLI"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.47,<2",
  "python-docx>=1.2,<2",
  "PyMuPDF>=1.26,<2",
  "python-pptx>=1.0,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.25,<5"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
