profile_name: 政企领导汇报默认配置
language: zh-CN
presentation:
  audience: 政企单位领导及业务负责人
  purpose: 将源材料转化为逻辑清晰、可用于汇报和演讲辅助的PPT脚本
  page_count_mode: auto
  target_page_count: 12
  min_page_count: 6
  max_page_count: 30
  include_cover: true
  include_closing: false
content_rules:
  - 每页仅承担一个页面使命，表达一个核心判断。
  - 每页仅采用一种主要逻辑关系；出现两个独立问题时必须拆页。
  - 先形成信息资产和页面规划，再生成上屏文字和视觉构图。
  - 所有事实、数据、判断和边界条件必须可追溯到源材料编号。
  - 不得为了页面完整性虚构“三项能力”“四大机制”等原文不存在的内容。
  - 标题、模块标题和副标题采用短句，正文采用可直接上屏的终稿文字。
  - 保留原文中的限定条件、安全边界、责任主体、时间、数字和专有名词。
  - 禁止使用“不是……而是……”句式。
  - 不使用星号作为正文符号。
  - 避免咨询腔、方法论讲课腔和过程性自述。
page_split_rules:
  - 同时回答“为什么做”和“怎么做”时拆页。
  - 同时包含总体架构与实施安排时拆页。
  - 同时包含运营模式与报价模式时拆页。
  - 同时出现两个互不从属的核心判断时拆页。
  - 页面需要两种不相容的关系结构时拆页。
screen_copy:
  max_title_chars: 22
  max_subtitle_chars: 45
  max_module_count: 5
  max_body_lines_per_module: 4
  max_total_chars_per_content_page: 220
visual_rules:
  aspect_ratio: "16:9"
  font: Microsoft YaHei
  title_rendering: ppt_text_layer
  min_font_size_pt: 9
  style: 象牙白与深蓝的政企领导汇报风格，专业、克制、大气
  requirements:
    - 单一视觉中心应表达结果、价值或能力，不以平行卡片墙作为默认结构。
    - 优先采用实景彩色行业场景作为视觉基础，业务逻辑轻度嵌入场景。
    - 文字作为场景内面板、标签或注释嵌入主视觉结构，避免文字区与图片区完全分离。
    - 禁止正面人物肖像；人物仅可采用背影、侧后方或远景，避免形成具体事件联想。
    - 箭头和连接关系保持干净，避免阴影、发光、脏污和过度装饰。
    - 辅助区域不得形成第二视觉中心。
    - 不绘制标题、副标题、页码、Logo或模板公共元素，由PPT文字层处理。
  avoid:
    - 三栏等宽卡片
    - 一条文字配一个图标
    - 图标密集
    - 装饰性大图与文字逻辑无关
    - 正面人像
    - 过度阴影与发光
chunking:
  single_call_character_limit: 90000
  chunk_character_limit: 42000
  max_assets_per_chunk: 80
  max_assets_per_merge: 260
codex:
  default_reasoning_effort: high
  sandbox: read-only
  use_ephemeral_sessions: true
  enable_web_search: false
quality:
  strict_source_refs: true
  require_all_core_assets_assigned: true
  run_semantic_audit: true
