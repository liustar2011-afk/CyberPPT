name: Phase 3 test contract migration

on:
  push:
    branches:
      - feat/stage01-heuristic-rule-isolation

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Phase3: migrate legacy heuristic test expectations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage01-heuristic-rule-isolation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install -e ".[dev]"
      - name: Migrate exact legacy test contracts and baseline
        run: |
          python - <<'PY'
          from __future__ import annotations

          import importlib
          import json
          import re
          from pathlib import Path

          target = Path("tests/test_script_quality_contract.py")
          text = target.read_text(encoding="utf-8")

          migrations = {
              "test_detail_phrase_error_blocks_only_when_hard_band_is_crossed":
                  "test_detail_phrase_hard_band_is_review_warning",
              "test_detail_phrase_over_thirty_chars_is_a_blocking_error":
                  "test_detail_phrase_over_thirty_chars_is_review_warning",
              "test_complete_onscreen_proposition_over_ceiling_is_blocked":
                  "test_complete_onscreen_proposition_over_ceiling_is_review_warning",
              "test_standalone_long_sentence_without_trailing_punctuation_is_still_blocked":
                  "test_standalone_long_sentence_without_trailing_punctuation_is_review_warning",
              "test_foundation_page_rejects_off_topic_quality_module":
                  "test_foundation_page_reviews_off_topic_quality_module",
              "test_visual_structure_style_only_is_error":
                  "test_visual_structure_style_only_is_warning",
              "test_compound_group_heading_is_a_blocking_presentation_issue":
                  "test_compound_group_heading_is_an_advisory_presentation_issue",
          }

          for old_name, new_name in migrations.items():
              pattern = re.compile(
                  rf"(?ms)^    def {re.escape(old_name)}\(self\) -> None:\n"
                  rf"(?P<body>.*?)(?=^    def |^class |\Z)"
              )
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f"missing expected test function: {old_name}")
              block = match.group(0)
              if 'self.assertEqual("error", ' not in block:
                  raise SystemExit(f"missing expected error severity assertion: {old_name}")
              migrated = block.replace(
                  f"def {old_name}(self)", f"def {new_name}(self)", 1
              ).replace(
                  'self.assertEqual("error", ',
                  'self.assertEqual("warning", ',
                  1,
              )
              text = text[:match.start()] + migrated + text[match.end():]

          target.write_text(text, encoding="utf-8")

          tests = importlib.import_module("tests.test_script_quality_modularization")
          contract = importlib.import_module("cyberppt.script_quality_contract")
          document = contract.parse_script_markdown(tests.BASELINE_SCRIPT)
          actual = {
              "document": tests.serialize_document(document),
              "issues": tests.serialize_issues(
                  contract.audit_script_quality(
                      document,
                      tests.BASELINE_OUTLINE,
                      tests.BASELINE_SOURCE_TRUTH,
                  )
              ),
          }
          tests.BASELINE_PATH.write_text(
              json.dumps(actual, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify migrated tests
        run: |
          python -m pytest -q \
            tests/test_script_quality_contract.py \
            tests/test_script_quality_modularization.py \
            tests/test_presentation_qa.py \
            tests/test_legacy_heuristic_severity.py
      - name: Commit migration and remove one-shot workflow
        run: |
          rm .github/workflows/phase3-test-contract-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Phase3: migrate legacy heuristic test expectations"
          git push origin HEAD:feat/stage01-heuristic-rule-isolation
