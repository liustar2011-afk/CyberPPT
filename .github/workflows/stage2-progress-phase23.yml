name: Stage2 progress Phase 2 and 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-progress-phase23.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record Phase 2 and 3 completion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("STAGE2_VISUAL_DESIGN_REFACTOR_PROGRESS.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- [ ] P2.1 定义 Region Graph 数据合同与 Schema。": "- [x] P2.1 定义 Region Graph 数据合同与 Schema。",
              "- [ ] P2.2 实现 topology → Region Graph 编译。": "- [x] P2.2 实现 topology → Region Graph 编译。",
              "- [ ] P2.3 实现 evidence / locked text → region binding。": "- [x] P2.3 实现 evidence / locked text → region binding。",
              "- [ ] P2.4 增加 Region Graph 审计与错误码。": "- [x] P2.4 增加 Region Graph 审计与错误码。",
              "- [ ] P2.5 投影到 PageArtifactSpec / Prompt IR。": "- [x] P2.5 投影到 PageArtifactSpec / Prompt IR。",
              "- [ ] P3.1 定义 `visual_medium_policy`。": "- [x] P3.1 定义 `visual_medium_policy`。",
              "- [ ] P3.2 将媒介选择与 relationship topology 解耦。": "- [x] P3.2 将媒介选择与 relationship topology 解耦。",
              "- [ ] P3.3 更新 Skill 规则、Schema 与审计。": "- [x] P3.3 更新 Skill 规则、Schema 与审计。",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)

          appendix = r'''

### P2.1｜Region Graph 数据合同与 Schema
状态：完成。

变更：新增 `cyberppt/region_graph.py` 与独立 `region-graph.schema.json`；Region 记录 `semantic_refs / role / anchor / weight / span / priority` 及可选 `text_ids`，仅表达归一化宏观语义空间，不记录像素模板。

主要 Commit：`3bcf58e65272abaa1efab802f073fa7ba461bb47`、`b34bfc35e66e1ffbf079a605ddade61facb4e471`、`4953e9be9cf7a7432617f15e694d1e7cc915829e`、`d2c677c7d58f9e3db3a3cfaf0ca503c271978c1f`。

### P2.2｜Topology → Region Graph
状态：完成。

变更：新增 `build_region_graph()`，覆盖 parallel / convergence / layered / flow / lifecycle / boundary / ecosystem / allocation / conclusion 九类 topology；Stage2 compiler 稳定输出 `region_graph`，不生成像素坐标。

主要 Commit：`ede6cbbd6ded6b54d19ae7c8f88dfdc6339c864f`、`2d4e4311201aaa11f647db249f7dc14bfc9d9660`、`d4b4b2b40a7299b515e2ce556b015174acc73bf5`。

### P2.3｜Exact Text → Region Binding
状态：完成。

变更：新增 `region_binding.py`；每个 evidence 的精确 `text_ids` 绑定到唯一 Region，`final_text.region_id` 从统一 `R_RELATION` 切换为真实 `RGxx`；旧 geometry 兼容字段暂保留。

主要 Commit：`cee53d42cb5b864d92da9a1866f28cb1011c4b88`、`6c6e5224981db18e741df257fbbb8f8789f63ffd`、`fe5bc175b8ca5401417a968df82f5c23384096e6`、`ff7296f01c3978a080724cdad72126d6759cacd4`。

### P2.4｜Region Graph Audit
状态：完成。

变更：新增 `region_graph_audit.py` 并接入视觉结构总审计，阻断缺失 Region Graph、P0/文字归属缺失、非法权重/角色/关系以及 topology 不匹配；旧 `R_RELATION` 规格保持兼容读取。

主要 Commit：`43c6b5e16ae9be8a0ccce3182a4daea28c1a21ae`、`5b1b33415cadbd68f0e2479e216aa39da75e70c0`、`9de751bd51fa9fd435bb73f5bf4068324679acd1`。

### P2.5｜PageArtifactSpec / FinalPromptIR 投影
状态：完成。

变更：`PageArtifactSpec` 增加可选 `RegionGraphSpec`，`FinalPromptIR` 增加 `RegionIR / RegionRelationIR / RegionGraphIR`；Region Graph 结构一路传到最终提示词 IR，本步骤不改变 renderer 文案。

代码 Commit：`d0d191f65357ffcdecf2f3acd1ce01b6da27ff00`。

### Phase 2｜Region Graph
状态：完成。Stage2 已形成 `Semantic Graph → Region Graph → PageArtifactSpec → FinalPromptIR` 结构链。

### P3.1｜Visual Medium Policy 合同
状态：完成。

变更：新增独立 `VisualMediumPolicy`，媒介枚举为 `business_scene / object_illustration / relationship_diagram / data_visualization / mixed`；scene policy 为 `required / allowed / forbidden / auto`。默认媒介策略只根据 scene policy 形成兼容边界，不根据 relationship topology 决定媒介。

主要 Commit：`e32528fe4398fed9e0c50a2f115d894b8654e0ea`、`435f6ea21da64eae974e674069a2afefd45c4e21`、`e11648beff904fdb3dd9e115335cfc223defefa9`。

### P3.2｜Medium / Topology 解耦
状态：完成。

变更：Stage2 execution design 独立解析 `visual_medium_policy`；visual budget 消费 medium policy，不再将 `parallel_set / flow / convergence` 等 topology 作为实景、插图或关系图的直接判定条件；保留旧 `_visual_budget(scene_policy-string)` 兼容入口。

代码 Commit：`66fd606e186998e37d3f5a4f5f595dd0e5e65a24`。

### P3.3｜Medium Policy 权威化
状态：完成。

变更：新增 `visual_medium_audit.py`；page spec 正式输出 `visual_medium_policy`，并投影到 `PageArtifactSpec`、`FinalPromptIR`；page schema、Skill、工作台指令与总审计同步。审计只校验 policy 自身及其与 scene policy 的一致性，不将 topology 作为媒介依据。

主要 Commit：`f69ba92c5c8bd7c836c1c09c103a3dfc660830d1`、`fcca149be064ea9194f3d25e8eeac6b4a9815ec5`、`3edba6f5596d3443ba33c45e27ae02b6dbae9be6`。

### Phase 3｜Visual Medium Policy
状态：完成。下一断点为 P4.1：正式 Prompt 消费 Region Graph、阅读轴、focus policy、medium policy 与文字归属。
'''
          if "### P2.1｜Region Graph 数据合同与 Schema" not in text:
              text = text.rstrip() + appendix + "\n"
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add STAGE2_VISUAL_DESIGN_REFACTOR_PROGRESS.md
          git commit -m "docs: record Phase 2 and 3 completion"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
