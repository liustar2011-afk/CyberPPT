name: Stage2 v3 apply step

on:
  push:
    branches:
      - feature/stage2-artifact-contract-v3
    paths:
      - cyberppt/acceptance_contract.py
      - cyberppt/composition_strategy.py
      - cyberppt/page_artifact_spec.py
      - scripts/imagegen_pipeline/final_prompt_ir.py
      - scripts/imagegen_pipeline/artifact_prompt.py
      - scripts/imagegen_pipeline/final_prompt_renderer.py
      - scripts/imagegen_pipeline/final_prompt_contract.py
      - scripts/imagegen_pipeline/prompt_compiler.py
      - scripts/imagegen_pipeline/handoff/prompt.py
      - scripts/imagegen_pipeline/imagegen_handoff.py
      - tests/test_acceptance*.py
      - tools/stage2_v3_*.py
      - .github/workflows/stage2-v3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-artifact-contract-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Integrate and validate Acceptance Contract v3
        run: python tools/stage2_v3_phase7_integrate.py
