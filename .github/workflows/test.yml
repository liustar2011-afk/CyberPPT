name: Stage 02 tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Stage 02 standalone contract and production regressions
        run: >-
          pytest -q
          tests/test_stage02_public_cli.py
          tests/test_stage02_cyberppt_script_adapter.py
          tests/test_stage02_handoff.py
          tests/test_relation_semantics_decoupling.py
          tests/test_page_artifact_spec.py
          tests/test_visual_structure_contract.py
          tests/test_final_script_pages.py
          tests/test_clean_base_generator.py
          tests/test_production_qa.py
          tests/test_production_readiness.py
          tests/test_extended_style_9.py
          tests/test_extended_style_9_assets.py
          tests/test_extended_style_10.py
          tests/test_style09_adapter.py
          tests/test_native_text_geometry.py
          tests/test_native_text_style.py
          tests/test_template_assembly.py
          tests/test_text_content_qa_order_insensitive.py
          tests/test_image_text_gate.py
          tests/test_codex_oauth_image_size.py
          tests/test_artifact_ledger.py
          tests/test_composition_and_carrier_resolver.py
          tests/test_visual_grammar.py
          tests/test_visual_prompt_consumer.py
          tests/test_visual_proof_preflight_diagnostics.py
          tests/test_imagegen_page_manifest.py
          tests/test_imagegen_prompt_diagnostics.py
          tests/test_prompt_compiler_production_entrypoints.py
          tests/test_presentation_qa.py
          tests/test_image_enhancer.py

      - name: Explain excluded integration/baseline suites
        run: |
          echo "OfficeCLI-render integration tests are intentionally outside the Linux unit gate."
          echo "Legacy exact-prompt and pre-decoupling relation tests are retained for migration review, not as v0.1 standalone acceptance criteria."

      - name: Package standalone source
        if: matrix.python-version == '3.12'
        run: |
          mkdir -p dist
          zip -qr dist/CyberPPT-Stage02-v0.1.0.zip . \
            -x '.git/*' 'dist/*' '*.pyc' '*/__pycache__/*' '.pytest_cache/*'

      - name: Upload standalone source
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: CyberPPT-Stage02-v0.1.0
          path: dist/CyberPPT-Stage02-v0.1.0.zip
          if-no-files-found: error
          retention-days: 7
