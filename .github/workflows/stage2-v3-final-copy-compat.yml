name: Stage2 v3 final compatibility gate

on:
  push:
    branches:
      - feature/stage2-artifact-contract-v3
    paths:
      - .github/workflows/stage2-v3-final-copy-compat.yml

permissions:
  contents: write

jobs:
  finalize-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-artifact-contract-v3
          fetch-depth: 0
      - name: Append final compatibility ledger
        run: |
          cat >> docs/development/stage2-artifact-contract-v3-progress.md <<'EOF'

          ## Final Compatibility Step A｜Copy Contract 新增回归清零

          状态：已完成

          已完成工作：
          - 对 Phase 1.1 基线与最终兼容修复前的 Python 3.12 全量失败集做精确集合差分。
          - 将旧 `onscreen as free source` 测试迁移为 v3 locked-copy 合同，authored visible copy 默认逐字锁定。
          - Final Prompt validator 增加 retired declaration gate，拒绝遗留 `Source onscreen text` 声明，避免形成双重文案权威。

          验证结果：
          - Phase 1.1 基线为 67 failed / 1930 passed；兼容修复前为 49 failed / 1998 passed。
          - 精确差分确认兼容修复前仅有 2 个 Stage2 v3 新增失败，同时已有 20 个基线失败被消除。
          - 专用门禁 run `34415399750` 执行 18 项 Copy Contract 定向回归，结果 18 passed。
          - 业务提交：`9a380951`（`fix(stage2): close final copy contract regressions`）。

          下一阶段工作：
          - Final Compatibility Step B：清理开发期专用 workflow、patch helper 和临时 CI trigger，随后以最终分支执行标准全量矩阵并再次进行基线失败集差分。

          ## Final Compatibility Step B｜开发脚手架清理与最终验收准备

          状态：已完成

          已完成工作：
          - 删除 Stage2 v3 开发期专用兼容 workflow。
          - 删除 Copy Contract、Visual Thesis、合同测试迁移相关 patch helper。
          - 删除临时全量 CI trigger 文件，正式 PR 不保留开发期执行脚手架。
          - 保留业务代码、正式测试、schema 与本开发台账作为最终交付范围。

          验证结果：
          - 清理动作与本台账更新采用同一原子提交，确保正式分支不存在仅供开发阶段使用的辅助文件。
          - OfficeCLI 基线与当前均使用 `1.0.145`；fixture 几何校验均有效。当前 smoke 的失败发生在外部运行时加载 `System.Private.Xml 10.0.0.0` 阶段，PR changed files 未涉及 OfficeCLI/runtime 链，按 hosted-runner 环境异常单独记录，不作为 Stage2 v3 代码回归。

          下一阶段工作：
          - Final Compatibility Step C：以清理后的最终 head 重新运行标准 Python 3.10/3.12、Windows/macOS wheel 与 OfficeCLI 矩阵；Python 失败集与 Phase 1.1 基线做最终差分，要求 Stage2 v3 新增失败为 0。
          - 完成 PR #29 checklist、最终验收评论和 Ready for Review 收口。
          EOF
      - name: Remove temporary development scaffolding
        run: |
          git rm -f \
            .github/workflows/stage2-v3-final-copy-compat.yml \
            tools/stage2_v3_final_contract_test_migrations.py \
            tools/stage2_v3_final_copy_compat.py \
            tools/stage2_v3_final_visual_thesis_compat.py \
            docs/development/stage2-v3-final-ci-trigger.md
          git add docs/development/stage2-artifact-contract-v3-progress.md
          test ! -e .github/workflows/stage2-v3-final-copy-compat.yml
          test ! -e tools/stage2_v3_final_contract_test_migrations.py
          test ! -e tools/stage2_v3_final_copy_compat.py
          test ! -e tools/stage2_v3_final_visual_thesis_compat.py
          test ! -e docs/development/stage2-v3-final-ci-trigger.md
      - name: Commit cleanup and ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(stage2): remove temporary compatibility scaffolding'
          git push origin HEAD:feature/stage2-artifact-contract-v3
