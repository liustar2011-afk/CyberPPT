name: Stage2 v3 final compatibility gate

on:
  push:
    branches:
      - feature/stage2-artifact-contract-v3
    paths:
      - .github/workflows/stage2-v3-final-copy-compat.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-artifact-contract-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch visual thesis compatibility
        run: python tools/stage2_v3_final_visual_thesis_compat.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused Visual Thesis compatibility tests
        run: |
          python -m pytest -q \
            tests/test_visual_thesis.py \
            tests/test_visual_thesis_compiler_contract.py \
            tests/test_stage2_focus_policy.py \
            tests/test_prompt_optimization_regressions.py \
            tests/test_visual_structure_stage.py
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cyberppt/visual_thesis.py tests/test_prompt_optimization_regressions.py tests/test_visual_structure_stage.py
          git commit -m 'fix(stage2): migrate legacy visual thesis fixtures'
          git push origin HEAD:feature/stage2-artifact-contract-v3
