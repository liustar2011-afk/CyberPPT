name: Stage2 v3 final compatibility gate

on:
  push:
    branches:
      - feature/stage2-artifact-contract-v3
    paths:
      - .github/workflows/stage2-v3-final-copy-compat.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-artifact-contract-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final Copy Contract regression cleanup
        run: python tools/stage2_v3_final_copy_compat.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused Copy Contract regression tests
        run: |
          python -m pytest -q \
            tests/test_artifact_prompt.py::ArtifactPromptTests::test_final_prompt_locks_authored_onscreen_copy_and_hides_full_copy \
            tests/test_final_prompt_contract.py::ValidateFinalPromptTests::test_rejects_duplicate_source_text_declaration \
            tests/test_copy_contract.py \
            tests/test_copy_contract_pipeline.py \
            tests/test_prompt_macro_structure.py \
            tests/test_final_prompt_renderer.py::RenderFinalPromptTests::test_visible_text_declarations_match_ir_exactly
      - name: Commit verified regression cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/imagegen_pipeline/final_prompt_contract.py tests/test_artifact_prompt.py
          git commit -m 'fix(stage2): close final copy contract regressions'
          git push origin HEAD:feature/stage2-artifact-contract-v3
