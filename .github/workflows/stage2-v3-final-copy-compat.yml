name: Stage2 v3 final compatibility gate

on:
  push:
    branches:
      - feature/stage2-artifact-contract-v3
    paths:
      - .github/workflows/stage2-v3-final-copy-compat.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stage2-artifact-contract-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate final contract assertions
        run: python tools/stage2_v3_final_contract_test_migrations.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused contract migration tests
        run: |
          python -m pytest -q \
            tests/test_text_capacity_v2.py \
            tests/test_page_artifact_spec.py::PageArtifactSpecTests::test_dense_text_no_longer_overrides_non_scene_visual_budget \
            tests/test_stage2_legacy_visual_compatibility.py::PageArtifactSpecTests::test_dense_text_no_longer_overrides_non_scene_visual_budget \
            tests/test_stage2_scene_policy.py::test_dense_page_does_not_override_visual_budget \
            tests/test_artifact_prompt.py::ArtifactPromptTests::test_artifact_compiler_uses_projection_as_sole_prompt_authority \
            tests/test_region_graph_compiler.py::test_lifecycle_loop_compiles_feedback_relation \
            tests/test_region_graph_composition_strategy.py
      - name: Commit verified migrations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_page_artifact_spec.py tests/test_stage2_scene_policy.py tests/test_artifact_prompt.py tests/test_region_graph_compiler.py
          git commit -m 'test(stage2): align compatibility assertions with v3 contracts'
          git push origin HEAD:feature/stage2-artifact-contract-v3
