name: Stage2 refactor P4.1 retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p4-1-retry.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reapply P4.1 and repair current-contract fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/stage2-refactor-p4-1.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), 'p4_1_patch.py', 'exec'), {})

          test = Path('tests/test_prompt_macro_structure.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'from cyberppt.region_graph import validate_region_graph\n',
              'from cyberppt.region_graph import validate_region_graph\nfrom cyberppt.page_artifact_spec import VisibleTextBindingSpec\n',
              1,
          )
          old = '''    graph = validate_region_graph({\n        "canvas_ratio": "2:1",\n        "primary_axis": "horizontal",\n        "regions": [\n            {"id": "RG01", "semantic_refs": ["E1"], "role": "stage", "anchor": "left", "weight": 0.5, "span": "compact", "priority": "primary", "text_ids": ["P01-T01"]},\n            {"id": "RG02", "semantic_refs": ["E2"], "role": "result", "anchor": "right", "weight": 0.5, "span": "compact", "priority": "primary", "text_ids": ["P01-T02"]},\n        ],\n        "relations": [{"from": "RG01", "to": "RG02", "type": "flow"}],\n    })\n'''
          new = '''    graph = validate_region_graph({\n        "canvas_ratio": "2:1",\n        "primary_axis": "horizontal",\n        "regions": [\n            {"id": "RG01", "semantic_refs": ["E1"], "role": "stage", "anchor": "left", "weight": 0.33, "span": "compact", "priority": "primary", "text_ids": ["P01-T01"]},\n            {"id": "RG02", "semantic_refs": ["E2"], "role": "stage", "anchor": "center", "weight": 0.34, "span": "compact", "priority": "primary", "text_ids": ["P01-T02"]},\n            {"id": "RG03", "semantic_refs": ["E3"], "role": "result", "anchor": "right", "weight": 0.33, "span": "compact", "priority": "primary", "text_ids": ["P01-T03"]},\n        ],\n        "relations": [\n            {"from": "RG01", "to": "RG02", "type": "flow"},\n            {"from": "RG02", "to": "RG03", "type": "flow"},\n        ],\n    })\n'''
          if old not in text:
              raise SystemExit('P4.1 fixture graph target not found')
          text = text.replace(old, new, 1)
          old = '''    composition = replace(base.composition, focus_policy="sequence_focus")\n    return replace(base, region_graph=graph, visual_medium_policy=policy, composition=composition)\n'''
          new = '''    composition = replace(base.composition, focus_policy="sequence_focus")\n    bindings = tuple(\n        VisibleTextBindingSpec(\n            text_id=f"P01-T{index:02d}",\n            text=visible_text,\n            root_id=f"ROOT-{index}",\n            order=index,\n            role="root_module",\n            hierarchy_level=1,\n        )\n        for index, visible_text in enumerate(base.typography.visible_text, start=1)\n    )\n    return replace(\n        base,\n        region_graph=graph,\n        visual_medium_policy=policy,\n        composition=composition,\n        visible_text_bindings=bindings,\n    )\n'''
          if old not in text:
              raise SystemExit('P4.1 fixture binding target not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'assert "Region 1: role stage; anchor left; relative share about 50%" in prompt',
              'assert "Region 1: role stage; anchor left; relative share about 33%" in prompt',
              1,
          )
          test.write_text(text, encoding='utf-8')
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run targeted regressions
        run: |
          python -m pytest -q tests/test_prompt_macro_structure.py tests/test_final_prompt_ir.py tests/test_final_prompt_renderer.py tests/test_page_artifact_spec.py tests/test_visual_medium_policy.py tests/test_region_graph_contract.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit, clean P4.1 runners, and safely rebase
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/page_artifact_spec.py scripts/imagegen_pipeline/final_prompt_ir.py scripts/imagegen_pipeline/artifact_prompt.py scripts/imagegen_pipeline/final_prompt_renderer.py scripts/imagegen_pipeline/final_prompt_contract.py tests/test_prompt_macro_structure.py
          git rm .github/workflows/stage2-refactor-p4-1.yml .github/workflows/stage2-refactor-p4-1-retry.yml
          git commit -m "feat(stage2): render macro visual authority in final prompt"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
