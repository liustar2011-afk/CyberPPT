name: Stage2 refactor P2.4 Region Graph audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p2-4.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Integrate Region Graph audit gates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("cyberppt/visual_structure_contract.py")
          text = path.read_text(encoding="utf-8")
          anchor = "from cyberppt.onscreen_expression import expression_constraints, expression_constraints_sha256\n"
          addition = "from cyberppt.region_graph_audit import audit_region_graph\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("P2.4 audit import anchor not found")
              text = text.replace(anchor, anchor + addition, 1)
          anchor = '''        _audit_focus_competition(page_spec, issue, page_id)\n        _audit_content_integrity_alignment(page_spec, issue, page_id)\n        _audit_topology_consistency(page_spec, issue, page_id)\n        _audit_grouping_decisions(page_spec, issue, page_id)\n\n        _audit_relationship_coverage(\n'''
          replacement = '''        _audit_focus_competition(page_spec, issue, page_id)\n        _audit_content_integrity_alignment(page_spec, issue, page_id)\n        _audit_topology_consistency(page_spec, issue, page_id)\n        _audit_grouping_decisions(page_spec, issue, page_id)\n        for region_issue in audit_region_graph(page_spec):\n            issue(region_issue["code"], region_issue["message"], page_id)\n\n        _audit_relationship_coverage(\n'''
          if anchor not in text:
              raise SystemExit("P2.4 audit call anchor not found")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run targeted regressions
        run: |
          python -m pytest -q tests/test_region_graph_audit.py tests/test_region_binding.py tests/test_region_graph_compiler.py tests/test_visual_structure_contract.py tests/test_visual_structure_stage.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit, self-clean, and safely rebase
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/visual_structure_contract.py
          git rm .github/workflows/stage2-refactor-p2-4.yml
          git commit -m "feat(stage2): enforce Region Graph audit gates"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
