name: Baseline47 Track C repair gates

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

permissions:
  contents: write

jobs:
  track-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: C1 - preserve source-boundary warning contract
        run: |
          python tools/baseline47_trackb_creative_brief_patch.py c1
          python -m pytest -q tests/test_content_route.py
          git add tests/test_content_route.py
          git commit -m 'test(baseline47): align content route evidence warning'
          git push origin HEAD:fix/baseline-47-regressions
      - name: C2 - migrate final script page prompt boundaries
        run: |
          python tools/baseline47_trackb_creative_brief_patch.py c2
          python -m pytest -q tests/test_final_script_pages.py
          git add tests/_final_script_pages_base.py
          git commit -m 'test(baseline47): align final script prompt boundaries'
          git push origin HEAD:fix/baseline-47-regressions
      - name: C3 - refresh script quality serialized fixtures
        run: |
          python tools/baseline47_trackb_creative_brief_patch.py c3
          python -m pytest -q tests/test_script_quality_modularization.py
          git add tests/fixtures/script_quality_contract_baseline.json tests/fixtures/script_quality_contract_baseline_2.json
          git commit -m 'test(baseline47): refresh authored onscreen source fixtures'
          git push origin HEAD:fix/baseline-47-regressions
      - name: C4 - align skill route test with canonical root policy
        run: |
          python tools/baseline47_trackb_creative_brief_patch.py c4
          python -m pytest -q tests/test_skill_contract.py
          git add tests/test_skill_contract.py
          git commit -m 'test(baseline47): follow canonical stage01 profile router'
          git push origin HEAD:fix/baseline-47-regressions
      - name: C5 - enforce deterministic LF text artifact writes
        run: |
          python tools/baseline47_trackb_creative_brief_patch.py c5
          python -m pytest -q tests/test_text_output_contract.py
          git add \
            scripts/image_to_pptx_runtime/authored_layers.py \
            scripts/image_to_pptx_runtime/svg_quality/checker.py \
            scripts/image_to_pptx_runtime/template_assembly.py \
            scripts/image_to_pptx_runtime/text_measure.py
          git commit -m 'fix(baseline47): enforce deterministic text newlines'
          git push origin HEAD:fix/baseline-47-regressions
      - name: Track C aggregate gate
        run: |
          python -m pytest -q \
            tests/test_content_route.py \
            tests/test_final_script_pages.py \
            tests/test_script_quality_modularization.py \
            tests/test_skill_contract.py \
            tests/test_text_output_contract.py
