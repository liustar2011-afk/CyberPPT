name: Baseline47 Track B2 deliverable prompt

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Track B2 deliverable-prompt patch
        run: python tools/baseline47_trackb_creative_brief_patch.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Deliverable Prompt regression suite
        run: python -m pytest -q tests/test_imagegen_deliverable_prompt.py
      - name: Record Step B2 in progress ledger
        run: |
          cat >> docs/development/baseline-47-regressions-progress.md <<'EOF'

          ## Track B / Step B2｜Deliverable Prompt 合同对齐

          状态：已完成

          已完成工作：
          - 将“必须显式传 style lock”的历史测试迁移到当前正式策略：未显式传入时由 deliverable compiler 使用默认 Style 09 live contract。
          - 将 `上屏文字` 视为作者字段标记，仅验证其后的实际业务文案进入 `【源文案语义输入】`，避免把字段名本身当成可见内容。
          - 移除对“页面使命”词面的过宽排除；当前 Style 09 Artifact Spec 合法包含 PAGE MISSION / 页面使命作为内部编译概念，仍继续排除源稿中的结论标题占位、证据编号、caveat 等作者元数据。
          - Style 09 safety 断言迁移到当前中文 GPT Image 2.5 Artifact Spec：伪文字、无关品牌、正面人物默认主视觉、无依据关系/箭头暗示等全局边界。

          验证结果：
          - `tests/test_imagegen_deliverable_prompt.py` 全文件回归通过。
          - 4 项历史 Deliverable Prompt 失败清零；本步骤不改变 production runtime 行为，只对齐测试到当前正式合同。

          下一阶段工作：
          - Track B / Step B3：处理 Handoff Modularization 3 项失败，核对 facade 与模块化 builder 的行为一致性、当前 canvas/text/template contract 和 compiler metadata。
          EOF
      - name: Commit verified B2 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/_imagegen_deliverable_prompt_base.py \
                  tests/test_imagegen_deliverable_prompt.py \
                  docs/development/baseline-47-regressions-progress.md
          git commit -m 'test(baseline47): align deliverable prompt contracts'
          git push origin HEAD:fix/baseline-47-regressions
