name: Baseline47 Track B3 handoff modularization

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Track B3 handoff-modularization patch
        run: python tools/baseline47_trackb_creative_brief_patch.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Handoff Modularization regression suite
        run: python -m pytest -q tests/test_imagegen_handoff_modularization.py
      - name: Record Step B3 in progress ledger
        run: |
          cat >> docs/development/baseline-47-regressions-progress.md <<'EOF'

          ## Track B / Step B3｜Handoff Modularization 合同对齐

          状态：已完成

          已完成工作：
          - 保留 facade 对 modular implementation 的直接对象同一性与行为完全相等验证，不引入兼容 wrapper 或重复实现。
          - 将 Style 09 断言从已废弃英文 `pure white background #FFFFFF` 迁移到当前中文 GPT Image 2.5 Artifact Spec live contract，并继续验证纯白 `#FFFFFF` / 深蓝 `#12355B` 色板。
          - 将旧 `Semantic anchor and composition` section 断言迁移到当前 content-first 非上屏上下文：页面使命、核心判断、页面内容素材，以及现行 terminal runtime lock。
          - 强化 compiler metadata 验证：`content-first-v1`、`full_image`、Style 09 id/name 和 `style.selected_lock` 注入规则均须保持一致。

          验证结果：
          - `tests/test_imagegen_handoff_modularization.py` 全文件回归通过。
          - 3 项历史 Handoff Modularization 失败清零；本步骤不改变 production runtime 行为。

          下一阶段工作：
          - Track B / Step B4：处理 Micro Freedom 1 项与 No Visual Structure 4 项，优先核对 exact visible copy 的 macro-region ownership 是否存在真实生产缺口，再迁移旧 wording/fixture。
          EOF
      - name: Commit verified B3 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_imagegen_handoff_modularization.py \
                  docs/development/baseline-47-regressions-progress.md
          git commit -m 'test(baseline47): align handoff modularization contracts'
          git push origin HEAD:fix/baseline-47-regressions
