name: Baseline47 OfficeCLI compatibility matrix

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

jobs:
  officecli-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.0.92"
            sha256: "deca2a87583bf8a25096cab9be6e626a48b787cf59875311b30c39a394970ffa"
          - version: "1.0.143"
            sha256: "188800425667173acd0aa2f5c2018ddbb3896ce2ae1c2f8bd25588252f430f58"
          - version: "1.0.145"
            sha256: "449f0e6a1298e3c6d7da792d26ab53d04ba77bd990f299b51123c7aef383d2ce"
          - version: "1.0.148"
            sha256: "e424210bce9355f498eeaf692b4d2b13f1f3422e1db34636c41f54c36025249b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download verified OfficeCLI candidate
        shell: bash
        run: |
          set -euo pipefail
          version='${{ matrix.version }}'
          url="https://github.com/iOfficeAI/OfficeCLI/releases/download/v${version}/officecli-linux-x64"
          curl -fL --retry 3 "$url" -o officecli
          echo '${{ matrix.sha256 }}  officecli' | sha256sum -c -
          chmod +x officecli
          ./officecli --version
      - name: Create deterministic PPTX fixture
        run: |
          python -m pip install python-pptx
          python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches, Pt

          prs = Presentation()
          prs.slide_width = Inches(13.333333)
          prs.slide_height = Inches(7.5)
          slide = prs.slides.add_slide(prs.slide_layouts[6])
          box = slide.shapes.add_textbox(Inches(1), Inches(1), Inches(11), Inches(1.5))
          run = box.text_frame.paragraphs[0].add_run()
          run.text = 'CyberPPT OfficeCLI candidate'
          run.font.size = Pt(28)
          prs.save('fixture.pptx')
          PY
      - name: Run exact production HTML command
        shell: bash
        run: |
          set -euo pipefail
          ./officecli view fixture.pptx html --start 1 --end 1 > slide.html
          test -s slide.html
          grep -Fq 'CyberPPT OfficeCLI candidate' slide.html
          echo "candidate ${{ matrix.version }} passed production HTML command"
