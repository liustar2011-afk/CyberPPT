name: Baseline47 Track B aggregate validation

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

jobs:
  track-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Track B aggregate regression suite
        run: |
          python -m pytest -q \
            tests/test_imagegen_creative_brief.py \
            tests/test_imagegen_deliverable_prompt.py \
            tests/test_imagegen_handoff_modularization.py \
            tests/test_imagegen_micro_freedom.py \
            tests/test_imagegen_no_visual_structure.py \
            tests/test_imagegen_page_manifest.py \
            tests/test_imagegen_prompt_diagnostics.py \
            tests/test_visual_grammar.py
