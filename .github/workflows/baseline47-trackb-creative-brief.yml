name: Baseline47 OfficeCLI pin validation

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-trackb-creative-brief.yml

jobs:
  officecli-143-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch workspace to candidate OfficeCLI v1.0.143 pin
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cyberppt/officecli.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'OFFICECLI_VERSION = "1.0.145"': 'OFFICECLI_VERSION = "1.0.143"',
              '449f0e6a1298e3c6d7da792d26ab53d04ba77bd990f299b51123c7aef383d2ce': '6a29c598a789b57c92c03e560907d3f131a4bd0a068785b1d338a86fc31a58a7',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'candidate pin replacement mismatch: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Install CyberPPT and locked Node dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install candidate pinned OfficeCLI
        run: python -m cyberppt officecli install
      - name: Create deterministic one-slide PPTX fixture
        run: |
          mkdir -p officecli-smoke
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches, Pt

          output = Path('officecli-smoke/fixture.pptx')
          prs = Presentation()
          prs.slide_width = Inches(13.333333)
          prs.slide_height = Inches(7.5)
          slide = prs.slides.add_slide(prs.slide_layouts[6])
          box = slide.shapes.add_textbox(Inches(1.0), Inches(1.0), Inches(11.0), Inches(1.5))
          frame = box.text_frame
          frame.clear()
          paragraph = frame.paragraphs[0]
          run = paragraph.add_run()
          run.text = 'CyberPPT OfficeCLI v1.0.143 render smoke'
          run.font.size = Pt(28)
          prs.save(output)
          print(output.resolve())
          PY
      - name: Run production OfficeCLI geometry and render QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cyberppt.commands.production_qa import run_officecli_render_qa

          qa_dir = Path('officecli-smoke/qa')
          report = run_officecli_render_qa(Path('officecli-smoke/fixture.pptx'), qa_dir)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report['officecli']['version'] == '1.0.143'
          assert report['passed'] is True
          rendered_pages = [Path(path) for path in report['rendered_pages']]
          assert len(rendered_pages) == 1
          assert all(path.is_file() and path.stat().st_size > 0 for path in rendered_pages)
          assert Path(report['report_path']).is_file()
          PY
      - name: Upload OfficeCLI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officecli-143-render-smoke
          path: officecli-smoke/
          if-no-files-found: error
