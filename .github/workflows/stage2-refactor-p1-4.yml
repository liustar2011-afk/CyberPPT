name: Stage2 refactor P1.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p1-4.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply compatibility-safe P1.4 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{label} target not found: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          compiler = Path("cyberppt/visual_stage/compiler.py")
          replace_once(compiler, '''ALLOWED_FOCUS_POLICIES = {\n    "single_anchor",\n    "paired_focus",\n    "peer_field",\n    "distributed_focus",\n    "sequence_focus",\n}\n\n_FOCUS_POLICY_BY_TOPOLOGY = {''', '''ALLOWED_FOCUS_POLICIES = {\n    "single_anchor",\n    "paired_focus",\n    "peer_field",\n    "distributed_focus",\n    "sequence_focus",\n}\n\nALLOWED_SCENE_POLICIES = {\n    "required",\n    "allowed",\n    "forbidden",\n    "auto",\n}\n\n_FOCUS_POLICY_BY_TOPOLOGY = {''', "compiler scene-policy constants")
          replace_once(compiler, '''def _render_business_relationships(value: object) -> str:\n''', '''def _resolve_scene_policy(design: dict[str, Any] | None, *, prompt_mode: str) -> str:\n    design = design if isinstance(design, dict) else {}\n    requested = str(design.get("scene_policy") or "").strip()\n    if requested:\n        if requested not in ALLOWED_SCENE_POLICIES:\n            _fail(f"unsupported scene_policy {requested!r}")\n        return requested\n    legacy = design.get("use_scene")\n    if isinstance(legacy, bool):\n        return "required" if legacy else "forbidden"\n    return "auto" if prompt_mode == "semantic_brief" else "forbidden"\n\n\ndef _legacy_use_scene(design: dict[str, Any] | None, scene_policy: str) -> bool:\n    design = design if isinstance(design, dict) else {}\n    legacy = design.get("use_scene")\n    if isinstance(legacy, bool):\n        return legacy\n    return scene_policy == "required"\n\n\ndef _render_business_relationships(value: object) -> str:\n''', "compiler scene-policy helper")
          replace_once(compiler, '''            "semantic_role": "承载已声明业务对象、动作、条件与结果",\n            "use_scene": False,\n            "scene_type": "由ImageGen依据页面语义和Style lock判断",\n''', '''            "semantic_role": "承载已声明业务对象、动作、条件与结果",\n            "scene_policy": "auto",\n            # Deprecated compatibility field only; scene_policy is authoritative.\n            "use_scene": False,\n            "scene_type": "由ImageGen依据页面语义和Style lock判断",\n''', "semantic-brief scene policy")
          replace_once(compiler, '''    if not missing and not corrupted:\n        return {\n            **normalized,\n            "semantic_role": str(design.get("semantic_role") or normalized["relationship_encoding"]).strip(),\n            "use_scene": design.get("use_scene") if isinstance(design.get("use_scene"), bool) else False,\n            "scene_type": str(design.get("scene_type") or "不使用实景，由选定业务关系场承载").strip(),\n        }\n''', '''    if not missing and not corrupted:\n        scene_policy = _resolve_scene_policy(design, prompt_mode=prompt_mode)\n        return {\n            **normalized,\n            "semantic_role": str(design.get("semantic_role") or normalized["relationship_encoding"]).strip(),\n            "scene_policy": scene_policy,\n            # Deprecated compatibility field only; scene_policy is authoritative.\n            "use_scene": _legacy_use_scene(design, scene_policy),\n            "scene_type": str(design.get("scene_type") or "由场景策略和业务关系场共同决定").strip(),\n        }\n''', "directed scene normalization")
          replace_once(compiler, '''        "semantic_role": f"以{subject}的对象、动作和结果关系证明本页判断",\n        "use_scene": False,\n        "scene_type": "不使用实景，由选定业务关系场承载",\n''', '''        "semantic_role": f"以{subject}的对象、动作和结果关系证明本页判断",\n        "scene_policy": "forbidden",\n        "use_scene": False,\n        "scene_type": "不使用实景，由选定业务关系场承载",\n''', "fallback scene policy")
          replace_once(compiler, '''    dense_text_page = is_text_dense(expected_text)\n    visual_budget = (\n        {\n            "mode": "relationship_field_only" if dense_text_page else "shared_field",\n            "max_auxiliary_fragments": 0 if dense_text_page else 1,\n            "scope": "page",\n            "region_local_visuals": False,\n        }\n        if prompt_mode == "semantic_brief" or topology == "parallel_set" or not bool(design["use_scene"])\n        else {\n            "mode": "integrated_scene",\n            "max_auxiliary_fragments": 4,\n            "scope": "region",\n            "region_local_visuals": True,\n        }\n    )\n''', '''    dense_text_page = is_text_dense(expected_text)\n    scene_policy = str(design["scene_policy"])\n    if dense_text_page and scene_policy != "required":\n        visual_budget = {\n            "mode": "relationship_field_only",\n            "max_auxiliary_fragments": 0,\n            "scope": "page",\n            "region_local_visuals": False,\n        }\n    elif topology == "parallel_set" or scene_policy == "forbidden":\n        visual_budget = {\n            "mode": "shared_field",\n            "max_auxiliary_fragments": 1,\n            "scope": "page",\n            "region_local_visuals": False,\n        }\n    else:\n        visual_budget = {\n            "mode": "integrated_scene",\n            "max_auxiliary_fragments": 4,\n            "scope": "region",\n            "region_local_visuals": True,\n        }\n''', "visual budget scene-policy routing")
          replace_once(compiler, '''        "image_plan": {\n            "use_scene": bool(design["use_scene"]),\n            "scene_type": str(design["scene_type"]),\n''', '''        "image_plan": {\n            "scene_policy": scene_policy,\n            # Deprecated compatibility field only; scene_policy is authoritative.\n            "use_scene": bool(design["use_scene"]),\n            "scene_type": str(design["scene_type"]),\n''', "compiled image-plan scene policy")
          replace_once(compiler, '''            "### 页面草图", f"- 唯一业务关系场：{page['image_plan']['business_object']}",\n            f"- 配图预算：{visual_budget.get('mode', 'integrated_scene')}；最多辅助片段 {visual_budget.get('max_auxiliary_fragments', 4)} 个；作用域 {visual_budget.get('scope', 'region')}；区域局部配图 {visual_budget.get('region_local_visuals', True)}", "",\n''', '''            "### 页面草图", f"- 唯一业务关系场：{page['image_plan']['business_object']}",\n            f"- 场景策略：{page['image_plan'].get('scene_policy', 'auto')}",\n            f"- 配图预算：{visual_budget.get('mode', 'integrated_scene')}；最多辅助片段 {visual_budget.get('max_auxiliary_fragments', 4)} 个；作用域 {visual_budget.get('scope', 'region')}；区域局部配图 {visual_budget.get('region_local_visuals', True)}", "",\n''', "visual markdown scene policy")

          schema_path = Path("vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          image_props = schema["properties"]["image_plan"]["properties"]
          image_props["scene_policy"] = {"enum": ["required", "allowed", "forbidden", "auto"], "description": "Authoritative scene-use policy for new Stage2 output; optional only for legacy compatibility."}
          image_props["use_scene"]["description"] = "Deprecated compatibility field. New logic must consume scene_policy when present."
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          artifact = Path("cyberppt/page_artifact_spec.py")
          replace_once(artifact, '''class VisualCarrierSpec:\n    business_object: str\n    semantic_role: str\n    use_scene: bool\n    scene_type: str\n''', '''class VisualCarrierSpec:\n    business_object: str\n    semantic_role: str\n    use_scene: bool\n    scene_type: str\n    scene_policy: str = "auto"\n\n    def __post_init__(self) -> None:\n        if self.scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n            raise ValueError(f"unsupported scene policy: {self.scene_policy!r}")\n''', "VisualCarrierSpec scene policy")
          replace_once(artifact, '''def _visual_budget(\n    visual_page: Mapping[str, object],\n    *,\n    topology: str,\n    use_scene: bool,\n    visible_text: tuple[str, ...] = (),\n) -> VisualBudgetSpec:\n''', '''def _visual_budget(\n    visual_page: Mapping[str, object],\n    *,\n    topology: str,\n    scene_policy: str | None = None,\n    use_scene: bool | None = None,\n    visible_text: tuple[str, ...] = (),\n) -> VisualBudgetSpec:\n''', "visual budget compatibility signature")
          replace_once(artifact, '''    if is_text_dense(visible_text) and (topology == "parallel_set" or not use_scene):\n        return VisualBudgetSpec(\n            mode="relationship_field_only",\n            max_auxiliary_fragments=0,\n            scope="page",\n            region_local_visuals=False,\n        )\n    if not use_scene:\n        return VisualBudgetSpec(\n            mode="shared_field",\n            max_auxiliary_fragments=1,\n            scope="page",\n            region_local_visuals=False,\n        )\n    return VisualBudgetSpec()\n''', '''    resolved_policy = str(scene_policy or "").strip()\n    if not resolved_policy:\n        if isinstance(use_scene, bool):\n            resolved_policy = "required" if use_scene else "forbidden"\n        else:\n            resolved_policy = "auto"\n    if resolved_policy not in {"required", "allowed", "forbidden", "auto"}:\n        raise ValueError(f"unsupported scene policy for visual budget: {resolved_policy!r}")\n    if is_text_dense(visible_text) and resolved_policy != "required":\n        return VisualBudgetSpec(mode="relationship_field_only", max_auxiliary_fragments=0, scope="page", region_local_visuals=False)\n    if topology == "parallel_set" or resolved_policy == "forbidden":\n        return VisualBudgetSpec(mode="shared_field", max_auxiliary_fragments=1, scope="page", region_local_visuals=False)\n    return VisualBudgetSpec()\n''', "visual budget policy logic")
          replace_once(artifact, '''    image_plan = visual_page.get("image_plan")\n    image_plan = image_plan if isinstance(image_plan, dict) else {}\n    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError("artifact spec image plan use_scene must be boolean")\n''', '''    image_plan = visual_page.get("image_plan")\n    image_plan = image_plan if isinstance(image_plan, dict) else {}\n    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError("artifact spec image plan use_scene must be boolean")\n    scene_policy = str(image_plan.get("scene_policy") or "").strip()\n    if scene_policy:\n        if scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n            raise ValueError(f"artifact spec image plan has invalid scene_policy: {scene_policy!r}")\n    else:\n        scene_policy = "required" if use_scene else "forbidden"\n''', "artifact image-plan policy read")
          replace_once(artifact, '''            semantic_role=_required_text(image_plan.get("semantic_role"), "visual carrier semantic role"),\n            use_scene=use_scene,\n            scene_type=_required_text(image_plan.get("scene_type"), "visual carrier scene type"),\n        ),\n''', '''            semantic_role=_required_text(image_plan.get("semantic_role"), "visual carrier semantic role"),\n            use_scene=use_scene,\n            scene_type=_required_text(image_plan.get("scene_type"), "visual carrier scene type"),\n            scene_policy=scene_policy,\n        ),\n''', "artifact VisualCarrierSpec build")
          replace_once(artifact, '''        visual_budget=_visual_budget(\n            visual_page,\n            topology=str(semantic_graph.get("topology") or ""),\n            use_scene=use_scene,\n            visible_text=visible_text,\n        ),\n''', '''        visual_budget=_visual_budget(\n            visual_page,\n            topology=str(semantic_graph.get("topology") or ""),\n            scene_policy=scene_policy,\n            use_scene=use_scene,\n            visible_text=visible_text,\n        ),\n''', "artifact visual budget call")

          contract = Path("cyberppt/visual_structure_contract.py")
          replace_once(contract, '''def audit_visual_design_package(\n''', '''_ALLOWED_SCENE_POLICIES = {"required", "allowed", "forbidden", "auto"}\n\n\ndef _scene_policy_from_execution_design(execution_design: object, *, prompt_mode: str) -> str | None:\n    design = execution_design if isinstance(execution_design, dict) else {}\n    requested = str(design.get("scene_policy") or "").strip()\n    if requested:\n        return requested if requested in _ALLOWED_SCENE_POLICIES else None\n    legacy = design.get("use_scene")\n    if isinstance(legacy, bool):\n        return "required" if legacy else "forbidden"\n    return "auto" if prompt_mode == "semantic_brief" else None\n\n\ndef audit_visual_design_package(\n''', "visual contract policy helper")
          replace_once(contract, '''        if prompt_mode == "directed_composition" and (not isinstance(execution_design, dict) or any(\n            not str(execution_design.get(key) or "").strip()\n            for key in required_execution_text\n        ) or not isinstance(execution_design.get("use_scene"), bool)):\n            issue(\n                "EXECUTION_DESIGN_INVALID",\n                "Selected execution design must preserve its carrier, scene policy, semantic role, composition, and text integration.",\n                page_id,\n            )\n''', '''        execution_scene_policy = _scene_policy_from_execution_design(execution_design, prompt_mode=prompt_mode)\n        if prompt_mode == "directed_composition" and (not isinstance(execution_design, dict) or any(\n            not str(execution_design.get(key) or "").strip()\n            for key in required_execution_text\n        ) or execution_scene_policy is None):\n            issue(\n                "EXECUTION_DESIGN_INVALID",\n                "Selected execution design must preserve its carrier, scene policy, semantic role, composition, and text integration.",\n                page_id,\n            )\n''', "execution design policy validation")
          replace_once(contract, '''                expected_scene = {\n                    "business_object": execution_design.get("business_object"),\n                    "semantic_role": execution_design.get("semantic_role"),\n                    "use_scene": execution_design.get("use_scene"),\n                    "scene_type": execution_design.get("scene_type"),\n                }\n                actual_scene = {key: image_plan.get(key) for key in expected_scene}\n                if actual_scene != expected_scene:\n                    issue(\n                        "SPEC_SCENE_POLICY_DRIFTED",\n                        "Spec image plan must match the selected carrier and scene policy.",\n                        page_id,\n                    )\n''', '''                expected_scene = {\n                    "business_object": execution_design.get("business_object"),\n                    "semantic_role": execution_design.get("semantic_role"),\n                    "scene_type": execution_design.get("scene_type"),\n                }\n                actual_scene = {key: image_plan.get(key) for key in expected_scene}\n                scene_drift = actual_scene != expected_scene\n                expected_scene_policy = _scene_policy_from_execution_design(execution_design, prompt_mode=prompt_mode)\n                actual_scene_policy = str(image_plan.get("scene_policy") or "").strip()\n                if actual_scene_policy and actual_scene_policy != expected_scene_policy:\n                    scene_drift = True\n                legacy_use_scene = execution_design.get("use_scene")\n                if isinstance(legacy_use_scene, bool) and image_plan.get("use_scene") != legacy_use_scene:\n                    scene_drift = True\n                if scene_drift:\n                    issue(\n                        "SPEC_SCENE_POLICY_DRIFTED",\n                        "Spec image plan must match the selected carrier and scene policy.",\n                        page_id,\n                    )\n''', "scene-policy drift compatibility")

          consumer = Path("cyberppt/visual_prompt_consumer.py")
          replace_once(consumer, '''    page_block_sha256: str\n    source_mode: str\n''', '''    page_block_sha256: str\n    source_mode: str\n    scene_policy: str = "auto"\n''', "VisualDesignIR policy field")
          replace_once(consumer, '''    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError(f"VisualDesignIR field image_plan.use_scene must be boolean: {source_path}")\n    return VisualDesignIR(\n''', '''    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError(f"VisualDesignIR field image_plan.use_scene must be boolean: {source_path}")\n    scene_policy = str(image_plan.get("scene_policy") or "").strip()\n    if not scene_policy:\n        scene_policy = "required" if use_scene else "forbidden"\n    if scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n        raise ValueError(f"VisualDesignIR field image_plan.scene_policy is invalid: {source_path}")\n    return VisualDesignIR(\n''', "VisualDesignIR policy read")
          replace_once(consumer, '''        page_block_sha256=_sha256_text(json.dumps(spec, ensure_ascii=False, sort_keys=True)),\n        source_mode="governed_json",\n    )\n''', '''        page_block_sha256=_sha256_text(json.dumps(spec, ensure_ascii=False, sort_keys=True)),\n        source_mode="governed_json",\n        scene_policy=scene_policy,\n    )\n''', "VisualDesignIR governed policy constructor")
          replace_once(consumer, '''        page_block_sha256=_sha256_text(page_block), source_mode="legacy_markdown",\n    )\n''', '''        page_block_sha256=_sha256_text(page_block), source_mode="legacy_markdown",\n        scene_policy="forbidden",\n    )\n''', "VisualDesignIR legacy policy")
          replace_once(consumer, '''    scene = "使用场景" if ir.use_scene else "不使用场景"\n''', '''    scene = {\n        "required": "必须使用场景",\n        "allowed": "允许使用场景",\n        "forbidden": "不使用场景",\n        "auto": "由页面语义与Style lock判断是否使用场景",\n    }[ir.scene_policy]\n''', "visual prompt scene policy rendering")

          execution = Path("cyberppt/visual_stage/execution.py")
          text = execution.read_text(encoding="utf-8")
          old = "For semantic_brief, decide only the semantic focus, source-supported relationship boundary, evidence grouping and exact-text binding; omit execution_design or treat it as non-authoritative advice, leaving scene, carrier, spatial organization and supporting detail to ImageGen. For directed_composition, provide the full authoritative execution_design with business_object, visual_focus, semantic_role, use_scene, scene_type, text_integration_method, spatial_organization and relationship_encoding."
          new = "For semantic_brief, decide only the semantic focus, source-supported relationship boundary, evidence grouping and exact-text binding; omit execution_design or treat it as non-authoritative advice. The compiler will set scene_policy=auto so scene use remains open to page semantics and Style lock. For directed_composition, provide the full authoritative execution_design with business_object, visual_focus, semantic_role, scene_policy, scene_type, text_integration_method, spatial_organization and relationship_encoding; scene_policy must be required, allowed, forbidden, or auto. use_scene is legacy compatibility only and must not be authored as the new authority."
          if old not in text:
              raise SystemExit("execution invocation scene-policy sentence not found")
          execution.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill = Path("vendor/skills/ppt-visual-structure-designer/SKILL.md")
          replace_once(skill, '''当页面`prompt_mode`为`semantic_brief`时，本阶段锁定语义焦点、来源支持的关系边界、证据分组和精确文字绑定；场景、载体、空间组织与辅助细节交由ImageGen结合语义和Style lock决定。''', '''当页面`prompt_mode`为`semantic_brief`时，本阶段锁定语义焦点、来源支持的关系边界、证据分组和精确文字绑定；编译器写入`scene_policy: auto`，使场景、对象插图或纯关系表达继续由页面语义与Style lock共同判断，`semantic_brief`身份本身不得提前禁止场景。载体、空间组织与辅助细节仍按当前合同交由ImageGen决定。''', "Skill semantic-brief policy")
          replace_once(skill, '''`directed_composition`页必须提供完整`execution_design`，写明`business_object`、`visual_focus`、`semantic_role`、布尔值`use_scene`、`scene_type`、`text_integration_method`、`spatial_organization`和`relationship_encoding`。''', '''`directed_composition`页必须提供完整`execution_design`，写明`business_object`、`visual_focus`、`semantic_role`、`scene_policy`、`scene_type`、`text_integration_method`、`spatial_organization`和`relationship_encoding`。`scene_policy`只允许`required`、`allowed`、`forbidden`、`auto`；新决策不再把布尔值`use_scene`作为权威字段。仓库仅为旧项目保留`use_scene=true → required`、`use_scene=false → forbidden`的兼容读取。''', "Skill directed policy")

          gates = Path("vendor/skills/ppt-visual-structure-designer/references/quality-gates.md")
          replace_once(gates, '''- `directed_composition`没有明确对象、位置、阅读路径和连接方向。\n''', '''- `directed_composition`没有明确对象、位置、阅读路径和连接方向。\n- 新决策的`scene_policy`不在`required / allowed / forbidden / auto`中，或仍把布尔值`use_scene`作为权威场景合同。\n- `semantic_brief`被无来源地显式设为`scene_policy: forbidden`，导致场景或业务插图在进入ImageGen前被提前排除。\n''', "quality gates scene policy")

          output_contract = Path("vendor/skills/ppt-visual-structure-designer/references/output-contract.md")
          replace_once(output_contract, '''    "semantic_role": "该对象如何证明页面判断",\n    "use_scene": false,\n    "scene_type": "选中的非场景关系场或真实业务场景",\n''', '''    "semantic_role": "该对象如何证明页面判断",\n    "scene_policy": "allowed",\n    "scene_type": "允许使用的真实业务场景或非场景关系场",\n''', "output contract example scene policy")
          replace_once(output_contract, '''- 选择`use_scene: false`时，仍须用具体业务对象及其关系构成图义场；选择场景时，场景必须直接解释该关系，不能作为装饰背景。''', '''- `scene_policy: forbidden`时，仍须用具体业务对象及其关系构成图义场；`required`时场景必须直接解释该关系；`allowed`与`auto`保留媒介选择空间，场景不得作为装饰背景。旧项目中的`use_scene`仅用于兼容映射。''', "output contract scene-policy rule")

          validator = Path("vendor/skills/ppt-visual-structure-designer/scripts/validate_visual_spec.py")
          replace_once(validator, '''    prompt_mode = str(page.get("prompt_mode") or "directed_composition")\n    if schema_version == "1.1" and prompt_mode == "directed_composition":\n''', '''    prompt_mode = str(page.get("prompt_mode") or "directed_composition")\n    scene_policy = str(ip.get("scene_policy") or "").strip()\n    if scene_policy and scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n        add(issues, "error", "scene_policy_invalid", "scene_policy must be required, allowed, forbidden, or auto", n)\n    if schema_version == "1.1" and prompt_mode == "semantic_brief" and scene_policy == "forbidden":\n        add(issues, "error", "semantic_brief_scene_forbidden", "semantic_brief must not explicitly forbid scene use before ImageGen evaluates page semantics and Style lock", n)\n    if schema_version == "1.1" and prompt_mode == "directed_composition":\n''', "validator scene-policy setup")
          replace_once(validator, '''        if ip.get("use_scene") is False and not CONCRETE_RELATION_RE.search("\\n".join((carrier, semantic_role, organization, encoding))):\n''', '''        resolved_scene_forbidden = scene_policy == "forbidden" or (not scene_policy and ip.get("use_scene") is False)\n        if resolved_scene_forbidden and not CONCRETE_RELATION_RE.search("\\n".join((carrier, semantic_role, organization, encoding))):\n''', "validator non-scene compatibility")

          test = Path("tests/test_stage2_scene_policy.py")
          test.write_text('''from cyberppt.commands.visual_structure_stage import _build_executable_page, _decision_execution_design\nfrom cyberppt.onscreen_expression import expression_constraints\nfrom cyberppt.page_artifact_spec import _visual_budget\n\n\ndef _expression_fit(form: str):\n    constraints = expression_constraints(form)\n    return {"form": form, "constraint_status": "default_profile", "satisfied_constraints": list(constraints["required_features"]), "reading_relation": str(constraints["relation_pattern"]), "balance_strategy": str(constraints["balance_requirement"]), "changed_constraints": [], "deviation_reason": ""}\n\n\ndef test_semantic_brief_defaults_to_auto_without_changing_legacy_bool():\n    source = {"prompt_mode": "semantic_brief", "core_judgment": "Judgment", "business_relationships": []}\n    design = _decision_execution_design(source, {}, {}, "P01")\n    assert design["scene_policy"] == "auto"\n    assert design["use_scene"] is False\n\n\ndef test_directed_legacy_scene_bool_maps_to_policy_and_new_policy_is_supported():\n    source = {"prompt_mode": "directed_composition", "core_judgment": "Judgment", "business_relationships": []}\n    base = {"business_object": "Business field", "visual_focus": "Result", "text_integration_method": "Attach text to business objects", "spatial_organization": "Inputs converge into the result", "relationship_encoding": "Source-supported relation", "semantic_role": "Prove the relation", "scene_type": "Business operating scene"}\n    forbidden = _decision_execution_design(source, {"execution_design": base | {"use_scene": False}}, {}, "P01")\n    required = _decision_execution_design(source, {"execution_design": base | {"use_scene": True}}, {}, "P01")\n    allowed = _decision_execution_design(source, {"execution_design": base | {"scene_policy": "allowed"}}, {}, "P01")\n    assert (forbidden["scene_policy"], forbidden["use_scene"]) == ("forbidden", False)\n    assert (required["scene_policy"], required["use_scene"]) == ("required", True)\n    assert (allowed["scene_policy"], allowed["use_scene"]) == ("allowed", False)\n\n\ndef test_semantic_brief_auto_no_longer_forces_shared_field_budget():\n    form = "flow_3_5"\n    source = {"page_id": "p01", "page_number": 1, "page_title": "Title", "prompt_mode": "semantic_brief", "page_mission": "Explain how one approved input reaches the approved result.", "core_judgment": "The approved relationship forms one coherent business field.", "locked_text_items": [{"text_id": "P01-T01", "text": "Input"}, {"text_id": "P01-T02", "text": "Result"}], "business_relationships": [{"subject": "Input", "relation": "supports", "objects": ["Result"]}], "expression_constraints": expression_constraints(form)}\n    decision = {"page_id": "p01", "evidence_units": [{"key": "input", "summary": "Input", "text_ids": ["P01-T01"]}, {"key": "result", "summary": "Result", "text_ids": ["P01-T02"]}], "candidates": [{"id": "c1", "visual_thesis": "Input and result remain visibly connected in one business field.", "semantic_focus": {"kind": "entity", "evidence_key": "result"}, "reading_sequence": ["input", "result"], "spatial_grammar": ["path"], "topology": "directed_flow", "direction": "left_to_right", "visual_intent_type": "relationship_field", "expression_fit": _expression_fit(form)}], "selected_candidate": "c1"}\n    page = _build_executable_page(source, decision)\n    assert page["image_plan"]["scene_policy"] == "auto"\n    assert page["image_plan"]["use_scene"] is False\n    assert page["visual_budget"]["mode"] == "integrated_scene"\n\n\ndef test_visual_budget_keeps_legacy_use_scene_callers_and_accepts_auto():\n    legacy = _visual_budget({}, topology="layered_architecture", use_scene=False)\n    auto = _visual_budget({}, topology="layered_architecture", scene_policy="auto", use_scene=False)\n    assert legacy.mode == "shared_field"\n    assert auto.mode == "integrated_scene"\n''', encoding="utf-8")
          PY
