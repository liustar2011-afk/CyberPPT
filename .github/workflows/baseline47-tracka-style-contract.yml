name: Baseline47 Track A2 style contracts

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-tracka-style-contract.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Track A2 style contract patch
        run: python tools/baseline47_tracka_style_contract_patch.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Style 09/10 live-contract tests
        run: python -m pytest -q tests/test_extended_style_9.py tests/test_extended_style_10.py
      - name: Record Step A2 in progress ledger
        run: |
          cat >> docs/development/baseline-47-regressions-progress.md <<'EOF'

          ## Track A / Step A2｜Style 09/10 Live Contract 对齐

          状态：已完成

          已完成工作：
          - Style 09 测试断言从已废弃英文 prompt contract 迁移到当前 `references/visual-system.md` 中文 GPT Image 2.5 Artifact Spec 执行合同。
          - Style 09 的 palette、主焦点、构图机制、场景/图标职责与终端收口均按当前 live contract 验证。
          - Style 10 测试改为验证当前独立 `visual-system-10.md` 的 scene-led / locked-copy 合同。
          - 修正 Style 10 registry 的 reference sample：从 `palette-09.png` 改为仓库已存在的专属 `palette-10.png`。

          验证结果：
          - `tests/test_extended_style_9.py + tests/test_extended_style_10.py` 全部通过。
          - 未回退当前 Style 09/10 live contract；测试与 registry 对当前实际资源完成对齐。

          下一阶段工作：
          - Track A / Step A3：将 4 项 Style Lock Snapshot 历史测试迁移到当前“live style 默认刷新、显式 immutable 才冻结”的正式策略，并补足行为边界验证。
          EOF
      - name: Commit verified Track A2 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/imagegen_pipeline/style_presets/cyberppt_default_styles.json \
                  tests/test_extended_style_9.py \
                  tests/test_extended_style_10.py \
                  docs/development/baseline-47-regressions-progress.md
          git commit -m 'test(baseline47): align live style contracts'
          git push origin HEAD:fix/baseline-47-regressions
