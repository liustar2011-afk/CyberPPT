name: CyberPPT file-boundary finalizer

on:
  push:
    branches:
      - agent/stage-file-boundary

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-file-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply final fixes
        run: python scripts/_finalize_stage_file_boundary.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Focused regressions
        run: python -m pytest -q tests/test_stage_file_boundary.py tests/test_imagegen_page_manifest.py tests/test_page_artifact_spec.py tests/test_visual_structure_stage.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/_finalize_stage_file_boundary.py .github/workflows/stage-file-boundary-finalize.yml
          git checkout origin/main -- .github/workflows/tests.yml
          git add -A
          git status --short
          git commit -m "refactor: finalize Stage2 file-only boundary"
          git push origin HEAD:agent/stage-file-boundary
