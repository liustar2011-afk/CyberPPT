name: CyberPPT tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development capabilities
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Environment check
        run: |
          python -m pip check
          python -m pytest --version
      - name: Import production runtime
        run: |
          python -c "import cyberppt, script_engine; import scripts.imagegen_pipeline.page_manifest; import scripts.image_to_pptx_runtime.stage02_adapter"
      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee "pytest-${{ matrix.python-version }}.log"
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
      - name: Build wheel
        run: python -m build --wheel
      - name: Wheel import smoke outside repository
        run: |
          python -m pip install --force-reinstall --no-deps dist/cyberppt-*.whl
          cd /tmp
          python -c "from pathlib import Path; import cyberppt, script_engine, contracts, references, assets; import scripts.imagegen_pipeline.page_manifest; from scripts.image_to_pptx_runtime import stage02_adapter, pptx_animations; from scripts.imagegen_pipeline.style_library import STYLE_LIBRARY_PATH, VISUAL_SYSTEM_PATH; from scripts.image_to_pptx_runtime.pptx_shapes.loader import BUNDLED_DEFINITIONS_PATH, BUNDLED_SHAPE_TYPES_PATH; runtime_dir = Path(stage02_adapter.__file__).resolve().parent; animation_presets = runtime_dir / 'pptx_animation_presets.json'; editor_static = runtime_dir / 'svg_editor' / 'static'; assert STYLE_LIBRARY_PATH.is_file(); assert VISUAL_SYSTEM_PATH.is_file(); assert BUNDLED_DEFINITIONS_PATH.is_file(); assert BUNDLED_SHAPE_TYPES_PATH.is_file(); assert animation_presets.is_file(); assert len(pptx_animations.NATIVE_ANIMATIONS) == 203; assert (editor_static / 'index.html').is_file(); assert (editor_static / 'app.js').is_file(); assert (editor_static / 'style.css').is_file()"

  officecli-smoke:
    name: OfficeCLI render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install CyberPPT and locked Node dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned OfficeCLI
        run: python -m cyberppt officecli install
      - name: Create deterministic one-slide PPTX fixture
        run: |
          mkdir -p officecli-smoke
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.util import Inches, Pt

          output = Path("officecli-smoke/fixture.pptx")
          prs = Presentation()
          prs.slide_width = Inches(13.333333)
          prs.slide_height = Inches(7.5)
          slide = prs.slides.add_slide(prs.slide_layouts[6])
          box = slide.shapes.add_textbox(Inches(1.0), Inches(1.0), Inches(11.0), Inches(1.5))
          frame = box.text_frame
          frame.clear()
          paragraph = frame.paragraphs[0]
          run = paragraph.add_run()
          run.text = "CyberPPT OfficeCLI render smoke"
          run.font.size = Pt(28)
          prs.save(output)
          print(output.resolve())
          PY
      - name: Run production OfficeCLI geometry and render QA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cyberppt.commands.production_qa import run_officecli_render_qa

          qa_dir = Path("officecli-smoke/qa")
          report = run_officecli_render_qa(Path("officecli-smoke/fixture.pptx"), qa_dir)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report["passed"] is True
          page_images = [Path(path) for path in report["page_images"]]
          assert len(page_images) == 1
          assert all(path.is_file() and path.stat().st_size > 0 for path in page_images)
          assert Path(report["report_path"]).is_file()
          PY
      - name: Upload OfficeCLI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: officecli-render-smoke
          path: officecli-smoke/
          if-no-files-found: error
