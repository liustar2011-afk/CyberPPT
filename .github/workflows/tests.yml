name: CyberPPT file-boundary finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/stage-file-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final file-boundary fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          # Execution receipt: audit and writer bind to the same raw input-file SHA.
          path = 'cyberppt/visual_stage/execution.py'
          text = read(path)
          old = '''            "approved_script": str(script),
            "visual_design_input": str(design_input),'''
          new = '''            "approved_script": str(script),
            "approved_script_sha256": _sha256(script),
            "visual_design_input": str(design_input),'''
          if old not in text:
              raise RuntimeError('execution receipt insertion point not found')
          text = text.replace(old, new, 1)
          write(path, text)

          # Stage2 production core uses script-input terminology only.
          path = 'cyberppt/stage02_production/models.py'
          text = read(path)
          if '    handoff_sha256: str\n' not in text:
              raise RuntimeError('Stage02BuildContext.handoff_sha256 not found')
          text = text.replace('    handoff_sha256: str\n', '    script_input_sha256: str\n', 1)
          write(path, text)

          path = 'cyberppt/stage02_production/preflight.py'
          text = read(path)
          old = 'handoff_sha256=sha256_file(script_input_path) or ""'
          if old not in text:
              raise RuntimeError('preflight handoff hash assignment not found')
          text = text.replace(old, 'script_input_sha256=sha256_file(script_input_path) or ""', 1)
          write(path, text)

          # ImageGen compact-blueprint test consumes canonical Stage2 intake.
          path = 'tests/test_imagegen_page_manifest.py'
          text = read(path)
          text = text.replace(
              'def test_compact_blueprint_uses_handoff_locked_text_without_full_prose(self) -> None:',
              'def test_compact_blueprint_uses_script_input_locked_text_without_full_prose(self) -> None:',
              1,
          )
          text = text.replace(
              '            handoff = {\n                "schema": "cyberppt.stage02_handoff.v1",',
              '            script_input = {\n                "schema": "cyberppt.stage02_script_input.v1",',
              1,
          )
          old = '''            handoff_path = project / "workbench/stages/02-handoff/stage02-handoff.json"
            handoff_path.parent.mkdir(parents=True, exist_ok=True)
            handoff_path.write_text(json.dumps(handoff, ensure_ascii=False), encoding="utf-8")
            with patch(
                "cyberppt.stage02_handoff.load_stage02_handoff",
                return_value=handoff,
            ):'''
          new = '''            input_path = project / "workbench/stages/02-input/script-intake.json"
            input_path.parent.mkdir(parents=True, exist_ok=True)
            input_path.write_text(json.dumps(script_input, ensure_ascii=False), encoding="utf-8")
            with patch(
                "cyberppt.stage02_input.load_stage02_input",
                return_value=script_input,
            ):'''
          if old not in text:
              raise RuntimeError('compact-blueprint legacy handoff fixture not found')
          text = text.replace(old, new, 1)
          write(path, text)

          # Artifact-spec loader test creates the canonical intake file it hashes.
          path = 'tests/test_page_artifact_spec.py'
          text = read(path)
          old = '''            handoff_path = project / "workbench/stages/02-handoff/stage02-handoff.json"
            handoff_path.parent.mkdir(parents=True)
            handoff_path.write_text("{}\n", encoding="utf-8")'''
          new = '''            input_path = project / "workbench/stages/02-input/script-intake.json"
            input_path.parent.mkdir(parents=True)
            input_path.write_text("{}\n", encoding="utf-8")'''
          if old not in text:
              raise RuntimeError('artifact-spec legacy handoff path not found')
          text = text.replace(old, new, 1)
          write(path, text)

          # Visual-structure freshness test prepares Stage2 intake directly.
          path = 'tests/test_visual_structure_stage.py'
          text = read(path)
          pattern = re.compile(
              r'''            stage01 = project / "workbench" / "stages" / "01-analysis"\n.*?            visual = project / "visual"\n''',
              re.S,
          )
          replacement = '''            from cyberppt.stage02_input import INPUT_JSON, prepare_stage02_input

            input_report = prepare_stage02_input(project, script=script)
            self.assertEqual("passed", input_report["status"])
            script_input = project / INPUT_JSON
            visual = project / "visual"
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'visual legacy fixture replacement count={count}')
          old_hash = 'json.dumps({"source_sha256": _sha256(handoff)})'
          if old_hash not in text:
              raise RuntimeError('visual legacy source hash not found')
          text = text.replace(old_hash, 'json.dumps({"source_sha256": _sha256(script_input)})', 1)
          write(path, text)

          # Architecture regression also forbids the retired core field name.
          path = 'tests/test_stage_file_boundary.py'
          text = read(path)
          marker = '    for token in ("deck-plan.json","foundation.json","source-truth.json","outline.json"): assert token not in text\n'
          if marker not in text:
              raise RuntimeError('architecture marker not found')
          text = text.replace(marker, marker + '    assert "handoff_sha256" not in text\n', 1)
          write(path, text)
          PY
      - name: Restore normal CI and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/stage-file-boundary-finalize.yml || true
          git checkout origin/main -- .github/workflows/tests.yml
          git add -A
          git status --short
          git commit -m 'refactor: finalize Stage2 file-only boundary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
