name: CyberPPT tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Environment check
        run: |
          python -m pip check
          python -m pytest --version
      - name: Run test suite
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Smoke test installed wheel outside repository
        run: |
          python -m venv --system-site-packages /tmp/cyberppt-wheel-smoke
          /tmp/cyberppt-wheel-smoke/bin/python -m pip install --no-deps dist/cyberppt-*.whl
          cd /tmp
          /tmp/cyberppt-wheel-smoke/bin/python - <<'PY'
          import cyberppt
          import script_engine
          import scripts.imagegen_pipeline.page_manifest
          import scripts.image_to_pptx_runtime.stage02_adapter
          import scripts.presentation_qa.render_page
          print("wheel smoke: ok")
          PY
