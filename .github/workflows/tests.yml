name: CyberPPT tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development capabilities
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Environment check
        run: |
          python -m pip check
          python -m pytest --version
      - name: Import production runtime
        run: |
          python -c "import cyberppt, script_engine; import scripts.imagegen_pipeline.page_manifest; import scripts.image_to_pptx_runtime.stage02_adapter"
      - name: Run test suite
        run: python -m pytest -q
