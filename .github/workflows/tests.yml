name: CyberPPT final cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/flow-convergence-fcccab6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Clean generated diff noise
        run: python scripts/_cleanup_flow_diff.py
      - name: Validate diff and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: clean generated diff noise"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
