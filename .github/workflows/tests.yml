name: CyberPPT convergence bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'agent/flow-convergence-fcccab6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply convergence patch
        run: python scripts/_apply_flow_convergence.py
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "refactor: converge Stage01 Stage02 authority boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
