name: Stage2 refactor P1.4 fixture closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p1-4-final2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reuse verified P1.4 patch and fix Skill fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/stage2-refactor-p1-4-final.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow:
              raise SystemExit('verified P1.4 patch block start not found')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(body), 'p1_4_verified_patch.py', 'exec'), {})

          fixture = Path('vendor/skills/ppt-visual-structure-designer/scripts/test_domain_neutral_fixtures.py')
          text = fixture.read_text(encoding='utf-8')
          old = '''    page["image_plan"] = {\n        "use_scene": False,\n'''
          new = '''    page["image_plan"] = {\n        "scene_policy": "forbidden",\n        "use_scene": False,\n'''
          if old not in text:
              raise SystemExit('domain-neutral fixture image_plan target not found')
          fixture.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Skill fixture regression
        run: |
          python vendor/skills/ppt-visual-structure-designer/scripts/test_domain_neutral_fixtures.py
      - name: Run targeted regression
        run: |
          python -m pytest -q tests/test_stage2_scene_policy.py tests/test_visual_structure_stage.py tests/test_visual_structure_contract.py tests/test_page_artifact_spec.py tests/test_visual_prompt_consumer.py tests/test_final_prompt_ir.py tests/test_final_prompt_renderer.py tests/test_visual_structure_skill_fixtures.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit and safely rebase P1.4
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/visual_stage/compiler.py cyberppt/visual_stage/execution.py cyberppt/visual_structure_contract.py cyberppt/page_artifact_spec.py cyberppt/visual_prompt_consumer.py vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json vendor/skills/ppt-visual-structure-designer/SKILL.md vendor/skills/ppt-visual-structure-designer/references/quality-gates.md vendor/skills/ppt-visual-structure-designer/references/output-contract.md vendor/skills/ppt-visual-structure-designer/scripts/validate_visual_spec.py vendor/skills/ppt-visual-structure-designer/scripts/test_domain_neutral_fixtures.py tests/test_visual_structure_stage.py tests/test_stage2_scene_policy.py tests/test_page_artifact_spec.py
          git commit -m "fix(stage2): close scene policy contract"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
