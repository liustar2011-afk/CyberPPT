name: Stage2 refactor P5.2 visual signatures

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p5-2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Add image-level visual signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cyberppt/full_image_rhythm.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from PIL import Image, ImageDraw, ImageOps\n', 'from PIL import Image, ImageDraw, ImageFilter, ImageOps\n', 1)
          anchor = '\n\ndef build_manifest_contact_sheet(\n'
          addition = r'''

VISUAL_SIGNATURE_SCHEMA = "cyberppt.full_image_visual_signature.v1"


def _gravity_label(value: float, negative: str, neutral: str, positive: str) -> str:
    if value < 0.42:
        return negative
    if value > 0.58:
        return positive
    return neutral


def _edge_activity(path: Path, *, size: tuple[int, int] = (96, 48)) -> tuple[list[int], int, int]:
    with Image.open(path) as source:
        gray = source.convert("L").resize(size, Image.Resampling.LANCZOS)
    edge = gray.filter(ImageFilter.FIND_EDGES)
    width, height = edge.size
    pixels = list(edge.getdata())
    # FIND_EDGES exaggerates the outermost frame. Ignore that synthetic border.
    clean: list[int] = []
    for y in range(height):
        for x in range(width):
            value = pixels[y * width + x]
            clean.append(0 if x in {0, width - 1} or y in {0, height - 1} else int(value))
    return clean, width, height


def _structure_hash(activity: Sequence[int], width: int, height: int) -> str:
    image = Image.new("L", (width, height))
    image.putdata(activity)
    small = image.resize((8, 8), Image.Resampling.BILINEAR)
    values = list(small.getdata())
    mean = sum(values) / len(values)
    bits = ''.join('1' if value >= mean else '0' for value in values)
    return f"{int(bits, 2):016x}"


def build_page_visual_signature(
    path: Path,
    *,
    page_number: int,
    visual_medium: str = "unspecified",
) -> dict[str, Any]:
    """Measure coarse composition from a finished full image without OCR."""

    path = Path(path)
    if page_number <= 0:
        raise ValueError("visual signature requires a positive page number")
    if not path.is_file():
        raise FileNotFoundError(path)
    activity, width, height = _edge_activity(path)
    total = float(sum(activity))
    if total <= 0:
        gx = gy = 0.5
    else:
        gx = sum((index % width) * value for index, value in enumerate(activity)) / total / max(1, width - 1)
        gy = sum((index // width) * value for index, value in enumerate(activity)) / total / max(1, height - 1)

    bin_mass = [0.0] * 9
    for index, value in enumerate(activity):
        x = index % width
        y = index // width
        col = min(2, int(x * 3 / width))
        row = min(2, int(y * 3 / height))
        bin_mass[row * 3 + col] += value
    shares = [mass / total if total else 0.0 for mass in bin_mass]
    skeleton = ''.join('1' if share >= 0.08 else '0' for share in shares)
    density_score = total / max(1, width * height)
    density = "sparse" if density_score < 12 else ("medium" if density_score < 28 else "dense")

    return {
        "schema": VISUAL_SIGNATURE_SCHEMA,
        "page_number": int(page_number),
        "source_path": str(path),
        "source_sha256": sha256(path.read_bytes()).hexdigest(),
        "visual_medium": str(visual_medium or "unspecified"),
        "gravity": {
            "x": round(gx, 4),
            "y": round(gy, 4),
            "horizontal": _gravity_label(gx, "left", "center", "right"),
            "vertical": _gravity_label(gy, "top", "middle", "bottom"),
        },
        "density": density,
        "density_score": round(density_score, 4),
        "skeleton_3x3": skeleton,
        "skeleton_shares": [round(value, 4) for value in shares],
        "structure_hash": _structure_hash(activity, width, height),
    }


def _pair_visual_medium(pair: Mapping[str, object]) -> str:
    full = pair.get("full")
    full = full if isinstance(full, Mapping) else {}
    debug = full.get("debug_receipt")
    debug = debug if isinstance(debug, Mapping) else {}
    policy = debug.get("visual_medium_policy")
    policy = policy if isinstance(policy, Mapping) else {}
    preferred = str(policy.get("preferred") or "").strip()
    if preferred:
        return preferred
    for owner in (pair, full):
        candidate = owner.get("visual_medium_policy") if isinstance(owner, Mapping) else None
        if isinstance(candidate, Mapping):
            preferred = str(candidate.get("preferred") or "").strip()
            if preferred:
                return preferred
    return "unspecified"


def build_manifest_visual_signatures(manifest: Mapping[str, object]) -> list[dict[str, Any]]:
    entries = audited_full_image_entries(manifest)
    pairs = manifest.get("pairs")
    pair_by_page = {
        int(pair.get("page_number") or 0): pair
        for pair in pairs if isinstance(pair, Mapping)
    } if isinstance(pairs, list) else {}
    return [
        build_page_visual_signature(
            path,
            page_number=page_number,
            visual_medium=_pair_visual_medium(pair_by_page.get(page_number, {})),
        )
        for page_number, path in entries
    ]
'''
          if 'VISUAL_SIGNATURE_SCHEMA' not in text:
              if anchor not in text:
                  raise SystemExit('P5.2 insertion anchor not found')
              text = text.replace(anchor, addition + anchor, 1)
          text = text.replace('    "CONTACT_SHEET_SCHEMA",\n', '    "CONTACT_SHEET_SCHEMA",\n    "VISUAL_SIGNATURE_SCHEMA",\n', 1)
          text = text.replace('    "build_manifest_contact_sheet",\n', '    "build_manifest_contact_sheet",\n    "build_manifest_visual_signatures",\n    "build_page_visual_signature",\n', 1)
          p.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_full_image_visual_signature.py <<'PY'
          from pathlib import Path

          from PIL import Image, ImageDraw

          from cyberppt.full_image_rhythm import build_manifest_visual_signatures, build_page_visual_signature


          def _canvas(path: Path, side: str) -> Path:
              image = Image.new("RGB", (300, 150), "white")
              draw = ImageDraw.Draw(image)
              if side == "left":
                  draw.rectangle((15, 25, 95, 125), fill="black")
              elif side == "right":
                  draw.rectangle((205, 25, 285, 125), fill="black")
              elif side == "dense":
                  for x in range(10, 290, 20):
                      for y in range(10, 140, 20):
                          draw.rectangle((x, y, x + 8, y + 8), fill="black")
              image.save(path)
              return path


          def test_signature_distinguishes_left_and_right_visual_gravity(tmp_path):
              left = build_page_visual_signature(_canvas(tmp_path / "left.png", "left"), page_number=1)
              right = build_page_visual_signature(_canvas(tmp_path / "right.png", "right"), page_number=2)
              assert left["gravity"]["horizontal"] == "left"
              assert right["gravity"]["horizontal"] == "right"
              assert left["structure_hash"] != right["structure_hash"]
              assert len(left["skeleton_3x3"]) == 9


          def test_signature_density_responds_to_actual_edge_activity(tmp_path):
              sparse = build_page_visual_signature(_canvas(tmp_path / "sparse.png", "left"), page_number=1)
              dense = build_page_visual_signature(_canvas(tmp_path / "dense.png", "dense"), page_number=2)
              assert dense["density_score"] > sparse["density_score"]
              assert dense["density"] in {"medium", "dense"}


          def test_manifest_signature_uses_audited_visual_medium_metadata(tmp_path):
              image = _canvas(tmp_path / "page.png", "left")
              manifest = {
                  "pairs": [{
                      "page_number": 1,
                      "full": {
                          "path": str(image),
                          "text_audit": {"valid": True},
                          "debug_receipt": {
                              "visual_medium_policy": {"preferred": "business_scene"}
                          },
                      },
                  }]
              }
              signatures = build_manifest_visual_signatures(manifest)
              assert signatures[0]["visual_medium"] == "business_scene"
              assert signatures[0]["source_sha256"]
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run P5.2 regressions
        run: python -m pytest -q tests/test_full_image_visual_signature.py tests/test_full_image_contact_sheet.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit, self-clean, and safely rebase
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/full_image_rhythm.py tests/test_full_image_visual_signature.py
          git rm .github/workflows/stage2-refactor-p5-2.yml
          git commit -m "feat(stage2): measure full-image visual signatures"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
