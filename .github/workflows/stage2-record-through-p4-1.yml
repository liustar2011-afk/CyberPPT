name: Stage2 record progress through P4.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-record-through-p4-1.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update durable Stage2 progress record
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('STAGE2_VISUAL_DESIGN_REFACTOR_PROGRESS.md')
          text = p.read_text(encoding='utf-8')
          for step in ('P2.1','P2.2','P2.3','P2.4','P2.5','P3.1','P3.2','P3.3','P4.1'):
              text = text.replace(f'- [ ] {step} ', f'- [x] {step} ', 1)
          appendix = r'''

### P2.1｜Region Graph 数据合同与 Schema
状态：完成。新增 `cyberppt/region_graph.py`、独立 `region-graph.schema.json` 并接入 page visual schema；Region 记录语义引用、角色、锚点、相对权重、跨度、优先级和可选文字归属，不记录像素模板。

主要 Commit：`3bcf58e65272abaa1efab802f073fa7ba461bb47`、`b34bfc35e66e1ffbf079a605ddade61facb4e471`、`4953e9be9cf7a7432617f15e694d1e7cc915829e`、`d2c677c7d58f9e3db3a3cfaf0ca503c271978c1f`。

### P2.2｜Topology → Region Graph
状态：完成。`build_region_graph()` 覆盖 parallel / convergence / layered / flow / lifecycle / boundary / ecosystem / allocation / conclusion 九类 topology；compiler 稳定输出 Region Graph，不生成像素坐标。

主要 Commit：`ede6cbbd6ded6b54d19ae7c8f88dfdc6339c864f`、`2d4e4311201aaa11f647db249f7dc14bfc9d9660`、`d4b4b2b40a7299b515e2ce556b015174acc73bf5`。

### P2.3｜Exact Text → Region Binding
状态：完成。新增 `region_binding.py`；每个 evidence 的精确 `text_ids` 归属唯一 Region，`final_text.region_id` 从统一 `R_RELATION` 切换为真实 `RGxx`。

主要 Commit：`cee53d42cb5b864d92da9a1866f28cb1011c4b88`、`6c6e5224981db18e741df257fbbb8f8789f63ffd`、`fe5bc175b8ca5401417a968df82f5c23384096e6`、`ff7296f01c3978a080724cdad72126d6759cacd4`。

### P2.4｜Region Graph Audit
状态：完成。新增 `region_graph_audit.py` 并接入视觉结构总审计，阻断缺失 Region Graph、P0/文字归属缺失、非法权重/角色/关系及 topology 不匹配；旧规格保留兼容读取。

主要 Commit：`43c6b5e16ae9be8a0ccce3182a4daea28c1a21ae`、`5b1b33415cadbd68f0e2479e216aa39da75e70c0`、`9de751bd51fa9fd435bb73f5bf4068324679acd1`。

### P2.5｜PageArtifactSpec / FinalPromptIR 投影
状态：完成。Region Graph 可从 Stage2 visual spec 进入 `PageArtifactSpec` 并继续进入结构化 `FinalPromptIR`。

代码 Commit：`d0d191f65357ffcdecf2f3acd1ce01b6da27ff00`。

### Phase 2｜Region Graph
状态：完成。已形成 `Semantic Graph → Region Graph → PageArtifactSpec → FinalPromptIR` 的结构链。

### P3.1｜Visual Medium Policy 合同
状态：完成。新增 `business_scene / object_illustration / relationship_diagram / data_visualization / mixed` 五类媒介及独立 scene policy，媒介合同不从 topology 推导。

主要 Commit：`e32528fe4398fed9e0c50a2f115d894b8654e0ea`、`435f6ea21da64eae974e674069a2afefd45c4e21`、`e11648beff904fdb3dd9e115335cfc223defefa9`。

### P3.2｜Medium / Topology 解耦
状态：完成。Stage2 execution design 独立解析 `visual_medium_policy`；visual budget 不再将 parallel / flow / convergence 等 topology 作为实景、插图或关系图的直接媒介依据。

代码 Commit：`66fd606e186998e37d3f5a4f5f595dd0e5e65a24`。

### P3.3｜Medium Policy 权威化
状态：完成。新增媒介审计并接入 page spec、PageArtifactSpec、FinalPromptIR、Skill、Schema 和总审计；审计只校验媒介合同自身及 scene policy 一致性。

主要 Commit：`f69ba92c5c8bd7c836c1c09c103a3dfc660830d1`、`fcca149be064ea9194f3d25e8eeac6b4a9815ec5`、`3edba6f5596d3443ba33c45e27ae02b6dbae9be6`。

### Phase 3｜Visual Medium Policy
状态：完成。媒介选择已经与 relationship topology 解耦。

### P4.1｜Prompt 消费宏观视觉权威
状态：完成。最终 Prompt 已明确消费 Region Graph 宏观区域、阅读轴、`focus_policy`、`visual_medium_policy`、scene policy 和 exact-text 区域归属；`semantic_brief` 在存在 Region Graph 时不再把宏观空间组织重新交给 ImageGen。内部 `RGxx / E* / text-id / root_module` 等标识不会泄漏到最终 Prompt。

验证：P4.1 定向回归通过；最终 runner 完整 `pytest -q` 通过并成功推送。

代码 Commit：`731a99ea8fb9961969d0fec1cffe1034e9ab86d2`。

### Phase 4｜当前断点
P4.1 完成；下一步骤为 P4.2，明确 ImageGen 仅保留 Region 内部的微观视觉自由，禁止改变宏观区域、文字归属、focus、关系类型和媒介边界。
'''
          if '### P2.1｜Region Graph 数据合同与 Schema' not in text:
              text = text.rstrip() + appendix + '\n'
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit progress and self-clean
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add STAGE2_VISUAL_DESIGN_REFACTOR_PROGRESS.md
          git rm .github/workflows/stage2-record-through-p4-1.yml
          git commit -m "docs: record Stage2 progress through P4.1"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
