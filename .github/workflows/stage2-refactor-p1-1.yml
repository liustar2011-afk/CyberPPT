name: Stage2 refactor P1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p1-1.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply P1.1 patch
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path("cyberppt/visual_structure_contract.py")
          text = contract.read_text(encoding="utf-8")
          old = '''    if (\n        not isinstance(dimensions, dict)\n        or set(dimensions) != _FEASIBILITY_DIMENSIONS\n        or any(not isinstance(value, int) or not 0 <= value <= 20 for value in dimensions.values())\n        or sum(dimensions.values()) != 100\n        or score != 100\n        or not isinstance(feasibility.get("risks"), list)\n    ):\n        issue("CANDIDATE_GENERATION_SCORE_INVALID", f"{candidate.get('id')!s} must provide five 0–20 generation dimensions totaling 100.", page_id)\n        return None\n    return score\n'''
          new = '''    valid_dimensions = (\n        isinstance(dimensions, dict)\n        and set(dimensions) == _FEASIBILITY_DIMENSIONS\n        and all(isinstance(value, int) and 0 <= value <= 20 for value in dimensions.values())\n    )\n    total = sum(dimensions.values()) if valid_dimensions else -1\n    if (\n        not valid_dimensions\n        or score != total\n        or not 0 <= score <= 100\n        or not isinstance(feasibility.get("risks"), list)\n    ):\n        issue(\n            "CANDIDATE_GENERATION_SCORE_INVALID",\n            f"{candidate.get('id')!s} must provide five 0–20 generation dimensions "\n            "with score equal to their 0–100 sum.",\n            page_id,\n        )\n        return None\n    return score\n'''
          if old not in text:
              raise SystemExit("P1.1 contract target block not found")
          contract.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill = Path("vendor/skills/ppt-visual-structure-designer/SKILL.md")
          skill_text = skill.read_text(encoding="utf-8")
          old_skill = "每项为0–20整数，总分必须为100，并列出风险。"
          new_skill = "每项为0–20整数，五项之和形成0–100的可生成性总分；`score`必须等于五项实际得分之和，并列出风险。"
          if old_skill not in skill_text:
              raise SystemExit("P1.1 Skill score sentence not found")
          skill.write_text(skill_text.replace(old_skill, new_skill, 1), encoding="utf-8")

          test = Path("tests/test_stage2_generation_feasibility_score.py")
          test.write_text('''from cyberppt.visual_structure_contract import _audit_generation_feasibility\n\n\ndef _candidate(*, score: int, dimensions: dict[str, int]):\n    return {\n        "id": "C1",\n        "selection_rationale": {\n            "generation_feasibility": {\n                "score": score,\n                "dimensions": dimensions,\n                "risks": [],\n            }\n        },\n    }\n\n\ndef _collector():\n    issues = []\n\n    def issue(code, message, page_id=None):\n        issues.append({"code": code, "message": message, "page_id": page_id})\n\n    return issues, issue\n\n\ndef test_generation_feasibility_accepts_real_nonperfect_score():\n    dimensions = {\n        "single_focus": 20,\n        "text_capacity": 17,\n        "relation_clarity": 19,\n        "composition_stability": 18,\n        "anti_pattern_risk": 18,\n    }\n    issues, issue = _collector()\n\n    score = _audit_generation_feasibility(\n        _candidate(score=92, dimensions=dimensions), issue, "p01"\n    )\n\n    assert score == 92\n    assert issues == []\n\n\ndef test_generation_feasibility_rejects_score_sum_mismatch():\n    dimensions = {\n        "single_focus": 20,\n        "text_capacity": 17,\n        "relation_clarity": 19,\n        "composition_stability": 18,\n        "anti_pattern_risk": 18,\n    }\n    issues, issue = _collector()\n\n    score = _audit_generation_feasibility(\n        _candidate(score=100, dimensions=dimensions), issue, "p01"\n    )\n\n    assert score is None\n    assert [item["code"] for item in issues] == ["CANDIDATE_GENERATION_SCORE_INVALID"]\n''', encoding="utf-8")
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run targeted regression
        run: |
          python -m pytest -q tests/test_stage2_generation_feasibility_score.py tests/test_visual_structure_contract.py tests/test_visual_structure_stage.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit P1.1
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/visual_structure_contract.py vendor/skills/ppt-visual-structure-designer/SKILL.md tests/test_stage2_generation_feasibility_score.py
          git commit -m "fix(stage2): allow real generation feasibility scores"
          git push origin HEAD:main
