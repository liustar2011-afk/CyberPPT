name: Apply D4b artifact copy tests

on:
  push:
    branches:
      - codex/stage02-d4b-artifact-copy-contract
    paths:
      - .github/workflows/apply-d4b-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage02-d4b-artifact-copy-contract
      - name: Add artifact-spec copy policy regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_page_artifact_spec.py')
          text = path.read_text(encoding='utf-8')
          marker = '    def test_requires_authored_onscreen_text_as_the_only_visible_authority(self) -> None:\n'
          tests = '''    def test_runtime_content_sources_project_as_rewriteable_copy(self) -> None:\n        for onscreen_source in (\n            "full_copy_stage02_source",\n            "external_content_stage02_source",\n        ):\n            with self.subTest(onscreen_source=onscreen_source):\n                with tempfile.TemporaryDirectory() as directory:\n                    root = Path(directory)\n                    handoff_page, visual_page, style_lock = self._inputs(root)\n                    handoff_page["onscreen_source"] = onscreen_source\n                    handoff_page["content_integrity"] = {\n                        "root_nodes": ["P07-R01", "P07-R02"],\n                        "nodes": [\n                            {\n                                "text_id": "P07-T01",\n                                "root_id": "P07-R01",\n                                "text": "Governed input",\n                                "ordinal": 1,\n                                "content_role": "detail",\n                                "source_level": 1,\n                            },\n                            {\n                                "text_id": "P07-T02",\n                                "root_id": "P07-R02",\n                                "text": "Traceable result",\n                                "ordinal": 2,\n                                "content_role": "detail",\n                                "source_level": 1,\n                            },\n                        ],\n                    }\n\n                    spec = build_page_artifact_spec(\n                        handoff_page=handoff_page,\n                        visual_page=visual_page,\n                        style_lock=style_lock,\n                        script_input_sha256="a" * 64,\n                        visual_source_sha256="b" * 64,\n                    )\n\n                self.assertIsNotNone(spec.copy_contract)\n                self.assertEqual((), spec.copy_contract.locked_copy)\n                self.assertEqual(\n                    ("Governed input", "Traceable result"),\n                    tuple(item.source_text for item in spec.copy_contract.rewriteable_copy),\n                )\n\n    def test_legacy_authored_source_remains_locked_in_artifact_copy_contract(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            handoff_page, visual_page, style_lock = self._inputs(root)\n            handoff_page["content_integrity"] = {\n                "root_nodes": ["P07-R01", "P07-R02"],\n                "nodes": [\n                    {\n                        "text_id": "P07-T01",\n                        "root_id": "P07-R01",\n                        "text": "Governed input",\n                        "ordinal": 1,\n                        "content_role": "detail",\n                        "source_level": 1,\n                    },\n                    {\n                        "text_id": "P07-T02",\n                        "root_id": "P07-R02",\n                        "text": "Traceable result",\n                        "ordinal": 2,\n                        "content_role": "detail",\n                        "source_level": 1,\n                    },\n                ],\n            }\n\n            spec = build_page_artifact_spec(\n                handoff_page=handoff_page,\n                visual_page=visual_page,\n                style_lock=style_lock,\n                script_input_sha256="a" * 64,\n                visual_source_sha256="b" * 64,\n            )\n\n        self.assertIsNotNone(spec.copy_contract)\n        self.assertEqual((), spec.copy_contract.rewriteable_copy)\n        self.assertEqual(\n            ("Governed input", "Traceable result"),\n            tuple(item.text for item in spec.copy_contract.locked_copy),\n        )\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          if 'test_runtime_content_sources_project_as_rewriteable_copy' in text:
              raise SystemExit('D4b tests already present')
          path.write_text(text.replace(marker, tests + marker, 1), encoding='utf-8')
          PY
      - name: Commit tests
        run: |
          if git diff --quiet -- tests/test_page_artifact_spec.py; then
            echo "No test patch produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_page_artifact_spec.py
          git commit -m "test(stage2): cover artifact rewriteable source policy"
          git push origin HEAD:codex/stage02-d4b-artifact-copy-contract
