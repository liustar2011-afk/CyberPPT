name: Stage2 refactor P1.4 final closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p1-4-final.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply final P1.4 closure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{label} target not found: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Compiler: scene_policy is authoritative; legacy bool stays compatible.
          compiler = Path("cyberppt/visual_stage/compiler.py")
          replace_once(compiler,
              '    focus_policy: str,\n) -> dict[str, object]:',
              '    focus_policy: str = "single_anchor",\n) -> dict[str, object]:',
              "compiler helper compatibility")
          replace_once(compiler,
              'def _legacy_use_scene(scene_policy: str) -> bool:\n    return scene_policy != "forbidden"\n',
              'def _legacy_use_scene(scene_policy: str) -> bool:\n    # Deprecated projection only; auto does not mean a scene was selected.\n    return scene_policy in {"required", "allowed"}\n',
              "legacy scene projection")
          replace_once(compiler,
              '        "image_plan": {\n            "use_scene": _legacy_use_scene(scene_policy),\n',
              '        "image_plan": {\n            "scene_policy": scene_policy,\n            # Deprecated compatibility field; new logic consumes scene_policy.\n            "use_scene": _legacy_use_scene(scene_policy),\n',
              "image plan policy")
          replace_once(compiler,
              '        "quality_contract": quality_contract | {"scene_policy": scene_policy},\n',
              '        "quality_contract": quality_contract,\n',
              "remove temporary qa policy")
          replace_once(compiler,
              '        scene_policy = str(page.get("quality_contract", {}).get("scene_policy") or "legacy")\n',
              '        scene_policy = str(page.get("image_plan", {}).get("scene_policy") or "legacy")\n',
              "markdown policy source")

          # Page schema: first-class policy for v1.1, legacy bool retained.
          schema_path = Path("vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          image_plan = schema["properties"]["image_plan"]
          image_plan["properties"]["scene_policy"] = {
              "enum": ["required", "allowed", "forbidden", "auto"],
              "description": "Authoritative Stage2 scene-use policy. use_scene is deprecated compatibility metadata."
          }
          image_plan["properties"]["use_scene"]["description"] = "Deprecated compatibility projection; new logic consumes scene_policy."
          for rule in schema.get("allOf", []):
              if rule.get("if", {}).get("properties", {}).get("schema_version", {}).get("const") != "1.1":
                  continue
              image_rule = rule.setdefault("then", {}).setdefault("properties", {}).setdefault("image_plan", {})
              required = image_rule.setdefault("required", [])
              if "scene_policy" not in required:
                  required.append("scene_policy")
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Artifact projection: policy wins; legacy bool-only specs still load.
          artifact = Path("cyberppt/page_artifact_spec.py")
          replace_once(artifact,
              'class VisualCarrierSpec:\n    business_object: str\n    semantic_role: str\n    use_scene: bool\n    scene_type: str\n',
              'class VisualCarrierSpec:\n    business_object: str\n    semantic_role: str\n    use_scene: bool\n    scene_type: str\n    scene_policy: str = "auto"\n\n    def __post_init__(self) -> None:\n        if self.scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n            raise ValueError(f"unsupported scene policy: {self.scene_policy!r}")\n',
              "artifact carrier policy")
          old_budget = '''def _visual_budget(\n    visual_page: Mapping[str, object],\n    *,\n    topology: str,\n    use_scene: bool,\n    visible_text: tuple[str, ...] = (),\n) -> VisualBudgetSpec:\n    raw = visual_page.get("visual_budget")\n    raw = raw if isinstance(raw, dict) else {}\n    if raw:\n        budget = VisualBudgetSpec(\n            mode=str(raw.get("mode") or "").strip(),\n            max_auxiliary_fragments=int(raw.get("max_auxiliary_fragments")),\n            scope=str(raw.get("scope") or "").strip(),\n            region_local_visuals=bool(raw.get("region_local_visuals")),\n        )\n        if topology == "parallel_set" and budget.mode == "integrated_scene":\n            raise ValueError("parallel_set cannot use an integrated-scene visual budget")\n        return budget\n    if is_text_dense(visible_text) and (topology == "parallel_set" or not use_scene):\n        return VisualBudgetSpec(\n            mode="relationship_field_only",\n            max_auxiliary_fragments=0,\n            scope="page",\n            region_local_visuals=False,\n        )\n    if not use_scene:\n        return VisualBudgetSpec(\n            mode="shared_field",\n            max_auxiliary_fragments=1,\n            scope="page",\n            region_local_visuals=False,\n        )\n    return VisualBudgetSpec()\n'''
          new_budget = '''def _visual_budget(\n    visual_page: Mapping[str, object],\n    *,\n    topology: str,\n    use_scene: bool | None = None,\n    scene_policy: str | None = None,\n    visible_text: tuple[str, ...] = (),\n) -> VisualBudgetSpec:\n    raw = visual_page.get("visual_budget")\n    raw = raw if isinstance(raw, dict) else {}\n    if raw:\n        return VisualBudgetSpec(\n            mode=str(raw.get("mode") or "").strip(),\n            max_auxiliary_fragments=int(raw.get("max_auxiliary_fragments")),\n            scope=str(raw.get("scope") or "").strip(),\n            region_local_visuals=bool(raw.get("region_local_visuals")),\n        )\n    resolved = str(scene_policy or "").strip()\n    if not resolved:\n        resolved = "allowed" if use_scene is True else "forbidden" if use_scene is False else "auto"\n    if resolved not in {"required", "allowed", "forbidden", "auto"}:\n        raise ValueError(f"unsupported scene policy for visual budget: {resolved!r}")\n    if is_text_dense(visible_text) and resolved != "required":\n        return VisualBudgetSpec(\n            mode="relationship_field_only",\n            max_auxiliary_fragments=0,\n            scope="page",\n            region_local_visuals=False,\n        )\n    if resolved == "forbidden":\n        return VisualBudgetSpec(\n            mode="shared_field",\n            max_auxiliary_fragments=1,\n            scope="page",\n            region_local_visuals=False,\n        )\n    return VisualBudgetSpec()\n'''
          replace_once(artifact, old_budget, new_budget, "artifact visual budget")
          replace_once(artifact,
              '    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError("artifact spec image plan use_scene must be boolean")\n',
              '    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError("artifact spec image plan use_scene must be boolean")\n    scene_policy = str(image_plan.get("scene_policy") or "").strip()\n    if not scene_policy:\n        scene_policy = "allowed" if use_scene else "forbidden"\n    if scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n        raise ValueError(f"artifact spec image plan has invalid scene_policy: {scene_policy!r}")\n',
              "artifact policy read")
          replace_once(artifact,
              '            use_scene=use_scene,\n            scene_type=_required_text(image_plan.get("scene_type"), "visual carrier scene type"),\n        ),\n',
              '            use_scene=use_scene,\n            scene_type=_required_text(image_plan.get("scene_type"), "visual carrier scene type"),\n            scene_policy=scene_policy,\n        ),\n',
              "artifact carrier build")
          replace_once(artifact,
              '            topology=str(semantic_graph.get("topology") or ""),\n            use_scene=use_scene,\n            visible_text=visible_text,\n',
              '            topology=str(semantic_graph.get("topology") or ""),\n            use_scene=use_scene,\n            scene_policy=scene_policy,\n            visible_text=visible_text,\n',
              "artifact budget call")

          # Governed VisualDesignIR carries scene_policy.
          consumer = Path("cyberppt/visual_prompt_consumer.py")
          replace_once(consumer,
              '    page_block_sha256: str\n    source_mode: str\n',
              '    page_block_sha256: str\n    source_mode: str\n    scene_policy: str = "auto"\n',
              "consumer dataclass policy")
          replace_once(consumer,
              '    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError(f"VisualDesignIR field image_plan.use_scene must be boolean: {source_path}")\n    return VisualDesignIR(\n',
              '    use_scene = image_plan.get("use_scene")\n    if not isinstance(use_scene, bool):\n        raise ValueError(f"VisualDesignIR field image_plan.use_scene must be boolean: {source_path}")\n    scene_policy = str(image_plan.get("scene_policy") or "").strip()\n    if not scene_policy:\n        scene_policy = "allowed" if use_scene else "forbidden"\n    if scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n        raise ValueError(f"VisualDesignIR field image_plan.scene_policy is invalid: {source_path}")\n    return VisualDesignIR(\n',
              "consumer policy read")
          replace_once(consumer,
              '        page_block_sha256=_sha256_text(json.dumps(spec, ensure_ascii=False, sort_keys=True)),\n        source_mode="governed_json",\n    )\n',
              '        page_block_sha256=_sha256_text(json.dumps(spec, ensure_ascii=False, sort_keys=True)),\n        source_mode="governed_json",\n        scene_policy=scene_policy,\n    )\n',
              "consumer governed constructor")
          replace_once(consumer,
              '    scene = "使用场景" if ir.use_scene else "不使用场景"\n',
              '    scene = {\n        "required": "必须使用场景",\n        "allowed": "允许使用场景",\n        "forbidden": "不使用场景",\n        "auto": "由页面语义与Style lock判断是否使用场景",\n    }[ir.scene_policy]\n',
              "consumer policy render")

          # Audit accepts new scene policy or old bool and checks policy drift when available.
          contract = Path("cyberppt/visual_structure_contract.py")
          replace_once(contract,
              'def audit_visual_design_package(\n',
              '_ALLOWED_SCENE_POLICIES = {"required", "allowed", "forbidden", "auto"}\n\n\ndef _scene_policy_from_execution_design(execution_design: object, *, prompt_mode: str) -> str | None:\n    design = execution_design if isinstance(execution_design, dict) else {}\n    requested = str(design.get("scene_policy") or "").strip()\n    if requested:\n        return requested if requested in _ALLOWED_SCENE_POLICIES else None\n    legacy = design.get("use_scene")\n    if isinstance(legacy, bool):\n        return "allowed" if legacy else "forbidden"\n    return "auto" if prompt_mode == "semantic_brief" else None\n\n\ndef audit_visual_design_package(\n',
              "audit scene helper")
          replace_once(contract,
              '        if prompt_mode == "directed_composition" and (not isinstance(execution_design, dict) or any(\n            not str(execution_design.get(key) or "").strip()\n            for key in required_execution_text\n        ) or not isinstance(execution_design.get("use_scene"), bool)):\n',
              '        execution_scene_policy = _scene_policy_from_execution_design(execution_design, prompt_mode=prompt_mode)\n        if prompt_mode == "directed_composition" and (not isinstance(execution_design, dict) or any(\n            not str(execution_design.get(key) or "").strip()\n            for key in required_execution_text\n        ) or execution_scene_policy is None):\n',
              "audit execution policy")
          old_scene = '''                expected_scene = {\n                    "business_object": execution_design.get("business_object"),\n                    "semantic_role": execution_design.get("semantic_role"),\n                    "use_scene": execution_design.get("use_scene"),\n                    "scene_type": execution_design.get("scene_type"),\n                }\n                actual_scene = {key: image_plan.get(key) for key in expected_scene}\n                if actual_scene != expected_scene:\n                    issue(\n                        "SPEC_SCENE_POLICY_DRIFTED",\n                        "Spec image plan must match the selected carrier and scene policy.",\n                        page_id,\n                    )\n'''
          new_scene = '''                expected_scene = {\n                    "business_object": execution_design.get("business_object"),\n                    "semantic_role": execution_design.get("semantic_role"),\n                    "scene_type": execution_design.get("scene_type"),\n                }\n                actual_scene = {key: image_plan.get(key) for key in expected_scene}\n                scene_drift = actual_scene != expected_scene\n                expected_scene_policy = _scene_policy_from_execution_design(execution_design, prompt_mode=prompt_mode)\n                actual_scene_policy = str(image_plan.get("scene_policy") or "").strip()\n                if actual_scene_policy and actual_scene_policy != expected_scene_policy:\n                    scene_drift = True\n                legacy_use_scene = execution_design.get("use_scene")\n                if isinstance(legacy_use_scene, bool) and image_plan.get("use_scene") != legacy_use_scene:\n                    scene_drift = True\n                if scene_drift:\n                    issue(\n                        "SPEC_SCENE_POLICY_DRIFTED",\n                        "Spec image plan must match the selected carrier and scene policy.",\n                        page_id,\n                    )\n'''
          replace_once(contract, old_scene, new_scene, "audit policy drift")

          # Workbench instructions and Skill contracts.
          execution = Path("cyberppt/visual_stage/execution.py")
          text = execution.read_text(encoding="utf-8")
          old = "For semantic_brief, decide only the semantic focus, source-supported relationship boundary, evidence grouping and exact-text binding; omit execution_design or treat it as non-authoritative advice, leaving scene, carrier, spatial organization and supporting detail to ImageGen. For directed_composition, provide the full authoritative execution_design with business_object, visual_focus, semantic_role, use_scene, scene_type, text_integration_method, spatial_organization and relationship_encoding."
          new = "For semantic_brief, preserve semantic focus, source-supported relationship boundary, evidence grouping and exact-text binding; omit execution_design or treat it as non-authoritative advice. The compiler writes scene_policy=auto and a focus-policy-aware macro relationship field, while ImageGen retains region-internal implementation freedom. For directed_composition, provide the full authoritative execution_design with business_object, visual_focus, semantic_role, scene_policy, scene_type, text_integration_method, spatial_organization and relationship_encoding; scene_policy must be required, allowed, forbidden, or auto. use_scene is legacy compatibility only."
          if old not in text:
              raise SystemExit("execution instruction target not found")
          execution.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill = Path("vendor/skills/ppt-visual-structure-designer/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          old = "当页面`prompt_mode`为`semantic_brief`时，本阶段锁定语义焦点、来源支持的关系边界、证据分组和精确文字绑定；场景、载体、空间组织与辅助细节交由ImageGen结合语义和Style lock决定。"
          if old in text:
              text = text.replace(old, "当页面`prompt_mode`为`semantic_brief`时，本阶段锁定语义焦点、来源支持的关系边界、证据分组、精确文字绑定和由`focus_policy`约束的宏观关系场；编译器写入`scene_policy: auto`，使业务场景、对象插图或结构表达继续由页面语义和Style lock共同判断。ImageGen保留区域内部的对象细节、镜头、光影与微观摆位自由。", 1)
          old = "`directed_composition`页必须提供完整`execution_design`，写明`business_object`、`visual_focus`、`semantic_role`、布尔值`use_scene`、`scene_type`、`text_integration_method`、`spatial_organization`和`relationship_encoding`。"
          if old in text:
              text = text.replace(old, "`directed_composition`页必须提供完整`execution_design`，写明`business_object`、`visual_focus`、`semantic_role`、`scene_policy`、`scene_type`、`text_integration_method`、`spatial_organization`和`relationship_encoding`。`scene_policy`只允许`required`、`allowed`、`forbidden`、`auto`；`use_scene`仅作为旧项目兼容字段。", 1)
          skill.write_text(text, encoding="utf-8")

          gates = Path("vendor/skills/ppt-visual-structure-designer/references/quality-gates.md")
          text = gates.read_text(encoding="utf-8")
          anchor = "- `directed_composition`没有明确对象、位置、阅读路径和连接方向。\n"
          if anchor in text and "semantic_brief`被无来源地强制" not in text:
              text = text.replace(anchor, anchor + "- `scene_policy`不在`required / allowed / forbidden / auto`中。\n- `semantic_brief`被无来源地强制设为`scene_policy: forbidden`，导致业务场景或插图在进入ImageGen前被提前排除。\n", 1)
          gates.write_text(text, encoding="utf-8")

          output_contract = Path("vendor/skills/ppt-visual-structure-designer/references/output-contract.md")
          text = output_contract.read_text(encoding="utf-8")
          text = text.replace('    "use_scene": false,\n    "scene_type": "选中的非场景关系场或真实业务场景",', '    "scene_policy": "allowed",\n    "scene_type": "允许使用的真实业务场景或非场景关系场",')
          text = text.replace('- 选择`use_scene: false`时，仍须用具体业务对象及其关系构成图义场；选择场景时，场景必须直接解释该关系，不能作为装饰背景。', '- `scene_policy: forbidden`时，仍须用具体业务对象及其关系构成图义场；`required`时场景必须直接解释该关系；`allowed`与`auto`保留媒介选择空间。旧项目中的`use_scene`仅用于兼容读取。')
          output_contract.write_text(text, encoding="utf-8")

          validator = Path("vendor/skills/ppt-visual-structure-designer/scripts/validate_visual_spec.py")
          text = validator.read_text(encoding="utf-8")
          anchor = '    prompt_mode = str(page.get("prompt_mode") or "directed_composition")\n'
          if anchor in text and "scene_policy_invalid" not in text:
              text = text.replace(anchor, anchor + '    scene_policy = str(ip.get("scene_policy") or "").strip()\n    if scene_policy and scene_policy not in {"required", "allowed", "forbidden", "auto"}:\n        add(issues, "error", "scene_policy_invalid", "scene_policy must be required, allowed, forbidden, or auto", n)\n    if schema_version == "1.1" and prompt_mode == "semantic_brief" and scene_policy == "forbidden":\n        add(issues, "error", "semantic_brief_scene_forbidden", "semantic_brief must not pre-forbid scene use before page semantics and Style lock are evaluated", n)\n', 1)
          text = text.replace('        if ip.get("use_scene") is False and not CONCRETE_RELATION_RE.search("\\n".join((carrier, semantic_role, organization, encoding))):', '        resolved_scene_forbidden = scene_policy == "forbidden" or (not scene_policy and ip.get("use_scene") is False)\n        if resolved_scene_forbidden and not CONCRETE_RELATION_RE.search("\\n".join((carrier, semantic_role, organization, encoding))):')
          validator.write_text(text, encoding="utf-8")

          # Update tests that encoded the old topology->medium coupling.
          stage_test = Path("tests/test_visual_structure_stage.py")
          replace_once(stage_test,
              '''        design = _decision_execution_design(source, {}, {}, "P11")\n        self.assertEqual(False, design["use_scene"])\n        self.assertIn("ImageGen", design["scene_type"])\n        self.assertIn("ImageGen", design["spatial_organization"])\n        self.assertNotIn("card", design["spatial_organization"].lower())\n''',
              '''        design = _decision_execution_design(source, {}, {}, "P11")\n        self.assertEqual("auto", design["scene_policy"])\n        self.assertEqual(False, design["use_scene"])\n        self.assertIn("Style lock", design["scene_type"])\n        self.assertIn("主视觉锚点", design["spatial_organization"])\n        self.assertNotIn("card", design["spatial_organization"].lower())\n''',
              "semantic brief test")

          scene_test = Path("tests/test_stage2_scene_policy.py")
          text = scene_test.read_text(encoding="utf-8")
          text = text.replace('    assert design["use_scene"] is True\n', '    assert design["use_scene"] is False\n', 1)
          if "artifact_visual_budget" not in text:
              text = text.replace('import pytest\n\n', 'import pytest\n\nfrom cyberppt.page_artifact_spec import _visual_budget as artifact_visual_budget\n\n', 1)
              text += '''\n\ndef test_artifact_budget_allows_parallel_auto_scene_policy() -> None:\n    budget = artifact_visual_budget({}, topology="parallel_set", use_scene=False, scene_policy="auto")\n    assert budget.mode == "integrated_scene"\n    assert budget.region_local_visuals is True\n'''
          scene_test.write_text(text, encoding="utf-8")

          artifact_test = Path("tests/test_page_artifact_spec.py")
          old = '''    def test_parallel_set_rejects_integrated_scene_budget(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            handoff_page, visual_page, style_lock = self._inputs(root)\n            visual_page["semantic_graph"]["topology"] = "parallel_set"\n            visual_page["visual_budget"] = {\n                "mode": "integrated_scene",\n                "max_auxiliary_fragments": 4,\n                "scope": "region",\n                "region_local_visuals": True,\n            }\n\n            with self.assertRaisesRegex(ValueError, "parallel_set"):\n                build_page_artifact_spec(\n                    handoff_page=handoff_page,\n                    visual_page=visual_page,\n                    style_lock=style_lock,\n                    script_input_sha256="a" * 64,\n                    visual_source_sha256="b" * 64,\n                )\n'''
          new = '''    def test_parallel_set_accepts_integrated_scene_budget_when_policy_allows_it(self) -> None:\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            handoff_page, visual_page, style_lock = self._inputs(root)\n            visual_page["semantic_graph"]["topology"] = "parallel_set"\n            visual_page["image_plan"]["scene_policy"] = "auto"\n            visual_page["visual_budget"] = {\n                "mode": "integrated_scene",\n                "max_auxiliary_fragments": 4,\n                "scope": "region",\n                "region_local_visuals": True,\n            }\n\n            spec = build_page_artifact_spec(\n                handoff_page=handoff_page,\n                visual_page=visual_page,\n                style_lock=style_lock,\n                script_input_sha256="a" * 64,\n                visual_source_sha256="b" * 64,\n            )\n\n        self.assertEqual("integrated_scene", spec.visual_budget.mode)\n        self.assertTrue(spec.visual_budget.region_local_visuals)\n'''
          replace_once(artifact_test, old, new, "parallel integrated-scene test")
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run targeted regression
        run: |
          python -m pytest -q tests/test_stage2_scene_policy.py tests/test_visual_structure_stage.py tests/test_visual_structure_contract.py tests/test_page_artifact_spec.py tests/test_visual_prompt_consumer.py tests/test_final_prompt_ir.py tests/test_final_prompt_renderer.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit and safely rebase P1.4
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/visual_stage/compiler.py cyberppt/visual_stage/execution.py cyberppt/visual_structure_contract.py cyberppt/page_artifact_spec.py cyberppt/visual_prompt_consumer.py vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json vendor/skills/ppt-visual-structure-designer/SKILL.md vendor/skills/ppt-visual-structure-designer/references/quality-gates.md vendor/skills/ppt-visual-structure-designer/references/output-contract.md vendor/skills/ppt-visual-structure-designer/scripts/validate_visual_spec.py tests/test_visual_structure_stage.py tests/test_stage2_scene_policy.py tests/test_page_artifact_spec.py
          git commit -m "fix(stage2): close scene policy contract"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
