name: Agent fix analysis imports

on:
  push:
    branches:
      - agent/p1-p2-development-20260828
    paths:
      - .github/workflows/_agent_fix_analysis_import.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-p2-development-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix package-relative imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script_engine/analysis_audits/common.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from .internal_report_voice import (', 'from ..internal_report_voice import (')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run full suite
        run: |
          python -m pytest -q > /tmp/full.log 2>&1 || true
          tail -n 220 /tmp/full.log
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/_agent_fix_analysis_import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix staged analysis audit import boundary'
          git push origin HEAD:agent/p1-p2-development-20260828
