name: Baseline47 Track A3 style lock policy

on:
  push:
    branches:
      - fix/baseline-47-regressions
    paths:
      - .github/workflows/baseline47-tracka-snapshot.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/baseline-47-regressions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Track A3 style lock policy patch
        run: python tools/baseline47_tracka_snapshot_patch.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run snapshot and live-style regression tests
        run: |
          python -m pytest -q \
            tests/test_style_lock_snapshot.py \
            tests/test_extended_style_9.py \
            tests/test_extended_style_10.py
      - name: Record Step A3 in progress ledger
        run: |
          cat >> docs/development/baseline-47-regressions-progress.md <<'EOF'

          ## Track A / Step A3｜Style Lock Live/Snapshot 策略对齐

          状态：已完成

          已完成工作：
          - 将 4 项 Style Lock Snapshot 历史测试迁移到当前正式策略：Style 09/10 默认读取 live contract，只有显式 `resolved_contract_is_immutable=true` 才冻结。
          - 补充默认 live refresh、新 lock 获取当前版本、显式 immutable 冻结、legacy lock 持续跟随 live contract 四类行为边界。
          - 修正 `style_library.py` 注释与 docstring，使其与现行 live-refresh 实现一致。

          验证结果：
          - `tests/test_style_lock_snapshot.py + tests/test_extended_style_9.py + tests/test_extended_style_10.py` 全部通过。
          - 未改变 live-refresh 生产行为，仅纠正历史测试和过时注释。

          下一阶段工作：
          - Track A 聚合验收：运行 Track A 原 18 项失败涉及的完整测试族和标准全量 CI，确认 Track A 历史失败清零并计算剩余基线失败数；随后清理 Track A 临时 workflow/helper，进入 Track B。
          EOF
      - name: Commit verified Track A3 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/imagegen_pipeline/style_library.py \
                  tests/test_style_lock_snapshot.py \
                  docs/development/baseline-47-regressions-progress.md
          git commit -m 'test(baseline47): align style lock refresh policy'
          git push origin HEAD:fix/baseline-47-regressions
