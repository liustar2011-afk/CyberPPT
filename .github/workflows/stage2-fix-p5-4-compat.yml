name: Stage2 fix P5.4 compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-fix-p5-4-compat.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply P5.4 compatibility fix
        run: |
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path('cyberppt/stage02_production/orchestrator.py')
          text = orchestrator.read_text(encoding='utf-8')
          old = '''        rhythm_qa = run_full_image_rhythm_stage(\n            images.manifest,\n            build_dir=context.build_dir,\n        )\n        # Persist the deck-level QA result before any reconstruction authority is\n        # frozen so a blocked run remains recoverable and inspectable.\n        write_json(manifest.manifest_path, images.manifest)\n        if rhythm_qa.get("status") == "blocked":\n            raise RuntimeError(\n                "FULL_IMAGE_DECK_RHYTHM_BLOCKED: audited full images repeat the same "\n                "composition pattern across consecutive pages; review the rhythm receipt "\n                f"before reconstruction: {rhythm_qa.get('receipt_path', '')}"\n            )\n        if context.assembly_mode in {"editable", "both"}:\n            bind_reconstruction_visual_sources(images.manifest)\n'''
          new = '''        if context.assembly_mode in {"editable", "both"}:\n            rhythm_qa = run_full_image_rhythm_stage(\n                images.manifest,\n                build_dir=context.build_dir,\n            )\n            # Persist the deck-level QA result before any reconstruction authority is\n            # frozen so a blocked run remains recoverable and inspectable.\n            write_json(manifest.manifest_path, images.manifest)\n            if rhythm_qa.get("status") == "blocked":\n                raise RuntimeError(\n                    "FULL_IMAGE_DECK_RHYTHM_BLOCKED: audited full images repeat the same "\n                    "composition pattern across consecutive pages; review the rhythm receipt "\n                    f"before reconstruction: {rhythm_qa.get('receipt_path', '')}"\n                )\n            bind_reconstruction_visual_sources(images.manifest)\n'''
          if old not in text:
              raise SystemExit('P5.4 orchestrator compatibility target not found')
          orchestrator.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_final_script_pages.py')
          text = tests.read_text(encoding='utf-8')
          anchors = (
              'patch("cyberppt.commands.final_script_pages._run_image_to_editable_svg_build", return_value=expected) as build,',
              'patch("cyberppt.commands.final_script_pages._run_image_to_editable_svg_build", return_value=expected),',
              'patch(\n                    "cyberppt.commands.final_script_pages._run_image_to_editable_svg_build",\n                    side_effect=ValueError("authoring_svg must be a real authored SVG"),\n                ) as build,',
          )
          replacements = (
              anchors[0] + '\n                patch("cyberppt.stage02_production.orchestrator.run_full_image_rhythm_stage", return_value={"status": "passed"}),',
              anchors[1] + '\n                patch("cyberppt.stage02_production.orchestrator.run_full_image_rhythm_stage", return_value={"status": "passed"}),',
              anchors[2] + '\n                patch("cyberppt.stage02_production.orchestrator.run_full_image_rhythm_stage", return_value={"status": "passed"}),',
          )
          for old_anchor, replacement in zip(anchors, replacements):
              if old_anchor not in text:
                  raise SystemExit(f'P5.4 old test anchor not found: {old_anchor[:80]}')
              text = text.replace(old_anchor, replacement, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run P5.4 focused regressions
        run: |
          python -m pytest -q tests/test_full_image_rhythm_stage.py tests/test_stage02_rhythm_gate_order.py tests/test_final_script_pages.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit and self-clean
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add cyberppt/stage02_production/orchestrator.py tests/test_final_script_pages.py
          git rm .github/workflows/stage2-fix-p5-4-compat.yml
          git commit -m "fix(stage2): scope rhythm gate to reconstruction authority"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
