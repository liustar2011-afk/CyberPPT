name: Stage2 refactor P2.1 schema integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage2-refactor-p2-1.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Integrate Region Graph schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          region_schema_path = Path("vendor/skills/ppt-visual-structure-designer/assets/region-graph.schema.json")
          page_schema_path = Path("vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json")
          region_schema = json.loads(region_schema_path.read_text(encoding="utf-8"))
          page_schema = json.loads(page_schema_path.read_text(encoding="utf-8"))
          embedded = {
              key: value
              for key, value in region_schema.items()
              if key not in {"$schema", "$id", "title"}
          }
          embedded["description"] = (
              "Normalized semantic macro-space between semantic_graph and pixel geometry. "
              "Optional during P2.1 compatibility; compiler authority begins in P2.2."
          )
          page_schema["properties"]["region_graph"] = embedded
          page_schema_path.write_text(
              json.dumps(page_schema, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          skill = Path("vendor/skills/ppt-visual-structure-designer/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          anchor = "- `assets/page-visual-spec.schema.json`：单页JSON合同。\n"
          addition = "- `assets/region-graph.schema.json`：Region Graph语义空间合同；记录区域角色、锚点、相对权重与区域关系，不记录像素模板。\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("SKILL resource anchor not found")
              text = text.replace(anchor, anchor + addition, 1)
          skill.write_text(text, encoding="utf-8")
          PY
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run existing Stage2 regressions
        run: |
          python -m pytest -q tests/test_visual_structure_stage.py tests/test_visual_structure_contract.py tests/test_page_artifact_spec.py
          python -m pytest -q
      - name: Commit, clean artifacts, and safely rebase
        run: |
          git config user.name "CyberPPT Stage2 Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add vendor/skills/ppt-visual-structure-designer/assets/page-visual-spec.schema.json vendor/skills/ppt-visual-structure-designer/SKILL.md
          git commit -m "feat(stage2): expose Region Graph in page schema"
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
