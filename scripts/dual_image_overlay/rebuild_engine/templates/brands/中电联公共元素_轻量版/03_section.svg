<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-brand-template="03_section">
  <!-- Chrome (red line / logo / blue footer / org / page#) comes from slide layout. -->
  <defs>
    <linearGradient id="sectionLeftWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7F9FC" stop-opacity="0.90"/>
      <stop offset="48%" stop-color="#F7F9FC" stop-opacity="0.72"/>
      <stop offset="76%" stop-color="#F7F9FC" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F7F9FC" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <!-- Light atmosphere band between chrome; edge softness should live in the PNG itself. -->
  <image x="0" y="87" width="1280" height="611" href="section_bg.png" xlink:href="section_bg.png" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="87" width="1280" height="611" fill="url(#sectionLeftWash)"/>
  <text x="96" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#8B0000">{{SECTION_NO}}</text>
  <text x="96" y="348" font-family="Microsoft YaHei, Arial, sans-serif" font-size="52" font-weight="700" fill="#123B66">{{SECTION_TITLE}}</text>
  <rect x="96" y="378" width="420" height="3" fill="#8B0000" fill-opacity="0.80"/>
  <text x="96" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5A6F86">{{SECTION_SUBTITLE}}</text>
</svg>
