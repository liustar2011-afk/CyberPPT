<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-cyberppt-native-text-style="locked">
  <image href="../images/layers/02/80cc5adc79681bd2ce2d2efcd97016feb51c4797763bd8c1ee68f6fffb945218.png" x="0" y="0" width="2048" height="1024" />
  <g font-family="PingFang SC" fill="#09254b">
    <text x="36" y="70" font-size="43" font-weight="600" data-box="33 25 343 81">一、标准建设</text>
    <g font-size="21.5" font-weight="600">
      <text x="46" y="132" data-box="43 108 407 140">（一）数据流通质量与价值评估</text>
      <text x="447" y="132" font-size="19" data-box="445 108 827 140">（二）高质量数据集质量评估与数据标注</text>
      <text x="869" y="132" font-size="19.8" data-box="867 108 1209 140">（三）数据基础设施与互联互通</text>
      <text x="1247" y="132" font-size="19.8" data-box="1245 108 1585 140">（四）数据分类分级与安全保障</text>
    </g>
    <g font-size="20" fill="#182a3c">
      <text x="48" y="176" data-box="46 153 408 184">研制数据流通质量评估和数据产品</text>
      <text x="48" y="204" data-box="46 181 408 212">价值测算相关标准，并同步开展指</text>
      <text x="48" y="232" data-box="46 209 408 240">标设计和场景验证工作。</text>
      <text x="451" y="185" data-box="449 163 827 193">研究质量指标、标注流程、质量控制、</text>
      <text x="451" y="214" data-box="449 192 827 222">成果验收和场景适配要求等标准要素。</text>
      <text x="873" y="180" font-size="18.2" data-box="871 158 1207 188">围绕参考架构、数据标识与目录、接入</text>
      <text x="873" y="209" font-size="18.2" data-box="871 187 1207 217">连接器、身份接入等要素开展标准研制。</text>
      <text x="1245" y="171" font-size="17.2" data-box="1243 149 1584 179">研究数据分类分级、数据质量、全生命周</text>
      <text x="1245" y="198" font-size="17.2" data-box="1243 176 1584 206">期安全和跨主体流通安全等方面的实施规</text>
      <text x="1245" y="225" font-size="17.2" data-box="1243 203 1584 233">则。</text>
    </g>
    <g font-size="17.2" fill="#20344d">
      <text x="83" y="264" data-box="81 244 409 271">中电联已牵头开展标准研制，可组织数据</text>
      <text x="83" y="288" data-box="81 268 409 295">供给方、使用方、评估方和平台方共同参</text>
      <text x="83" y="312" data-box="81 292 409 319">与验证，推动企业实践经验转化并进入行</text>
      <text x="83" y="336" data-box="81 316 409 343">业规则体系。</text>
      <text x="487" y="264" data-box="485 244 827 271">中电联可衔接国家标准编制工作并组织</text>
      <text x="487" y="290" data-box="485 270 827 297">电力场景验证，推动企业数据集建设成</text>
      <text x="487" y="316" data-box="485 296 827 323">果进入测评互认和应用推广链条。</text>
      <text x="910" y="263" font-size="16.2" data-box="908 243 1207 270">中电联依托国家数据基础设施建设在电</text>
      <text x="910" y="287" font-size="16.2" data-box="908 267 1207 294">力领域的先行先试工作和行业节点地位，</text>
      <text x="910" y="311" font-size="16.2" data-box="908 291 1207 318">可对企业提出的架构方案、接口方案和</text>
      <text x="910" y="335" font-size="16.2" data-box="908 315 1207 342">连接器方案开展验证。</text>
      <text x="1282" y="264" font-size="16.2" data-box="1280 244 1585 271">中电联可组织电网、发电等多类主体开展</text>
      <text x="1282" y="290" font-size="16.2" data-box="1280 270 1585 297">场景验证，形成支撑跨企业数据流通的安</text>
      <text x="1282" y="316" font-size="16.2" data-box="1280 296 1585 323">全边界和行业要求。</text>
    </g>
    <text x="1670" y="475" font-size="29" font-weight="600" transform="rotate(-10 1670 475)" data-box="1652 415 1873 480">行业标准文件</text>
    <text x="1710" y="515" font-size="21" transform="rotate(-10 1710 515)" data-box="1700 453 1905 526">编制说明与验证记录</text>
    <text x="36" y="578" font-size="43" font-weight="600" data-box="33 537 333 586">二、专业培训</text>
    <g font-size="21" font-weight="600">
      <text x="45" y="626" data-box="43 601 412 634">（一）高质量数据集建设与测评</text>
      <text x="450" y="626" data-box="448 601 827 634">（二）大模型与智能体应用评测</text>
      <text x="865" y="626" font-size="20" data-box="863 601 1207 634">（三）数据资产评估与流通</text>
      <text x="1240" y="626" font-size="19.5" data-box="1238 601 1584 634">（四）可信数据空间与数据安全</text>
    </g>
    <g font-size="18.5" fill="#182a3c">
      <text x="45" y="664" data-box="43 641 412 672">培训内容包括数据规划、专业标注、质量</text>
      <text x="45" y="689" data-box="43 666 412 697">控制、测评认证和案例实训等环节。</text>
      <text x="450" y="664" data-box="448 641 829 672">培训内容涵盖场景设计、模型能力、智能</text>
      <text x="450" y="689" data-box="448 666 829 697">体效果、安全可信和持续评价等方面。</text>
      <text x="864" y="656" font-size="17.3" data-box="862 635 1207 664">培训内容包括数据盘点、质量评价、价值</text>
      <text x="864" y="677" font-size="17.3" data-box="862 656 1207 685">测算、资产入表、登记上架和流通运营等</text>
      <text x="864" y="698" font-size="17.3" data-box="862 677 1207 706">环节。</text>
      <text x="1240" y="656" font-size="17.3" data-box="1238 635 1585 664">培训内容涉及可信连接、身份接入、授权</text>
      <text x="1240" y="677" font-size="17.3" data-box="1238 656 1585 685">使用、受控调用、安全评估和审计追溯等</text>
      <text x="1240" y="698" font-size="17.3" data-box="1238 677 1585 706">方面。</text>
    </g>
    <g font-size="17.2" fill="#20344d">
      <text x="82" y="735" data-box="80 715 412 742">中电联可组织标准起草人员、测评实践人</text>
      <text x="82" y="758" data-box="80 738 412 765">员和电力专业专家联合授课，使课程内容</text>
      <text x="82" y="781" data-box="80 761 412 788">直接服务于企业数据集建设的实际需要。</text>
      <text x="487" y="735" data-box="485 715 829 742">中电联依托自身评测实践积累，可结合电</text>
      <text x="487" y="758" data-box="485 738 829 765">网、发电、新能源等实际业务场景开展案</text>
      <text x="487" y="781" data-box="485 761 829 788">例化实训，增强培训内容的针对性。</text>
      <text x="899" y="735" font-size="15.8" data-box="897 715 1207 742">中电联可贯通业务、财务、评估和交易各</text>
      <text x="899" y="758" font-size="15.8" data-box="897 738 1207 765">环节，采用在央企国企数据资产化项目中</text>
      <text x="899" y="781" font-size="15.8" data-box="897 761 1207 788">形成的方法开展授课。</text>
      <text x="1275" y="735" font-size="15.8" data-box="1273 715 1585 742">中电联可结合电力数据基础设施建设和数</text>
      <text x="1275" y="758" font-size="15.8" data-box="1273 738 1585 765">据安全相关项目经验，面向建设人员和运</text>
      <text x="1275" y="781" font-size="15.8" data-box="1273 761 1585 788">营人员开展场景化培训。</text>
    </g>
    <text x="346" y="981" font-size="18" fill="#233b5e" data-box="343 960 1443 992">除上述方向外，如贵单位拟参与或牵头相关标准项目，或有其他专业培训需求，亦可结合实际情况共同策划推进。</text>
  </g>
</svg>