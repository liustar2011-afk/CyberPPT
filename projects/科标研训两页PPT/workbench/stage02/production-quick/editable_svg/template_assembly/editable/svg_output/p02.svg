<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">2</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">创新业务6-2：标准及培训服务</text>
<g id="quick-body" transform="translate(33 89)">
<ns0:image xmlns:ns0="http://www.w3.org/2000/svg" href="../images/layers/02/80cc5adc79681bd2ce2d2efcd97016feb51c4797763bd8c1ee68f6fffb945218.png" x="0" y="0" width="1214" height="607" />
  
<ns0:g xmlns:ns0="http://www.w3.org/2000/svg" font-family="PingFang SC" fill="#09254b">
    <ns0:text x="21.33984375" y="41.494140625" font-size="25.4892578125" font-weight="600" data-box="33 25 343 81">一、标准建设</ns0:text>
    <ns0:g font-size="12.7446289062" font-weight="600">
      <ns0:text x="27.267578125" y="78.24609375" data-box="43 108 407 140">（一）数据流通质量与价值评估</ns0:text>
      <ns0:text x="264.969726562" y="78.24609375" font-size="11.2626953125" data-box="445 108 827 140">（二）高质量数据集质量评估与数据标注</ns0:text>
      <ns0:text x="515.120117188" y="78.24609375" font-size="11.7369140625" data-box="867 108 1209 140">（三）数据基础设施与互联互通</ns0:text>
      <ns0:text x="739.188476562" y="78.24609375" font-size="11.7369140625" data-box="1245 108 1585 140">（四）数据分类分级与安全保障</ns0:text>
    </ns0:g>
    <ns0:g font-size="11.85546875" fill="#182a3c">
      <ns0:text x="28.453125" y="104.328125" data-box="46 153 408 184">研制数据流通质量评估和数据产品</ns0:text>
      <ns0:text x="28.453125" y="120.92578125" data-box="46 181 408 212">价值测算相关标准，并同步开展指</ns0:text>
      <ns0:text x="28.453125" y="137.5234375" data-box="46 209 408 240">标设计和场景验证工作。</ns0:text>
      <ns0:text x="267.340820312" y="109.663085938" data-box="449 163 827 193">研究质量指标、标注流程、质量控制、</ns0:text>
      <ns0:text x="267.340820312" y="126.853515625" data-box="449 192 827 222">成果验收和场景适配要求等标准要素。</ns0:text>
      <ns0:text x="517.491210938" y="106.69921875" font-size="10.7884765625" data-box="871 158 1207 188">围绕参考架构、数据标识与目录、接入</ns0:text>
      <ns0:text x="517.491210938" y="123.889648438" font-size="10.7884765625" data-box="871 187 1207 217">连接器、身份接入等要素开展标准研制。</ns0:text>
      <ns0:text x="738.002929688" y="101.364257812" font-size="10.195703125" data-box="1243 149 1584 179">研究数据分类分级、数据质量、全生命周</ns0:text>
      <ns0:text x="738.002929688" y="117.369140625" font-size="10.195703125" data-box="1243 176 1584 206">期安全和跨主体流通安全等方面的实施规</ns0:text>
      <ns0:text x="738.002929688" y="133.374023438" font-size="10.195703125" data-box="1243 203 1584 233">则。</ns0:text>
    </ns0:g>
    <ns0:g font-size="10.195703125" fill="#20344d">
      <ns0:text x="49.2001953125" y="156.4921875" data-box="81 244 409 271">中电联已牵头开展标准研制，可组织数据</ns0:text>
      <ns0:text x="49.2001953125" y="170.71875" data-box="81 268 409 295">供给方、使用方、评估方和平台方共同参</ns0:text>
      <ns0:text x="49.2001953125" y="184.9453125" data-box="81 292 409 319">与验证，推动企业实践经验转化并进入行</ns0:text>
      <ns0:text x="49.2001953125" y="199.171875" data-box="81 316 409 343">业规则体系。</ns0:text>
      <ns0:text x="288.680664062" y="156.4921875" data-box="485 244 827 271">中电联可衔接国家标准编制工作并组织</ns0:text>
      <ns0:text x="288.680664062" y="171.904296875" data-box="485 270 827 297">电力场景验证，推动企业数据集建设成</ns0:text>
      <ns0:text x="288.680664062" y="187.31640625" data-box="485 296 827 323">果进入测评互认和应用推广链条。</ns0:text>
      <ns0:text x="539.423828125" y="155.899414062" font-size="9.6029296875" data-box="908 243 1207 270">中电联依托国家数据基础设施建设在电</ns0:text>
      <ns0:text x="539.423828125" y="170.125976562" font-size="9.6029296875" data-box="908 267 1207 294">力领域的先行先试工作和行业节点地位，</ns0:text>
      <ns0:text x="539.423828125" y="184.352539062" font-size="9.6029296875" data-box="908 291 1207 318">可对企业提出的架构方案、接口方案和</ns0:text>
      <ns0:text x="539.423828125" y="198.579101562" font-size="9.6029296875" data-box="908 315 1207 342">连接器方案开展验证。</ns0:text>
      <ns0:text x="759.935546875" y="156.4921875" font-size="9.6029296875" data-box="1280 244 1585 271">中电联可组织电网、发电等多类主体开展</ns0:text>
      <ns0:text x="759.935546875" y="171.904296875" font-size="9.6029296875" data-box="1280 270 1585 297">场景验证，形成支撑跨企业数据流通的安</ns0:text>
      <ns0:text x="759.935546875" y="187.31640625" font-size="9.6029296875" data-box="1280 296 1585 323">全边界和行业要求。</ns0:text>
    </ns0:g>
    <ns0:text x="989.931640625" y="281.567382812" font-size="17.1904296875" font-weight="600" transform="rotate(-10 989.931640625 281.567382812)" data-box="1652 415 1873 480">行业标准文件</ns0:text>
    <ns0:text x="1013.64257812" y="305.278320312" font-size="12.4482421875" transform="rotate(-10 1013.64257812 305.278320312)" data-box="1700 453 1905 526">编制说明与验证记录</ns0:text>
    <ns0:text x="21.33984375" y="342.623046875" font-size="25.4892578125" font-weight="600" data-box="33 537 333 586">二、专业培训</ns0:text>
    <ns0:g font-size="12.4482421875" font-weight="600">
      <ns0:text x="26.6748046875" y="371.076171875" data-box="43 601 412 634">（一）高质量数据集建设与测评</ns0:text>
      <ns0:text x="266.748046875" y="371.076171875" data-box="448 601 827 634">（二）大模型与智能体应用评测</ns0:text>
      <ns0:text x="512.749023438" y="371.076171875" font-size="11.85546875" data-box="863 601 1207 634">（三）数据资产评估与流通</ns0:text>
      <ns0:text x="735.0390625" y="371.076171875" font-size="11.5590820312" data-box="1238 601 1584 634">（四）可信数据空间与数据安全</ns0:text>
    </ns0:g>
    <ns0:g font-size="10.9663085938" fill="#182a3c">
      <ns0:text x="26.6748046875" y="393.6015625" data-box="43 641 412 672">培训内容包括数据规划、专业标注、质量</ns0:text>
      <ns0:text x="26.6748046875" y="408.420898438" data-box="43 666 412 697">控制、测评认证和案例实训等环节。</ns0:text>
      <ns0:text x="266.748046875" y="393.6015625" data-box="448 641 829 672">培训内容涵盖场景设计、模型能力、智能</ns0:text>
      <ns0:text x="266.748046875" y="408.420898438" data-box="448 666 829 697">体效果、安全可信和持续评价等方面。</ns0:text>
      <ns0:text x="512.15625" y="388.859375" font-size="10.2549804688" data-box="862 635 1207 664">培训内容包括数据盘点、质量评价、价值</ns0:text>
      <ns0:text x="512.15625" y="401.307617188" font-size="10.2549804688" data-box="862 656 1207 685">测算、资产入表、登记上架和流通运营等</ns0:text>
      <ns0:text x="512.15625" y="413.755859375" font-size="10.2549804688" data-box="862 677 1207 706">环节。</ns0:text>
      <ns0:text x="735.0390625" y="388.859375" font-size="10.2549804688" data-box="1238 635 1585 664">培训内容涉及可信连接、身份接入、授权</ns0:text>
      <ns0:text x="735.0390625" y="401.307617188" font-size="10.2549804688" data-box="1238 656 1585 685">使用、受控调用、安全评估和审计追溯等</ns0:text>
      <ns0:text x="735.0390625" y="413.755859375" font-size="10.2549804688" data-box="1238 677 1585 706">方面。</ns0:text>
    </ns0:g>
    <ns0:g font-size="10.195703125" fill="#20344d">
      <ns0:text x="48.607421875" y="435.688476562" data-box="80 715 412 742">中电联可组织标准起草人员、测评实践人</ns0:text>
      <ns0:text x="48.607421875" y="449.322265625" data-box="80 738 412 765">员和电力专业专家联合授课，使课程内容</ns0:text>
      <ns0:text x="48.607421875" y="462.956054688" data-box="80 761 412 788">直接服务于企业数据集建设的实际需要。</ns0:text>
      <ns0:text x="288.680664062" y="435.688476562" data-box="485 715 829 742">中电联依托自身评测实践积累，可结合电</ns0:text>
      <ns0:text x="288.680664062" y="449.322265625" data-box="485 738 829 765">网、发电、新能源等实际业务场景开展案</ns0:text>
      <ns0:text x="288.680664062" y="462.956054688" data-box="485 761 829 788">例化实训，增强培训内容的针对性。</ns0:text>
      <ns0:text x="532.903320312" y="435.688476562" font-size="9.3658203125" data-box="897 715 1207 742">中电联可贯通业务、财务、评估和交易各</ns0:text>
      <ns0:text x="532.903320312" y="449.322265625" font-size="9.3658203125" data-box="897 738 1207 765">环节，采用在央企国企数据资产化项目中</ns0:text>
      <ns0:text x="532.903320312" y="462.956054688" font-size="9.3658203125" data-box="897 761 1207 788">形成的方法开展授课。</ns0:text>
      <ns0:text x="755.786132812" y="435.688476562" font-size="9.3658203125" data-box="1273 715 1585 742">中电联可结合电力数据基础设施建设和数</ns0:text>
      <ns0:text x="755.786132812" y="449.322265625" font-size="9.3658203125" data-box="1273 738 1585 765">据安全相关项目经验，面向建设人员和运</ns0:text>
      <ns0:text x="755.786132812" y="462.956054688" font-size="9.3658203125" data-box="1273 761 1585 788">营人员开展场景化培训。</ns0:text>
    </ns0:g>
    <ns0:text x="205.099609375" y="581.510742188" font-size="10.669921875" fill="#233b5e" data-box="343 960 1443 992">除上述方向外，如贵单位拟参与或牵头相关标准项目，或有其他专业培训需求，亦可结合实际情况共同策划推进。</ns0:text>
  </ns0:g>

</g>
</svg>
