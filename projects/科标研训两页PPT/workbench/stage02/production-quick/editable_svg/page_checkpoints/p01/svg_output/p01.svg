<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">1</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">创新业务6-1：科技项目及课题研究</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/01/463c4c3363eaecb89c21baf75482e03a8f75c835344083463d65de5c86d37614.png" x="0" y="0" width="1214" height="607" />
  
<g xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC" fill="#062852">
    <text x="64.01953125" y="38.5302734375" font-size="23.7109375" font-weight="600" data-box="108 28 540 72">一、科技项目<tspan font-size="17.783203125">（四个方向）</tspan></text>
    <text x="35.56640625" y="64.6123046875" font-size="13.041015625" fill="#131a20" data-box="59 88 1578 117">聚焦数据构建、模型评测、安全评估与可信流通，研发工具能力，形成可对外提供的工具产品和测评服务，支撑电力行业数字化与数据要素安全高效利用。</text>
    <g font-size="15.412109375" font-weight="600" fill="#ffffff">
      <text x="41.494140625" y="103.735351562" data-box="68 149 105 182">01</text>
      <text x="295.793945312" y="103.735351562" data-box="495 149 534 182">02</text>
      <text x="537.645507812" y="103.735351562" data-box="903 149 943 182">03</text>
      <text x="746.89453125" y="103.735351562" data-box="1258 149 1299 182">04</text>
    </g>
    <g font-size="13.6337890625" font-weight="600">
      <text x="79.431640625" y="99.5859375" data-box="132 145 385 173">高质量数据集智能构建</text>
      <text x="79.431640625" y="116.776367188" data-box="132 174 290 203">与自动化测评</text>
      <text x="331.360351562" y="99.5859375" data-box="557 145 799 173">电力大模型与智能体</text>
      <text x="331.360351562" y="116.776367188" data-box="557 174 676 204">行业评测</text>
      <text x="573.211914062" y="99.5859375" data-box="965 145 1123 173">数据安全风险</text>
      <text x="573.211914062" y="116.776367188" data-box="965 174 1080 204">智能评估</text>
      <text x="781.275390625" y="99.5859375" data-box="1316 145 1579 173">多主体数据可信共享</text>
      <text x="781.275390625" y="116.776367188" data-box="1316 174 1490 204">与受控利用</text>
    </g>
    <g font-size="11.2626953125" fill="#17232e">
      <text x="37.3447265625" y="248.96484375" data-box="62 402 426 425">研发智能标注、数据增强、自动质检、</text>
      <text x="37.3447265625" y="263.784179688" data-box="62 427 426 450">质量诊断和自动化测评工具，覆盖数据</text>
      <text x="37.3447265625" y="278.603515625" data-box="62 452 426 475">集构建与评价全链条。</text>
      <text x="37.3447265625" y="299.943359375" data-box="62 488 426 511">中电联具备专业规则制定、典型数据集</text>
      <text x="37.3447265625" y="314.762695312" data-box="62 513 426 536">积累、测评体系建设和应用场景组织基</text>
      <text x="37.3447265625" y="329.58203125" data-box="62 538 426 561">础条件。</text>
      <text x="289.2734375" y="248.96484375" data-box="486 402 838 425">研发模型适配、场景能力、安全可信、</text>
      <text x="289.2734375" y="263.784179688" data-box="486 427 838 450">智能体效果等维度的自动化评测工具，</text>
      <text x="289.2734375" y="278.603515625" data-box="486 452 838 475">提供系统化评价手段。</text>
      <text x="289.2734375" y="299.943359375" data-box="486 488 838 511">中电联具备跨模型、跨专业、跨单位统</text>
      <text x="289.2734375" y="314.762695312" data-box="486 513 838 536">一基准验证优势，提升评测结论可比性</text>
      <text x="289.2734375" y="329.58203125" data-box="486 538 838 561">和通用性。</text>
    </g>
    <g font-size="10.3735351562" fill="#17232e">
      <text x="525.790039062" y="248.96484375" data-box="885 402 1199 425">研发风险识别、规则匹配、能力评分、</text>
      <text x="525.790039062" y="263.784179688" data-box="885 427 1199 450">问题诊断和整改推荐的工具体系，支撑</text>
      <text x="525.790039062" y="278.603515625" data-box="885 452 1199 475">企业自评估与自诊断。</text>
      <text x="525.790039062" y="299.943359375" data-box="885 488 1199 511">中电联在数据安全成熟度评估和治理项</text>
      <text x="525.790039062" y="314.762695312" data-box="885 513 1199 536">目中积累了评价指标、风险规则和典型</text>
      <text x="525.790039062" y="329.58203125" data-box="885 538 1199 561">案例，可转化为评估模型支撑研发。</text>
    </g>
    <g font-size="11.2626953125" fill="#17232e">
      <text x="735.631835938" y="248.96484375" data-box="1239 402 1583 425">研究可信连接、授权控制、数据可用不</text>
      <text x="735.631835938" y="263.784179688" font-size="10.9663085938" data-box="1239 427 1583 450">可见、安全调用和审计追溯等关键技术，</text>
      <text x="735.631835938" y="278.603515625" data-box="1239 452 1583 475">满足多主体共享的安全可控要求。</text>
      <text x="735.631835938" y="299.943359375" data-box="1239 488 1583 511">中电联可依托电力数据基础设施建设跨</text>
      <text x="735.631835938" y="314.762695312" data-box="1239 513 1583 536">企业验证环境，为可信流通技术提供行</text>
      <text x="735.631835938" y="329.58203125" data-box="1239 538 1583 561">业级验证条件。</text>
    </g>
    <text x="1040.31738281" y="85.359375" font-size="16.59765625" font-weight="600" fill="#ffffff" data-box="1750 116 1883 153">共性价值</text>
    <circle cx="981.6328125" cy="116.776367188" r="2.37109375" /><circle cx="981.6328125" cy="164.198242188" r="2.37109375" /><circle cx="981.6328125" cy="211.02734375" r="2.37109375" />
    <g font-size="12.4482421875" fill="#17232e">
      <text x="994.673828125" y="121.518554688" data-box="1675 185 1990 214">推动技术成果转化为工具产品</text>
      <text x="994.673828125" y="141.080078125" data-box="1675 218 1990 247">和测评服务</text>
      <text x="994.673828125" y="168.940429688" font-size="11.2626953125" data-box="1675 265 1990 294">构建覆盖技术研发—验证评测—</text>
      <text x="994.673828125" y="188.501953125" data-box="1675 298 1990 327">场景应用的完整闭环</text>
      <text x="994.673828125" y="215.76953125" data-box="1675 344 1990 373">支撑电力行业数字化转型与数</text>
      <text x="994.673828125" y="235.331054688" data-box="1675 377 1990 406">据要素价值释放</text>
    </g>
    <text x="64.01953125" y="373.447265625" font-size="23.7109375" font-weight="600" data-box="107 596 540 638">二、课题研究<tspan font-size="17.783203125">（四个课题）</tspan></text>
    <text x="50.978515625" y="394.787109375" font-size="12.4482421875" fill="#131a20" data-box="85 646 1443 674">围绕机制设计与路径研究，打通标准、测评、估值、流通和应用全流程，为行业规范化管理与价值释放提供系统支撑。</text>
    <g font-size="14.2265625" font-weight="600" fill="#ffffff">
      <text x="40.9013671875" y="426.796875" data-box="67 695 99 728">01</text>
      <text x="291.64453125" y="426.796875" data-box="490 695 523 728">02</text>
      <text x="537.052734375" y="426.796875" data-box="904 695 937 728">03</text>
      <text x="741.559570312" y="426.796875" data-box="1248 695 1282 728">04</text>
    </g>
    <g font-size="12.4482421875" font-weight="600">
      <text x="71.7255859375" y="423.240234375" data-box="119 693 423 720">高质量数据集测评互认</text>
      <text x="71.7255859375" y="438.059570312" data-box="119 718 423 745">与价值释放机制</text>
      <text x="324.83984375" y="423.240234375" data-box="546 693 852 720">电力大模型与智能体行业评价</text>
      <text x="324.83984375" y="438.059570312" data-box="546 718 852 745">及应用准入机制</text>
      <text x="568.469726562" y="423.240234375" data-box="957 693 1198 720">电力数据资产价值评估</text>
      <text x="568.469726562" y="438.059570312" data-box="957 718 1198 745">与市场化流通机制</text>
      <text x="770.60546875" y="423.240234375" data-box="1298 693 1585 720">电力数据基础设施场景运营</text>
      <text x="770.60546875" y="438.059570312" data-box="1298 718 1585 745">与多方协同机制</text>
    </g>
    <g font-size="9.89931640625" fill="#17232e">
      <text x="34.9736328125" y="532.903320312" font-size="9.66220703125" data-box="57 883 426 904">研究质量评价、测评互认、价值评估、授权使用、</text>
      <text x="34.9736328125" y="545.3515625" data-box="57 904 426 925">流通交易和模型应用等环节的机制设计，解决价</text>
      <text x="34.9736328125" y="557.799804688" data-box="57 925 426 946">值释放不畅问题。</text>
      <text x="34.9736328125" y="574.397460938" data-box="57 953 426 974">中电联贯通标准、测评、估值、流通和应用各</text>
      <text x="34.9736328125" y="586.845703125" data-box="57 974 426 996">环节，为机制研究提供全流程实践支撑。</text>
      <text x="279.196289062" y="532.903320312" data-box="469 883 853 904">研究行业适配、业务效果、安全可信、应用准入</text>
      <text x="279.196289062" y="545.3515625" data-box="469 904 853 925">和持续评价等方面的方法体系，支撑规范化管理。</text>
      <text x="279.196289062" y="561.94921875" data-box="469 932 853 953">中电联组织电网企业、发电企业、装备制造企业</text>
      <text x="279.196289062" y="574.397460938" data-box="469 953 853 974">和科研机构共同参与验证，形成跨主体的行业评</text>
      <text x="279.196289062" y="586.845703125" data-box="469 974 853 996">价体系，增强结果代表性。</text>
    </g>
    <g font-size="9.18798828125" fill="#17232e">
      <text x="525.790039062" y="532.310546875" data-box="885 882 1200 903">研究数据盘点、质量评价、价值测算、</text>
      <text x="525.790039062" y="542.98046875" data-box="885 900 1200 921">资产入表、产品设计、登记交易和运营</text>
      <text x="525.790039062" y="553.650390625" data-box="885 918 1200 939">等数据资产化全流程。</text>
      <text x="525.790039062" y="566.098632812" data-box="885 939 1200 960">中电联依托数据资产化项目和价值测算</text>
      <text x="525.790039062" y="576.768554688" data-box="885 957 1200 978">标准研究，通过真实项目检验估值方法、</text>
      <text x="525.790039062" y="587.438476562" data-box="885 975 1200 997">入表路径和流通路径。</text>
    </g>
    <g font-size="9.6029296875" fill="#17232e">
      <text x="733.260742188" y="532.903320312" data-box="1235 883 1586 904">研究授权、计量、定价、结算、收益分配、安全</text>
      <text x="733.260742188" y="545.3515625" data-box="1235 904 1586 925">责任等要素在多主体运营中的机制设计。</text>
      <text x="733.260742188" y="561.94921875" data-box="1235 932 1586 953">中电联组织数据提供方、业务方、使用方和平台</text>
      <text x="733.260742188" y="574.397460938" data-box="1235 953 1586 974">方在真实场景中验证运营规则，检验机制设计的</text>
      <text x="733.260742188" y="586.845703125" data-box="1235 974 1586 996">可操作性和适用性。</text>
    </g>
    <text x="1035.57519531" y="397.158203125" font-size="16.0048828125" font-weight="600" fill="#ffffff" data-box="1742 642 1890 680">适用与协同</text>
    <image href="../images/layers/01/cc51c30236eeabbca2310f6754d86acf15ebfe711fadb8863d8d5decce9f46b9.png" x="972.1484375" y="414.94140625" width="41.494140625" height="34.9736328125" />
    <g font-size="10.9663085938" fill="#17232e">
      <text x="1016.60644531" y="426.796875" data-box="1713 700 1990 728">除上述方向外，如贵单位另有</text>
      <text x="1016.60644531" y="442.208984375" data-box="1713 726 1990 754">科技项目储备或重点研究选题，</text>
      <text x="1016.60644531" y="457.62109375" data-box="1713 752 1990 780">可结合实际情况共同研究，</text>
      <text x="1016.60644531" y="473.033203125" data-box="1713 778 1990 806">择优推进项目合作。</text>
    </g>
  </g>

</g>
</svg>
