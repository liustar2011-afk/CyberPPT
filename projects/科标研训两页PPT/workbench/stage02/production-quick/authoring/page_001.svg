<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-native-text-style="locked">
  <image href="assets/page_001_clean_base.png" x="0" y="0" width="2048" height="1024"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#0B2F62">
    <text id="p1-project-panel" x="36" y="66" font-size="46" font-weight="700">一、科技项目（四个方向）</text>
    <text x="58" y="108" font-size="20" fill="#20242A">聚焦数据构建、模型评测、安全评估与可信流通，形成工具产品和测评服务。</text>
    <text id="p1-research-panel" x="36" y="635" font-size="43" font-weight="700">二、课题研究（四个课题）</text>
    <text x="80" y="671" font-size="20" fill="#20242A">围绕机制设计与路径研究，贯通标准、测评、估值、流通与应用全流程。</text>
    <g font-size="24" font-weight="700">
      <text id="p1-project-1" x="62" y="170">01  高质量数据集智能构建与自动化测评</text>
      <text id="p1-project-2" x="485" y="170">02  电力大模型与智能体行业评测</text>
      <text id="p1-project-3" x="905" y="170">03  数据安全风险智能评估</text>
      <text id="p1-project-4" x="1245" y="170">04  多主体数据可信共享与受控利用</text>
      <text id="p1-research-1" x="62" y="720">01  高质量数据集测评互认与价值释放机制</text>
      <text id="p1-research-2" x="485" y="720">02  电力大模型与智能体行业评价及应用准入机制</text>
      <text id="p1-research-3" x="905" y="720">03  电力数据资产价值评估与市场化流通机制</text>
      <text id="p1-research-4" x="1245" y="720">04  电力数据基础设施场景运营与多方协同机制</text>
    </g>
    <g fill="#20242A" font-size="17">
      <text x="62" y="412"><tspan x="62" dy="0">研发智能标注、数据增强、自动质检与自动化测评工具，</tspan><tspan x="62" dy="25">形成覆盖数据集构建与评价的技术支撑。</tspan></text>
      <text x="485" y="412"><tspan x="485" dy="0">覆盖模型适配、场景能力、安全可信与智能体效果，</tspan><tspan x="485" dy="25">研发自动化评测工具，提供系统化评价手段。</tspan></text>
      <text x="905" y="412"><tspan x="905" dy="0">研发风险识别、规则匹配、能力评分与整改推荐工具，</tspan><tspan x="905" dy="25">支撑企业开展自评估与自诊断。</tspan></text>
      <text x="1245" y="412"><tspan x="1245" dy="0">研究可信连接、授权控制、安全调用和审计追溯，</tspan><tspan x="1245" dy="25">服务多主体间安全可控的数据共享。</tspan></text>
      <text x="62" y="885"><tspan x="62" dy="0">研究质量评价、测评互认、价值评估与授权使用，</tspan><tspan x="62" dy="25">促进数据集价值释放。</tspan></text>
      <text x="485" y="885"><tspan x="485" dy="0">研究行业适配、业务效果、安全可信与应用准入，</tspan><tspan x="485" dy="25">为规范化管理提供依据。</tspan></text>
      <text x="905" y="885"><tspan x="905" dy="0">覆盖数据盘点、质量评价、价值测算、资产入表、</tspan><tspan x="905" dy="25">登记交易和运营等资产化全流程环节。</tspan></text>
      <text x="1245" y="885"><tspan x="1245" dy="0">研究授权、计量、定价、结算与安全责任等要素，</tspan><tspan x="1245" dy="25">形成多主体运营机制。</tspan></text>
    </g>
    <text id="p1-footer" x="1680" y="140" fill="#fff" font-size="28" font-weight="700">共性价值</text>
  </g>
</svg>
