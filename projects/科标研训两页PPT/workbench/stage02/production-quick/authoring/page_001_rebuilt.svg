<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-cyberppt-native-text-style="locked">
  <image href="assets/page_001_reference_base.png" x="0" y="0" width="2048" height="1024"/>
  <g font-family="PingFang SC" fill="#062852">
    <text x="108" y="65" font-size="40" font-weight="600" data-box="108 28 540 72">一、科技项目<tspan font-size="30">（四个方向）</tspan></text>
    <text x="60" y="109" font-size="22" fill="#131a20" data-box="59 88 1578 117">聚焦数据构建、模型评测、安全评估与可信流通，研发工具能力，形成可对外提供的工具产品和测评服务，支撑电力行业数字化与数据要素安全高效利用。</text>
    <g font-size="26" font-weight="600" fill="#ffffff">
      <text x="70" y="175" data-box="68 149 105 182">01</text>
      <text x="499" y="175" data-box="495 149 534 182">02</text>
      <text x="907" y="175" data-box="903 149 943 182">03</text>
      <text x="1260" y="175" data-box="1258 149 1299 182">04</text>
    </g>
    <g font-size="23" font-weight="600">
      <text x="134" y="168" data-box="132 145 385 173">高质量数据集智能构建</text>
      <text x="134" y="197" data-box="132 174 290 203">与自动化测评</text>
      <text x="559" y="168" data-box="557 145 799 173">电力大模型与智能体</text>
      <text x="559" y="197" data-box="557 174 676 204">行业评测</text>
      <text x="967" y="168" data-box="965 145 1123 173">数据安全风险</text>
      <text x="967" y="197" data-box="965 174 1080 204">智能评估</text>
      <text x="1318" y="168" data-box="1316 145 1579 173">多主体数据可信共享</text>
      <text x="1318" y="197" data-box="1316 174 1490 204">与受控利用</text>
    </g>
    <g font-size="19" fill="#17232e">
      <text x="63" y="420" data-box="62 402 426 425">研发智能标注、数据增强、自动质检、</text>
      <text x="63" y="445" data-box="62 427 426 450">质量诊断和自动化测评工具，覆盖数据</text>
      <text x="63" y="470" data-box="62 452 426 475">集构建与评价全链条。</text>
      <text x="63" y="506" data-box="62 488 426 511">中电联具备专业规则制定、典型数据集</text>
      <text x="63" y="531" data-box="62 513 426 536">积累、测评体系建设和应用场景组织基</text>
      <text x="63" y="556" data-box="62 538 426 561">础条件。</text>
      <text x="488" y="420" data-box="486 402 838 425">研发模型适配、场景能力、安全可信、</text>
      <text x="488" y="445" data-box="486 427 838 450">智能体效果等维度的自动化评测工具，</text>
      <text x="488" y="470" data-box="486 452 838 475">提供系统化评价手段。</text>
      <text x="488" y="506" data-box="486 488 838 511">中电联具备跨模型、跨专业、跨单位统</text>
      <text x="488" y="531" data-box="486 513 838 536">一基准验证优势，提升评测结论可比性</text>
      <text x="488" y="556" data-box="486 538 838 561">和通用性。</text>
    </g>
    <g font-size="17.5" fill="#17232e">
      <text x="887" y="420" data-box="885 402 1199 425">研发风险识别、规则匹配、能力评分、</text>
      <text x="887" y="445" data-box="885 427 1199 450">问题诊断和整改推荐的工具体系，支撑</text>
      <text x="887" y="470" data-box="885 452 1199 475">企业自评估与自诊断。</text>
      <text x="887" y="506" data-box="885 488 1199 511">中电联在数据安全成熟度评估和治理项</text>
      <text x="887" y="531" data-box="885 513 1199 536">目中积累了评价指标、风险规则和典型</text>
      <text x="887" y="556" data-box="885 538 1199 561">案例，可转化为评估模型支撑研发。</text>
    </g>
    <g font-size="19" fill="#17232e">
      <text x="1241" y="420" data-box="1239 402 1583 425">研究可信连接、授权控制、数据可用不</text>
      <text x="1241" y="445" font-size="18.5" data-box="1239 427 1583 450">可见、安全调用和审计追溯等关键技术，</text>
      <text x="1241" y="470" data-box="1239 452 1583 475">满足多主体共享的安全可控要求。</text>
      <text x="1241" y="506" data-box="1239 488 1583 511">中电联可依托电力数据基础设施建设跨</text>
      <text x="1241" y="531" data-box="1239 513 1583 536">企业验证环境，为可信流通技术提供行</text>
      <text x="1241" y="556" data-box="1239 538 1583 561">业级验证条件。</text>
    </g>
    <text x="1755" y="144" font-size="28" font-weight="600" fill="#ffffff" data-box="1750 116 1883 153">共性价值</text>
    <circle cx="1656" cy="197" r="4"/><circle cx="1656" cy="277" r="4"/><circle cx="1656" cy="356" r="4"/>
    <g font-size="21" fill="#17232e">
      <text x="1678" y="205" data-box="1675 185 1990 214">推动技术成果转化为工具产品</text>
      <text x="1678" y="238" data-box="1675 218 1990 247">和测评服务</text>
      <text x="1678" y="285" font-size="19" data-box="1675 265 1990 294">构建覆盖技术研发—验证评测—</text>
      <text x="1678" y="318" data-box="1675 298 1990 327">场景应用的完整闭环</text>
      <text x="1678" y="364" data-box="1675 344 1990 373">支撑电力行业数字化转型与数</text>
      <text x="1678" y="397" data-box="1675 377 1990 406">据要素价值释放</text>
    </g>
    <text x="108" y="630" font-size="40" font-weight="600" data-box="107 596 540 638">二、课题研究<tspan font-size="30">（四个课题）</tspan></text>
    <text x="86" y="666" font-size="21" fill="#131a20" data-box="85 646 1443 674">围绕机制设计与路径研究，打通标准、测评、估值、流通和应用全流程，为行业规范化管理与价值释放提供系统支撑。</text>
    <g font-size="24" font-weight="600" fill="#ffffff">
      <text x="69" y="720" data-box="67 695 99 728">01</text>
      <text x="492" y="720" data-box="490 695 523 728">02</text>
      <text x="906" y="720" data-box="904 695 937 728">03</text>
      <text x="1251" y="720" data-box="1248 695 1282 728">04</text>
    </g>
    <g font-size="21" font-weight="600">
      <text x="121" y="714" data-box="119 693 423 720">高质量数据集测评互认</text>
      <text x="121" y="739" data-box="119 718 423 745">与价值释放机制</text>
      <text x="548" y="714" data-box="546 693 852 720">电力大模型与智能体行业评价</text>
      <text x="548" y="739" data-box="546 718 852 745">及应用准入机制</text>
      <text x="959" y="714" data-box="957 693 1198 720">电力数据资产价值评估</text>
      <text x="959" y="739" data-box="957 718 1198 745">与市场化流通机制</text>
      <text x="1300" y="714" data-box="1298 693 1585 720">电力数据基础设施场景运营</text>
      <text x="1300" y="739" data-box="1298 718 1585 745">与多方协同机制</text>
    </g>
    <g font-size="16.7" fill="#17232e">
      <text x="59" y="899" font-size="16.3" data-box="57 883 426 904">研究质量评价、测评互认、价值评估、授权使用、</text>
      <text x="59" y="920" data-box="57 904 426 925">流通交易和模型应用等环节的机制设计，解决价</text>
      <text x="59" y="941" data-box="57 925 426 946">值释放不畅问题。</text>
      <text x="59" y="969" data-box="57 953 426 974">中电联贯通标准、测评、估值、流通和应用各</text>
      <text x="59" y="990" data-box="57 974 426 996">环节，为机制研究提供全流程实践支撑。</text>
      <text x="471" y="899" data-box="469 883 853 904">研究行业适配、业务效果、安全可信、应用准入</text>
      <text x="471" y="920" data-box="469 904 853 925">和持续评价等方面的方法体系，支撑规范化管理。</text>
      <text x="471" y="948" data-box="469 932 853 953">中电联组织电网企业、发电企业、装备制造企业</text>
      <text x="471" y="969" data-box="469 953 853 974">和科研机构共同参与验证，形成跨主体的行业评</text>
      <text x="471" y="990" data-box="469 974 853 996">价体系，增强结果代表性。</text>
    </g>
    <g font-size="15.5" fill="#17232e">
      <text x="887" y="898" data-box="885 882 1200 903">研究数据盘点、质量评价、价值测算、</text>
      <text x="887" y="916" data-box="885 900 1200 921">资产入表、产品设计、登记交易和运营</text>
      <text x="887" y="934" data-box="885 918 1200 939">等数据资产化全流程。</text>
      <text x="887" y="955" data-box="885 939 1200 960">中电联依托数据资产化项目和价值测算</text>
      <text x="887" y="973" data-box="885 957 1200 978">标准研究，通过真实项目检验估值方法、</text>
      <text x="887" y="991" data-box="885 975 1200 997">入表路径和流通路径。</text>
    </g>
    <g font-size="16.2" fill="#17232e">
      <text x="1237" y="899" data-box="1235 883 1586 904">研究授权、计量、定价、结算、收益分配、安全</text>
      <text x="1237" y="920" data-box="1235 904 1586 925">责任等要素在多主体运营中的机制设计。</text>
      <text x="1237" y="948" data-box="1235 932 1586 953">中电联组织数据提供方、业务方、使用方和平台</text>
      <text x="1237" y="969" data-box="1235 953 1586 974">方在真实场景中验证运营规则，检验机制设计的</text>
      <text x="1237" y="990" data-box="1235 974 1586 996">可操作性和适用性。</text>
    </g>
    <text x="1747" y="670" font-size="27" font-weight="600" fill="#ffffff" data-box="1742 642 1890 680">适用与协同</text>
    <image href="assets/page_001_handshake.png" x="1640" y="700" width="70" height="59"/>
    <g font-size="18.5" fill="#17232e">
      <text x="1715" y="720" data-box="1713 700 1990 728">除上述方向外，如贵单位另有</text>
      <text x="1715" y="746" data-box="1713 726 1990 754">科技项目储备或重点研究选题，</text>
      <text x="1715" y="772" data-box="1713 752 1990 780">可结合实际情况共同研究，</text>
      <text x="1715" y="798" data-box="1713 778 1990 806">择优推进项目合作。</text>
    </g>
  </g>
</svg>
