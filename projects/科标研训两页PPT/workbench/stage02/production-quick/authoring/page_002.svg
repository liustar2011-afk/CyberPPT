<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-native-text-style="locked">
  <image href="assets/page_002_clean_base.png" x="0" y="0" width="2048" height="1024"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#0B2F62">
    <text id="p2-standard-panel" x="36" y="66" font-size="52" font-weight="700">一、标准建设</text>
    <text id="p2-training-panel" x="36" y="575" font-size="52" font-weight="700">二、专业培训</text>
    <g font-size="24" font-weight="700">
      <text id="p2-standard-1" x="55" y="130">（一）数据流通质量与价值评估</text>
      <text id="p2-standard-2" x="450" y="130">（二）高质量数据集质量评估与数据标注</text>
      <text id="p2-standard-3" x="870" y="130">（三）数据基础设施与互联互通</text>
      <text id="p2-standard-4" x="1250" y="130">（四）数据分类分级与安全保障</text>
      <text id="p2-training-1" x="55" y="625">（一）高质量数据集建设与测评</text>
      <text id="p2-training-2" x="450" y="625">（二）大模型与智能体应用评测</text>
      <text id="p2-training-3" x="870" y="625">（三）数据资产评估与流通</text>
      <text id="p2-training-4" x="1250" y="625">（四）可信数据空间与数据安全</text>
    </g>
    <g fill="#20242A" font-size="17">
      <text x="310" y="104"><tspan x="310" dy="0">研制数据流通质量评估和数据产品价值测算相关标准，</tspan><tspan x="310" dy="25">同步开展指标设计和场景验证。</tspan><tspan x="310" dy="34">中电联已牵头开展标准研制，组织供给方、使用方、</tspan><tspan x="310" dy="25">评估方和平台方参与验证。</tspan></text>
      <text x="310" y="299"><tspan x="310" dy="0">覆盖质量指标、标注流程、质量控制、成果验收和场景适配，</tspan><tspan x="310" dy="25">形成数据集质量评估与数据标注的标准要素。</tspan><tspan x="310" dy="34">衔接国家标准编制工作并组织电力场景验证，</tspan><tspan x="310" dy="25">推动成果进入测评互认和应用推广链条。</tspan></text>
      <text x="1055" y="104"><tspan x="1055" dy="0">围绕参考架构、数据标识与目录、接入连接器和身份接入，</tspan><tspan x="1055" dy="25">开展标准研制与方案验证。</tspan><tspan x="1055" dy="34">依托电力领域先行先试和行业节点地位，</tspan><tspan x="1055" dy="25">验证企业架构、接口与连接器方案。</tspan></text>
      <text x="1055" y="299"><tspan x="1055" dy="0">明确数据分类分级、质量、全生命周期安全和跨主体流通安全</tspan><tspan x="1055" dy="25">的实施规则。</tspan><tspan x="1055" dy="34">组织电网、发电等主体开展场景验证，</tspan><tspan x="1055" dy="25">形成跨企业数据流通的安全边界和行业要求。</tspan></text>
      <text x="310" y="547"><tspan x="310" dy="0">培训数据规划、专业标注、质量控制、测评认证和案例实训，</tspan><tspan x="310" dy="25">服务企业数据集建设的实际需要。</tspan><tspan x="310" dy="34">标准起草人员、测评实践人员和电力专家联合授课，</tspan><tspan x="310" dy="25">建立课程内容与工程实践的连接。</tspan></text>
      <text x="310" y="737"><tspan x="310" dy="0">培训场景设计、模型能力、智能体效果、安全可信和持续评价，</tspan><tspan x="310" dy="25">结合电网、发电、新能源场景开展实训。</tspan><tspan x="310" dy="34">依托评测实践积累，</tspan><tspan x="310" dy="25">增强培训内容的针对性。</tspan></text>
      <text x="1055" y="547"><tspan x="1055" dy="0">培训数据盘点、质量评价、价值测算、资产入表、登记上架</tspan><tspan x="1055" dy="25">和流通运营等环节。</tspan><tspan x="1055" dy="34">贯通业务、财务、评估和交易各环节，</tspan><tspan x="1055" dy="25">采用数据资产化项目中形成的方法授课。</tspan></text>
      <text x="1055" y="737"><tspan x="1055" dy="0">培训可信连接、身份接入、授权使用、受控调用、安全评估和</tspan><tspan x="1055" dy="25">审计追溯等内容。</tspan><tspan x="1055" dy="34">结合电力数据基础设施建设和安全项目经验，</tspan><tspan x="1055" dy="25">面向建设与运营人员开展场景化培训。</tspan></text>
    </g>
    <rect x="270" y="910" width="1500" height="66" rx="4" fill="#F4F7FA" stroke="#9DB6D5"/>
    <text id="p2-footer" x="315" y="951" font-size="20" font-weight="700">除上述方向外，如贵单位拟参与或牵头相关标准项目，或有其他专业培训需求，亦可结合实际情况共同策划推进。</text>
  </g>
</svg>
