  <ns0:g id="native-text" data-pptx-bounds="0 0 2048 1024" font-family="Microsoft YaHei" fill="#0A2D63">
    <ns0:text x="109" y="66" font-size="42" font-weight="bold">一、科技项目（四个方向）</ns0:text>
    <ns0:text x="60" y="107" font-size="22" font-weight="normal" fill="#111111">聚焦数据构建、模型评测、安全评估与可信流通，研发工具能力，形成可对外提供的工具产品和测评服务，支撑电力行业数字化与数据要素安全高效利用。</ns0:text>
    <ns0:g id="top-card-01"><ns0:text x="87" y="174" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">01</ns0:text><ns0:text x="133" y="167" font-size="27" font-weight="bold">高质量数据集智能构建</ns0:text><ns0:text x="133" y="198" font-size="27" font-weight="bold">与自动化测评</ns0:text><ns0:text x="61" y="419" font-size="19" fill="#111111">研发智能标注、数据增强、自动质检、</ns0:text><ns0:text x="61" y="446" font-size="19" fill="#111111">质量诊断和自动化测评工具，覆盖数据</ns0:text><ns0:text x="61" y="473" font-size="19" fill="#111111">集构建与评价全链条。</ns0:text><ns0:text x="61" y="505" font-size="19" fill="#111111">中电联具备专业规则制定、典型数据集</ns0:text><ns0:text x="61" y="532" font-size="19" fill="#111111">积累、测评体系建设和应用场景组织基</ns0:text><ns0:text x="61" y="559" font-size="19" fill="#111111">础条件。</ns0:text></ns0:g>
    <ns0:g id="top-card-02"><ns0:text x="518" y="174" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">02</ns0:text><ns0:text x="560" y="167" font-size="27" font-weight="bold">电力大模型与智能体</ns0:text><ns0:text x="560" y="198" font-size="27" font-weight="bold">行业评测</ns0:text><ns0:text x="487" y="419" font-size="19" fill="#111111">研发模型适配、场景能力、安全可信、</ns0:text><ns0:text x="487" y="446" font-size="19" fill="#111111">智能体效果等维度的自动化评测工具，</ns0:text><ns0:text x="487" y="473" font-size="19" fill="#111111">提供系统化评价手段。</ns0:text><ns0:text x="487" y="505" font-size="19" fill="#111111">中电联具备跨模型、跨专业、跨单位统</ns0:text><ns0:text x="487" y="532" font-size="19" fill="#111111">一基准验证优势，提升评测结论可比性</ns0:text><ns0:text x="487" y="559" font-size="19" fill="#111111">和通用性。</ns0:text></ns0:g>
    <ns0:g id="top-card-03"><ns0:text x="926" y="174" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">03</ns0:text><ns0:text x="967" y="167" font-size="27" font-weight="bold">数据安全风险</ns0:text><ns0:text x="967" y="198" font-size="27" font-weight="bold">智能评估</ns0:text><ns0:text x="887" y="419" font-size="19" fill="#111111">研发风险识别、规则匹配、能力评分、</ns0:text><ns0:text x="887" y="446" font-size="19" fill="#111111">问题诊断和整改推荐的工具体系，支撑</ns0:text><ns0:text x="887" y="473" font-size="19" fill="#111111">企业自评估与自诊断。</ns0:text><ns0:text x="887" y="505" font-size="19" fill="#111111">中电联在数据安全成熟度评估和治理项</ns0:text><ns0:text x="887" y="532" font-size="19" fill="#111111">目中积累了评价指标、风险规则和典型</ns0:text><ns0:text x="887" y="559" font-size="19" fill="#111111">案例，可转化为评估模型支撑研发。</ns0:text></ns0:g>
    <ns0:g id="top-card-04"><ns0:text x="1280" y="174" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">04</ns0:text><ns0:text x="1320" y="167" font-size="27" font-weight="bold">多主体数据可信共享</ns0:text><ns0:text x="1320" y="198" font-size="27" font-weight="bold">与受控利用</ns0:text><ns0:text x="1242" y="419" font-size="19" fill="#111111">研究可信连接、授权控制、数据可用不</ns0:text><ns0:text x="1242" y="446" font-size="19" fill="#111111">可见、安全调用和审计追溯等关键技术，</ns0:text><ns0:text x="1242" y="473" font-size="19" fill="#111111">满足多主体共享的安全可控要求。</ns0:text><ns0:text x="1242" y="505" font-size="19" fill="#111111">中电联可依托电力数据基础设施建设跨</ns0:text><ns0:text x="1242" y="532" font-size="19" fill="#111111">企业验证环境，为可信流通技术提供行</ns0:text><ns0:text x="1242" y="559" font-size="19" fill="#111111">业级验证条件。</ns0:text></ns0:g>
    <ns0:g id="value-panel"><ns0:text x="1817" y="145" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">共性价值</ns0:text><ns0:text x="1648" y="203" font-size="22" fill="#111111">•　推动技术成果转化为工具产品</ns0:text><ns0:text x="1678" y="235" font-size="22" fill="#111111">和测评服务</ns0:text><ns0:text x="1648" y="285" font-size="22" fill="#111111">•　构建覆盖技术研发—验证评测—</ns0:text><ns0:text x="1678" y="317" font-size="22" fill="#111111">场景应用的完整闭环</ns0:text><ns0:text x="1648" y="367" font-size="22" fill="#111111">•　支撑电力行业数字化转型与数</ns0:text><ns0:text x="1678" y="399" font-size="22" fill="#111111">据要素价值释放</ns0:text></ns0:g>
    <ns0:text x="111" y="634" font-size="42" font-weight="bold">二、课题研究（四个课题）</ns0:text><ns0:text x="86" y="668" font-size="22" fill="#111111">围绕机制设计与路径研究，打通标准、测评、估值、流通和应用全流程，为行业规范化管理与价值释放提供系统支撑。</ns0:text>
    <ns0:g id="bottom-card-01"><ns0:text x="85" y="724" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">01</ns0:text><ns0:text x="121" y="715" font-size="23" font-weight="bold">高质量数据集测评互认</ns0:text><ns0:text x="121" y="742" font-size="23" font-weight="bold">与价值释放机制</ns0:text><ns0:text x="61" y="902" font-size="18" fill="#111111">研究质量评价、测评互认、价值评估、授权使用、</ns0:text><ns0:text x="61" y="928" font-size="18" fill="#111111">流通交易和模型应用等环节的机制设计，解决价</ns0:text><ns0:text x="61" y="954" font-size="18" fill="#111111">值释放不畅问题。</ns0:text><ns0:text x="61" y="984" font-size="18" fill="#111111">中电联贯通标准、测评、估值、流通和应用各</ns0:text><ns0:text x="61" y="1010" font-size="18" fill="#111111">环节，为机制研究提供全流程实践支撑。</ns0:text></ns0:g>
    <ns0:g id="bottom-card-02"><ns0:text x="507" y="724" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">02</ns0:text><ns0:text x="548" y="715" font-size="23" font-weight="bold">电力大模型与智能体行业评价</ns0:text><ns0:text x="548" y="742" font-size="23" font-weight="bold">及应用准入机制</ns0:text><ns0:text x="466" y="902" font-size="18" fill="#111111">研究行业适配、业务效果、安全可信、应用准入</ns0:text><ns0:text x="466" y="928" font-size="18" fill="#111111">和持续评价等方面的方法体系，支撑规范化管理。</ns0:text><ns0:text x="466" y="966" font-size="18" fill="#111111">中电联组织电网企业、发电企业、装备制造企业</ns0:text><ns0:text x="466" y="990" font-size="18" fill="#111111">和科研机构共同参与验证，形成跨主体的行业评</ns0:text><ns0:text x="466" y="1012" font-size="18" fill="#111111">价体系，增强结果代表性。</ns0:text></ns0:g>
    <ns0:g id="bottom-card-03"><ns0:text x="928" y="724" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">03</ns0:text><ns0:text x="969" y="715" font-size="23" font-weight="bold">电力数据资产价值评估</ns0:text><ns0:text x="969" y="742" font-size="23" font-weight="bold">与市场化流通机制</ns0:text><ns0:text x="888" y="902" font-size="18" fill="#111111">研究数据盘点、质酬评价、价值测算、资产入表、</ns0:text><ns0:text x="888" y="928" font-size="18" fill="#111111">产品设计、登记交易和运营等数据资产化全流程。</ns0:text><ns0:text x="888" y="966" font-size="18" fill="#111111">中电联依托数据资产化项目和价值测算标准研究，</ns0:text><ns0:text x="888" y="990" font-size="18" fill="#111111">通过真实项目检验估值方法、入表路径和流通</ns0:text><ns0:text x="888" y="1012" font-size="18" fill="#111111">路径。</ns0:text></ns0:g>
    <ns0:g id="bottom-card-04"><ns0:text x="1276" y="724" font-size="28" font-weight="bold" text-anchor="middle" fill="#FFFFFF">04</ns0:text><ns0:text x="1301" y="715" font-size="23" font-weight="bold">电力数据基础设施场景运营</ns0:text><ns0:text x="1301" y="742" font-size="23" font-weight="bold">与多方协同机制</ns0:text><ns0:text x="1242" y="902" font-size="18" fill="#111111">研究授权、计量、定价、结算、收益分配、安全</ns0:text><ns0:text x="1242" y="928" font-size="18" fill="#111111">责任等要素在多主体运营中的机制设计。</ns0:text><ns0:text x="1242" y="966" font-size="18" fill="#111111">中电联组织数据提供方、业务方、使用方和平台</ns0:text><ns0:text x="1242" y="990" font-size="18" fill="#111111">方在真实场景中验证运营规则，检验机制设计的</ns0:text><ns0:text x="1242" y="1012" font-size="18" fill="#111111">可操作性和适用性。</ns0:text></ns0:g>
    <ns0:g id="collaboration-panel"><ns0:text x="1817" y="673" font-size="29" font-weight="bold" text-anchor="middle" fill="#FFFFFF">适用与协同</ns0:text><ns0:text x="1713" y="744" font-size="20" fill="#111111">除上述方向外，如贵单位另有科技</ns0:text><ns0:text x="1713" y="772" font-size="20" fill="#111111">项目储备或重点研究选题，可结合</ns0:text><ns0:text x="1713" y="800" font-size="20" fill="#111111">实际情况共同研究，择优推进项目</ns0:text><ns0:text x="1713" y="828" font-size="20" fill="#111111">合作。</ns0:text></ns0:g>
  </ns0:g>
</ns0:svg>