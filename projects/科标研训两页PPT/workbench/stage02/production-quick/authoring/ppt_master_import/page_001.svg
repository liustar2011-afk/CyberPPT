<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-pptx-page-role="content" data-cyberppt-native-text-style="locked">
  <ns0:g id="clean-base" data-pptx-bounds="0 0 2048 1024"><ns0:image href="../images/clean-base-2x.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="xMidYMid meet" /></ns0:g>
  <ns0:g id="exact-source-photos" data-pptx-bounds="47 214 1955 778">
    <ns0:image href="../images/photo-top-01.png" x="47" y="214" width="379" height="171" preserveAspectRatio="none" /><ns0:image href="../images/photo-top-02.png" x="479" y="214" width="362" height="171" preserveAspectRatio="none" /><ns0:image href="../images/photo-top-03.png" x="887" y="214" width="359" height="171" preserveAspectRatio="none" /><ns0:image href="../images/photo-top-04.png" x="1244" y="214" width="339" height="171" preserveAspectRatio="none" />
    <ns0:image href="../images/photo-side-top.png" x="1631" y="429" width="371" height="131" preserveAspectRatio="none" />
    <ns0:image href="../images/photo-bottom-01.png" x="47" y="753" width="381" height="123" preserveAspectRatio="none" /><ns0:image href="../images/photo-bottom-02.png" x="466" y="753" width="389" height="123" preserveAspectRatio="none" /><ns0:image href="../images/photo-bottom-03.png" x="888" y="753" width="310" height="123" preserveAspectRatio="none" /><ns0:image href="../images/photo-bottom-04.png" x="1242" y="753" width="340" height="123" preserveAspectRatio="none" />
    <ns0:image href="../images/photo-side-bottom.png" x="1632" y="855" width="371" height="137" preserveAspectRatio="none" />
