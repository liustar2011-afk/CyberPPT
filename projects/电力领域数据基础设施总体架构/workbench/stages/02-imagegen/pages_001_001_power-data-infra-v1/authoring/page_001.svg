<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2048" height="1024" viewBox="0 0 2048 1024" data-cyberppt-native-text-style="locked">
  <rect width="2048" height="1024" fill="#ffffff"/>
  <image href="assets/page_001_clean_base.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none"/>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" fill="#12355B">
    <text x="30" y="73" font-size="39" font-weight="700">总体架构：五层能力、两项贯穿保障与三类业务管理视图共同支撑数据产品与场景服务运营。</text>
    <g font-size="30" font-weight="700" text-anchor="middle" fill="#ffffff">
      <rect x="27" y="110" width="162" height="96" rx="5" fill="#12355B"/><text x="61" y="168" font-size="45">5</text><text x="108" y="168">接入</text>
      <rect x="27" y="214" width="162" height="96" rx="5" fill="#12355B"/><text x="61" y="272" font-size="45">4</text><text x="108" y="272">运营</text>
      <rect x="27" y="318" width="162" height="96" rx="5" fill="#12355B"/><text x="61" y="376" font-size="45">3</text><text x="108" y="376">交付</text>
      <rect x="27" y="422" width="162" height="96" rx="5" fill="#12355B"/><text x="61" y="480" font-size="45">2</text><text x="108" y="480">资源</text>
      <rect x="27" y="526" width="162" height="128" rx="5" fill="#12355B"/><text x="61" y="592" font-size="45">1</text><text x="108" y="592">基础</text>
    </g>
    <g stroke="#C9CDD1" stroke-width="2">
      <line x1="194" y1="208" x2="1100" y2="208"/><line x1="194" y1="312" x2="1100" y2="312"/><line x1="194" y1="416" x2="1100" y2="416"/><line x1="194" y1="520" x2="1100" y2="520"/>
    </g>
    <g>
      <text x="223" y="145" font-size="32" font-weight="700">可信连接与主体接入层</text><text x="223" y="181" font-size="22" fill="#303030">面向机构、人员和应用建立可信身份，承接外部主体接入与业务请求。</text>
      <text x="223" y="249" font-size="32" font-weight="700">运营与交易管理层</text><text x="223" y="285" font-size="22" fill="#303030">统一管理客户、产品规格、订单、合同、授权、计量、账单与结算。</text>
      <text x="223" y="353" font-size="32" font-weight="700">服务交付与场景编排层</text><text x="223" y="389" font-size="22" fill="#303030">支撑接口调用、成果交付、模型任务、数据沙箱与多方协同交付。</text>
      <text x="223" y="457" font-size="32" font-weight="700">资源与产品管理层</text><text x="223" y="493" font-size="22" fill="#303030">对数据、知识、模型、算法和专业能力开展登记、编目、质量与版本管理。</text>
      <text x="223" y="561" font-size="32" font-weight="700">数据与人工智能基础层</text><text x="223" y="597" font-size="22" fill="#303030">承载经授权数据与模型，提供存储计算、知识库、向量检索与模型服务。</text>
    </g>
    <line x1="1130" y1="120" x2="1130" y2="678" stroke="#C9CDD1" stroke-width="2"/>
    <text x="1270" y="145" font-size="31" font-weight="700" text-anchor="middle">两项贯穿保障</text>
    <rect x="1162" y="177" width="267" height="510" rx="8" fill="#ffffff" stroke="#12355B" stroke-width="2"/>
    <line x1="1162" y1="431" x2="1429" y2="431" stroke="#12355B" stroke-width="2"/>
    <text x="1295" y="240" font-size="28" font-weight="700" text-anchor="middle">安全与合规</text>
    <text x="1200" y="284" font-size="22" fill="#303030"><tspan x="1200" dy="0">分类分级、权利核查、访问控制、</tspan><tspan x="1200" dy="31">输出管理和审计追溯覆盖全过程。</tspan></text>
    <text x="1295" y="490" font-size="28" font-weight="700" text-anchor="middle">标准与运维</text>
    <text x="1200" y="534" font-size="22" fill="#303030"><tspan x="1200" dy="0">统一目录、接口、质量、服务等级</tspan><tspan x="1200" dy="31">和计量标准，开展版本、监控、容</tspan><tspan x="1200" dy="31">灾和故障处置管理。</tspan></text>
    <line x1="1462" y1="120" x2="1462" y2="678" stroke="#C9CDD1" stroke-width="2"/>
    <text x="1742" y="145" font-size="31" font-weight="700" text-anchor="middle">三类业务管理视图</text>
    <g stroke="#C9CDD1" stroke-width="2" fill="#ffffff"><rect x="1494" y="177" width="534" height="147" rx="8"/><rect x="1494" y="333" width="534" height="143" rx="8"/><rect x="1494" y="485" width="534" height="147" rx="8"/></g>
    <g><text x="1720" y="223" font-size="27" font-weight="700">资源管理控制面</text><text x="1720" y="260" font-size="18" fill="#303030"><tspan x="1720" dy="0">主体、资源、产品、版本、</tspan><tspan x="1720" dy="25">权利和质量管理。</tspan></text>
      <text x="1720" y="377" font-size="27" font-weight="700">服务交付执行面</text><text x="1720" y="414" font-size="18" fill="#303030"><tspan x="1720" dy="0">调用、计算、数据留域、</tspan><tspan x="1720" dy="25">模型运行和过程审计。</tspan></text>
      <text x="1720" y="529" font-size="27" font-weight="700">客户运营管理面</text><text x="1720" y="566" font-size="18" fill="#303030"><tspan x="1720" dy="0">需求组织、产品推广、订单</tspan><tspan x="1720" dy="25">履行、账单结算和续约推广。</tspan></text>
    </g>
    <text x="1494" y="704" font-size="18"><tspan x="1494" dy="0">三类管理面通过统一标识、订单、授权规则、交付证据和</tspan><tspan x="1494" dy="24">计量记录与五层能力相互映射。</tspan></text>
    <line x1="28" y1="716" x2="1450" y2="716" stroke="#12355B" stroke-width="2"/>
    <text x="52" y="748" font-size="32" font-weight="700">分级部署</text>
    <g font-size="23" font-weight="700" text-anchor="middle"><text x="230" y="929">公共能力集中部署</text><text x="626" y="929">合作伙伴资源源端服务</text><text x="1059" y="929">客户专属环境部署</text><text x="1680" y="929">多方数据受控联合分析</text></g>
    <g font-size="18" fill="#303030" text-anchor="middle"><text x="230" y="962">统一环境</text><text x="626" y="962">可信连接器在源端提供服务</text><text x="1059" y="962">专属实例或客户指定环境</text><text x="1680" y="962">受控计算环境</text></g>
  </g>
</svg>
