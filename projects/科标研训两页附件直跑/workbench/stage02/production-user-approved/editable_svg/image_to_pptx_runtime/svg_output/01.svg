<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024" data-cyberppt-native-text-style="locked">
  <ns0:image href="../images/layers/01/9f5b8a2df02a060b9b8e86ba64649d5cbb32ddd6b09592d2064e09d0835c0e58.png" x="0" y="0" width="2048" height="1024" />
  <ns0:g fill="#12355B" font-family="PingFang SC" font-weight="700">
    <ns0:text x="285" y="108" font-size="46">双方将在五个方向开展科技项目和课题研究合作</ns0:text>
    <ns0:text x="52" y="316" font-size="28" fill="#FFFFFF">01</ns0:text><ns0:text x="117" y="304" font-size="28">电力领域</ns0:text><ns0:text x="117" y="340" font-size="28">数据基础设施建设</ns0:text>
    <ns0:text x="375" y="316" font-size="28" fill="#FFFFFF">02</ns0:text><ns0:text x="443" y="304" font-size="28">高质量数据集</ns0:text><ns0:text x="443" y="340" font-size="28">评测标注与资产评估</ns0:text>
    <ns0:text x="705" y="316" font-size="28" fill="#FFFFFF">03</ns0:text><ns0:text x="771" y="304" font-size="28">电力数据</ns0:text><ns0:text x="771" y="340" font-size="28">安全风险评估</ns0:text>
    <ns0:text x="1027" y="316" font-size="28" fill="#FFFFFF">04</ns0:text><ns0:text x="1093" y="304" font-size="28">人工智能</ns0:text><ns0:text x="1093" y="340" font-size="28">工具与评测</ns0:text>
    <ns0:text x="1350" y="316" font-size="28" fill="#FFFFFF">05</ns0:text><ns0:text x="1416" y="304" font-size="28">能算碳</ns0:text><ns0:text x="1416" y="340" font-size="28">综合服务</ns0:text>
    <ns0:text x="1683" y="250" font-size="31">开放协同，择优推进</ns0:text><ns0:text x="1778" y="545" font-size="44">1700+</ns0:text><ns0:text x="1775" y="690" font-size="44">23年</ns0:text><ns0:text x="1780" y="835" font-size="33">承担建设任务</ns0:text>
  </ns0:g>
  <ns0:g fill="#303030" font-family="PingFang SC" font-size="18">
    <ns0:text x="285" y="160" font-size="18">围绕数据基础设施建设、高质量数据集评测标注与资产评估、电力数据安全风险评估、</ns0:text><ns0:text x="285" y="190" font-size="18">人工智能工具与评测、能算碳综合服务等方向，联合开展科技项目和课题研究合作。</ns0:text>
    <ns0:text x="48" y="650">• 围绕数据基础设施参考架构、</ns0:text><ns0:text x="65" y="670">接入连接器、可信流通及多</ns0:text><ns0:text x="65" y="690">主体运营机制开展联合研究。</ns0:text><ns0:text x="48" y="750">• 中电联作为国家数据基础设</ns0:text><ns0:text x="65" y="770">施行业节点，可组织跨企业构</ns0:text><ns0:text x="65" y="790">建验证环境，提供行业级验证</ns0:text><ns0:text x="65" y="810">条件。</ns0:text>
    <ns0:text x="370" y="650">• 围绕数据标注、数据集加工、</ns0:text><ns0:text x="387" y="670">质量评测与资产评估的方法及</ns0:text><ns0:text x="387" y="690">工具开展研究，并探索测评互</ns0:text><ns0:text x="387" y="710">认与价值释放机制。</ns0:text><ns0:text x="370" y="770">• 已联合多家网省公司完成多</ns0:text><ns0:text x="387" y="790">类数据集建设与评测案例，具</ns0:text><ns0:text x="387" y="810">备专家团队与标准体系支撑。</ns0:text>
    <ns0:text x="693" y="650">• 围绕数据分类分级、全生命</ns0:text><ns0:text x="710" y="670">周期与流通安全规则开展研究，</ns0:text><ns0:text x="710" y="690">联合验证风险评估及脱敏、水</ns0:text><ns0:text x="710" y="710">印等技防工具的适用性。</ns0:text><ns0:text x="693" y="770">• 已研发相应评估与技防工具，</ns0:text><ns0:text x="710" y="790">并在国网多省份落地应用。</ns0:text>
    <ns0:text x="1013" y="650">• 围绕模型适配、场景能力、</ns0:text><ns0:text x="1034" y="670">安全可信等维度联合研发自动</ns0:text><ns0:text x="1034" y="690">化评测工具，验证业务智能助</ns0:text><ns0:text x="1034" y="710">手与数据治理工具应用效果。</ns0:text><ns0:text x="1013" y="770">• 已构建行业、场景、基础能力</ns0:text><ns0:text x="1034" y="790">三级评测体系，在多家网省公</ns0:text><ns0:text x="1034" y="810">司落地应用。</ns0:text>
    <ns0:text x="1336" y="650">• 围绕碳排放核算、碳资产开发、</ns0:text><ns0:text x="1356" y="670">能效优化与零碳园区管理开展</ns0:text><ns0:text x="1356" y="690">工具与机制研究。</ns0:text><ns0:text x="1336" y="750">• 依托1700余家会员单位资源</ns0:text><ns0:text x="1356" y="770">和23年行业积累，承担电力碳</ns0:text><ns0:text x="1356" y="790">足迹数据库建设任务。</ns0:text>
    <ns0:text x="1682" y="320" font-size="15">除上述方向外，如贵单位另有科技项目储备</ns0:text><ns0:text x="1682" y="343" font-size="15">或研究选题，可结合实际共同研究，择优推进。</ns0:text><ns0:text x="1778" y="580" font-size="18">会员单位资源</ns0:text><ns0:text x="1775" y="725" font-size="18">行业积累</ns0:text><ns0:text x="1780" y="875" font-size="18">电力碳足迹数据库</ns0:text>
  </ns0:g>
</ns0:svg>