<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="assets/page_007_clean_base.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none"/><rect x="30" y="32" width="724" height="380" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="42" y="62" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="42" dy="0" font-weight="600" fill="#12355B">场景落地采用业务建设运营与基础设施技术运营两类责任协同。各业务部门</tspan><tspan x="42" dy="31">和直属单位作为场景建设和业务运营主体，负责本单位场景建设的组织实施</tspan><tspan x="42" dy="31">，确定产品和服务内容，组织相关数据和业务资源，开展客户对接、服务拓</tspan><tspan x="42" dy="31">展和业务运营，并对场景业务内容、建设进度和质量负责。业务主体由此承</tspan><tspan x="42" dy="31">担从内容设计、资源组织到客户服务和持续运营的完整业务责任。</tspan></text><rect x="30" y="466" width="724" height="340" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="42" y="496" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="42" dy="0" font-weight="600" fill="#12355B">数智公司作为基础设施运营和技术支撑主体，负责电力领域数据基础设施运</tspan><tspan x="42" dy="31">营及场景接入技术支撑，承担接口开发、系统联调、计量计费等工作，并做</tspan><tspan x="42" dy="31">好基础设施侧数据安全技术保障。其责任集中在基础设施运行、场景接入和</tspan><tspan x="42" dy="31">技术保障，场景产品服务内容及客户运营仍由相应业务部门或直属单位负责</tspan><tspan x="42" dy="31">。</tspan></text><rect x="778" y="154" width="544" height="320" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="790" y="185" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#303030"><tspan x="790" dy="0" font-weight="600" fill="#12355B">两类主体围绕同一场景形成责任衔接：业务主体明确</tspan><tspan x="790" dy="32.550000000000004">服务内容、数据业务资源和客户需求，数智公司落实</tspan><tspan x="790" dy="32.550000000000004">接入、联调、计量计费和基础设施侧安全技术要求。</tspan><tspan x="790" dy="32.550000000000004">责任边界清楚后，具体场景建设和接入方案才能由各</tspan><tspan x="790" dy="32.550000000000004">方共同完善并进入上线实施。</tspan></text></svg>
