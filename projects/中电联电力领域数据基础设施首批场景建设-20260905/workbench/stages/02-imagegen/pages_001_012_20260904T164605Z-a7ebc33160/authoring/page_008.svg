<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="assets/page_008_clean_base.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none"/><rect x="378" y="24" width="744" height="290" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="390" y="54" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="390" dy="0" font-weight="600" fill="#12355B">场景运营从现有平台、数据和服务接入开始。业务平台和信息系统可通过AP</tspan><tspan x="390" dy="31">I、可信连接器、系统接口等方式连接电力领域数据基础设施，并按照统一入</tspan><tspan x="390" dy="31">口、后台隔离原则实现服务接入。对于不宜直接共享的高价值数据，可依托区</tspan><tspan x="390" dy="31">块链、隐私计算、数据沙箱等技术能力，在保障数据安全和业务权益的前提下</tspan><tspan x="390" dy="31">开展跨主体流通利用。</tspan></text><rect x="1376" y="32" width="604" height="540" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="1388" y="62" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="1388" dy="0" font-weight="600" fill="#12355B">接入后的服务内容可在实际需求牵引下持续丰富。各部门和单</tspan><tspan x="1388" dy="31">位可以鼓励现有服务厂商、合作机构参与场景共建，并引导现</tspan><tspan x="1388" dy="31">有客户通过场景专区线上获取相关服务；也可联合数据供给方</tspan><tspan x="1388" dy="31">、技术服务方开展数据产品开发、模型研发和应用验证，通过</tspan><tspan x="1388" dy="31">场景专区发布产品服务和业务需求、开展供需对接。这些合作</tspan><tspan x="1388" dy="31">方式属于可结合场景选择的建设路径，原通知没有要求每个场</tspan><tspan x="1388" dy="31">景采用全部方式。</tspan></text><rect x="178" y="690" width="1664" height="210" rx="12" fill="#FFFFFF" fill-opacity="0.94"/><text x="190" y="722" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#303030"><tspan x="190" dy="0" font-weight="600" fill="#12355B">场景专区开展市场化服务形成收益后，分配遵循“谁建设、谁收益”原则，并根据业务贡献、资源投入和运营支撑情况合理确定。具体分配方式仍由相关单位与数</tspan><tspan x="190" dy="34.1">智公司根据场景实际建设情况协商，通知未给出固定比例或统一结算方案。</tspan></text></svg>
