<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-template-assembly="cec-lightweight" data-pptx-master="cec-content" data-pptx-master-name="CEC Content Master" data-pptx-layout="cec-content" data-pptx-layout-name="CEC Content">
<rect id="masterBackground" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">接入、共建、供需对接与收益机制支撑持续运营</text>
<text id="pageNumber" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">8</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/08/93f02a001d69aa7626bf646069b9e38697504d8bf06f98e9e66ab96190694cfe.png" x="0" y="0" width="1214" height="607" preserveAspectRatio="none" />
<rect xmlns="http://www.w3.org/2000/svg" x="224.068359375" y="14.2265625" width="441.0234375" height="171.904296875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="231.181640625" y="32.009765625" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.85546875" fill="#303030"><tspan x="231.181640625" dy="0" font-weight="600" fill="#12355B">场景运营从现有平台、数据和服务接入开始。业务平台和信息系统可通过AP</tspan><tspan x="231.181640625" dy="18.3759765625">I、可信连接器、系统接口等方式连接电力领域数据基础设施，并按照统一入</tspan><tspan x="231.181640625" dy="18.3759765625">口、后台隔离原则实现服务接入。对于不宜直接共享的高价值数据，可依托区</tspan><tspan x="231.181640625" dy="18.3759765625">块链、隐私计算、数据沙箱等技术能力，在保障数据安全和业务权益的前提下</tspan><tspan x="231.181640625" dy="18.3759765625">开展跨主体流通利用。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="815.65625" y="18.96875" width="358.03515625" height="320.09765625" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="822.76953125" y="36.751953125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.85546875" fill="#303030"><tspan x="822.76953125" dy="0" font-weight="600" fill="#12355B">接入后的服务内容可在实际需求牵引下持续丰富。各部门和单</tspan><tspan x="822.76953125" dy="18.3759765625">位可以鼓励现有服务厂商、合作机构参与场景共建，并引导现</tspan><tspan x="822.76953125" dy="18.3759765625">有客户通过场景专区线上获取相关服务；也可联合数据供给方</tspan><tspan x="822.76953125" dy="18.3759765625">、技术服务方开展数据产品开发、模型研发和应用验证，通过</tspan><tspan x="822.76953125" dy="18.3759765625">场景专区发布产品服务和业务需求、开展供需对接。这些合作</tspan><tspan x="822.76953125" dy="18.3759765625">方式属于可结合场景选择的建设路径，原通知没有要求每个场</tspan><tspan x="822.76953125" dy="18.3759765625">景采用全部方式。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="105.513671875" y="409.013671875" width="986.375" height="124.482421875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="112.626953125" y="427.982421875" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13.041015625" fill="#303030"><tspan x="112.626953125" dy="0" font-weight="600" fill="#12355B">场景专区开展市场化服务形成收益后，分配遵循“谁建设、谁收益”原则，并根据业务贡献、资源投入和运营支撑情况合理确定。具体分配方式仍由相关单位与数</tspan><tspan x="112.626953125" dy="20.2135742188">智公司根据场景实际建设情况协商，通知未给出固定比例或统一结算方案。</tspan></text>
</g>
</svg>
