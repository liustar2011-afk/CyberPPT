<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-template-assembly="cec-lightweight" data-pptx-master="cec-content" data-pptx-master-name="CEC Content Master" data-pptx-layout="cec-content" data-pptx-layout-name="CEC Content">
<rect id="masterBackground" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">场景建设是先行先试验收与持续运营的关键抓手</text>
<text id="pageNumber" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">4</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/04/a71c5e7cdf85b19cfe448a196c2a83a9b3135b068defaff2230ebf7cc6a50936.png" x="0" y="0" width="1214" height="607" preserveAspectRatio="none" />
<rect xmlns="http://www.w3.org/2000/svg" x="18.96875" y="18.96875" width="316.541015625" height="176.646484375" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="26.08203125" y="36.1591796875" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.2626953125" fill="#303030"><tspan x="26.08203125" dy="0" font-weight="600" fill="#12355B">首批场景建设需要在明确的国家先行先试节点下形成实际</tspan><tspan x="26.08203125" dy="17.4571777344">应用。电力领域数据基础设施先行先试项目是全国性行业</tspan><tspan x="26.08203125" dy="17.4571777344">协会中首个纳入国家数据基础设施先行先试的项目，也是</tspan><tspan x="26.08203125" dy="17.4571777344">中电联落实国家数据要素和能源数智化战略、促进内部数</tspan><tspan x="26.08203125" dy="17.4571777344">据资源协同利用的重要抓手。首批场景建设遵照中电联党</tspan><tspan x="26.08203125" dy="17.4571777344">组会议精神和《中国电力企业联合会数据共享利用管理办</tspan><tspan x="26.08203125" dy="17.4571777344">法（试行）》组织开展；为服务2026年底国家能源局</tspan><tspan x="26.08203125" dy="17.4571777344">初验和2027年6月国家数据局终验，首批建设需把基</tspan><tspan x="26.08203125" dy="17.4571777344">础设施能力落实到能够运行的场景载体中。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="355.6640625" y="260.8203125" width="482.517578125" height="163.012695312" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="362.77734375" y="278.010742188" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.2626953125" fill="#303030"><tspan x="362.77734375" dy="0" font-weight="600" fill="#12355B">场景建设围绕各业务部门和直属单位的成熟业务，统筹现有数据资源、业务平台、产品服</tspan><tspan x="362.77734375" dy="17.4571777344">务和客户基础，建设具有中电联特色的场景专区。场景通过组织行业数据资源、连接数据</tspan><tspan x="362.77734375" dy="17.4571777344">供需主体和培育数据产品服务，把已有业务基础接入电力领域数据基础设施；实际应用再</tspan><tspan x="362.77734375" dy="17.4571777344">反向牵引基础设施完善。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="904.572265625" y="26.08203125" width="280.974609375" height="308.2421875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="911.685546875" y="43.2724609375" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.2626953125" fill="#303030"><tspan x="911.685546875" dy="0" font-weight="600" fill="#12355B">场景专区将逐步成为业务展示、产品发布、供需对</tspan><tspan x="911.685546875" dy="17.4571777344">接和服务运营的重要渠道，并形成一批具有中电联</tspan><tspan x="911.685546875" dy="17.4571777344">特色、能够持续运营的数据产品和应用服务。建设</tspan><tspan x="911.685546875" dy="17.4571777344">成果由此落到数据资源开发利用和行业数据服务能</tspan><tspan x="911.685546875" dy="17.4571777344">力提升，同时为先行先试项目验收提供应用支撑。</tspan></text>
</g>
</svg>
