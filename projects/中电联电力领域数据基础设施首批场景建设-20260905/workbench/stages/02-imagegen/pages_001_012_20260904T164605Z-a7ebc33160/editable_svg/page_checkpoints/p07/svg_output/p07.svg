<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-template-assembly="cec-lightweight" data-pptx-master="cec-content" data-pptx-master-name="CEC Content Master" data-pptx-layout="cec-content" data-pptx-layout-name="CEC Content">
<rect id="masterBackground" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">7</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">业务主体与技术主体分工协同推进场景落地</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/07/90d612104a4421b96d1ef7593e4e3f7e83e51b53a43d6c12933018612beb5f0f.png" x="0" y="0" width="1214" height="607" preserveAspectRatio="none" />
<rect xmlns="http://www.w3.org/2000/svg" x="17.783203125" y="18.96875" width="429.16796875" height="225.25390625" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="24.896484375" y="36.751953125" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.85546875" fill="#303030"><tspan x="24.896484375" dy="0" font-weight="600" fill="#12355B">场景落地采用业务建设运营与基础设施技术运营两类责任协同。各业务部门</tspan><tspan x="24.896484375" dy="18.3759765625">和直属单位作为场景建设和业务运营主体，负责本单位场景建设的组织实施</tspan><tspan x="24.896484375" dy="18.3759765625">，确定产品和服务内容，组织相关数据和业务资源，开展客户对接、服务拓</tspan><tspan x="24.896484375" dy="18.3759765625">展和业务运营，并对场景业务内容、建设进度和质量负责。业务主体由此承</tspan><tspan x="24.896484375" dy="18.3759765625">担从内容设计、资源组织到客户服务和持续运营的完整业务责任。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="17.783203125" y="276.232421875" width="429.16796875" height="201.54296875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="24.896484375" y="294.015625" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.85546875" fill="#303030"><tspan x="24.896484375" dy="0" font-weight="600" fill="#12355B">数智公司作为基础设施运营和技术支撑主体，负责电力领域数据基础设施运</tspan><tspan x="24.896484375" dy="18.3759765625">营及场景接入技术支撑，承担接口开发、系统联调、计量计费等工作，并做</tspan><tspan x="24.896484375" dy="18.3759765625">好基础设施侧数据安全技术保障。其责任集中在基础设施运行、场景接入和</tspan><tspan x="24.896484375" dy="18.3759765625">技术保障，场景产品服务内容及客户运营仍由相应业务部门或直属单位负责</tspan><tspan x="24.896484375" dy="18.3759765625">。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="461.177734375" y="91.287109375" width="322.46875" height="189.6875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="468.291015625" y="109.663085938" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.4482421875" fill="#303030"><tspan x="468.291015625" dy="0" font-weight="600" fill="#12355B">两类主体围绕同一场景形成责任衔接：业务主体明确</tspan><tspan x="468.291015625" dy="19.2947753906">服务内容、数据业务资源和客户需求，数智公司落实</tspan><tspan x="468.291015625" dy="19.2947753906">接入、联调、计量计费和基础设施侧安全技术要求。</tspan><tspan x="468.291015625" dy="19.2947753906">责任边界清楚后，具体场景建设和接入方案才能由各</tspan><tspan x="468.291015625" dy="19.2947753906">方共同完善并进入上线实施。</tspan></text>
</g>
</svg>
