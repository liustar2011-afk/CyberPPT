<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-template-assembly="cec-lightweight" data-pptx-master="cec-content" data-pptx-master-name="CEC Content Master" data-pptx-layout="cec-content" data-pptx-layout-name="CEC Content">
<rect id="masterBackground" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">11</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">任务表把场景条件、服务方式和责任信息一次填清</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/11/da370df31ebc8e9b466b0b38906930ae486ba0a1cb0bc01c95605f81864ab364.png" x="0" y="0" width="1214" height="607" preserveAspectRatio="none" />
<rect xmlns="http://www.w3.org/2000/svg" x="16.59765625" y="20.154296875" width="221.697265625" height="266.748046875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="23.7109375" y="36.1591796875" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.0771484375" fill="#303030"><tspan x="23.7109375" dy="0" font-weight="600" fill="#12355B">任务表围绕一个具体场景收集能够支持后续</tspan><tspan x="23.7109375" dy="15.6195800781">判断和沟通的信息。建设单位、场景名称和</tspan><tspan x="23.7109375" dy="15.6195800781">场景简介用于说明谁建设、服务什么对象、</tspan><tspan x="23.7109375" dy="15.6195800781">解决什么业务需求；主要服务方式用于说明</tspan><tspan x="23.7109375" dy="15.6195800781">拟采用数据交互、模型调用、可视化应用等</tspan><tspan x="23.7109375" dy="15.6195800781">一种或多种服务形态；客户基础、数据基础</tspan><tspan x="23.7109375" dy="15.6195800781">和数字化基础分别说明真实需求、可用资源</tspan><tspan x="23.7109375" dy="15.6195800781">与接入交付条件；牵头处室、责任人及联系</tspan><tspan x="23.7109375" dy="15.6195800781">方式用于落实后续沟通责任。任务表在示例</tspan><tspan x="23.7109375" dy="15.6195800781">行后预留4行空白供各单位填写场景，实际</tspan><tspan x="23.7109375" dy="15.6195800781">申报数量仍以通知正文和填表说明为准。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="816.841796875" y="18.96875" width="363.962890625" height="237.109375" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="823.955078125" y="35.56640625" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.669921875" fill="#303030"><tspan x="823.955078125" dy="0" font-weight="600" fill="#12355B">填报应结合现有业务如实进行，每个部门和单位原则上至少填报1个符</tspan><tspan x="823.955078125" dy="16.5383789063">合条件的场景，具备条件的可填报2个；暂不具备条件的，应说明有关</tspan><tspan x="823.955078125" dy="16.5383789063">情况。三项基础应参照通知“二、建设范围”的定义填写，主要服务方</tspan><tspan x="823.955078125" dy="16.5383789063">式可以选择一种或多种，避免用笼统描述代替现有客户、数据资源和数</tspan><tspan x="823.955078125" dy="16.5383789063">字化载体。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="763.4921875" y="379.375" width="399.529296875" height="151.157226562" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="770.60546875" y="396.565429688" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11.2626953125" fill="#303030"><tspan x="770.60546875" dy="0" font-weight="600" fill="#12355B">附件中的电力行业人才测评场景用于展示填写方法：示例说明了会员单位</tspan><tspan x="770.60546875" dy="17.4571777344">和电力企业的服务对象、模型调用和数据交互的服务方式，以及人才测评</tspan><tspan x="770.60546875" dy="17.4571777344">数据集、分析模型和现有系统等基础。该场景仅为参考示例，不代表已经</tspan><tspan x="770.60546875" dy="17.4571777344">确定为首批场景；专班将根据各单位实际填报情况继续沟通完善建设和接</tspan><tspan x="770.60546875" dy="17.4571777344">入方案。</tspan></text>
</g>
</svg>
