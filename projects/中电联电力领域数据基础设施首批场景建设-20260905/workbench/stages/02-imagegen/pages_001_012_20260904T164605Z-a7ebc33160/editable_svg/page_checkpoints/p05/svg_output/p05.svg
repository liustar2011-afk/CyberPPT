<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-template-assembly="cec-lightweight" data-pptx-master="cec-content" data-pptx-master-name="CEC Content Master" data-pptx-layout="cec-content" data-pptx-layout-name="CEC Content">
<rect id="masterBackground" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
<rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3" fill="#8B0000"/>
<image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" href="../images/logo.png" preserveAspectRatio="xMidYMid meet"/>
<rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
<text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>
<text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">5</text>
<text x="58" y="47" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="32" font-weight="700" fill="#123B66">首批场景优先从三项基础完备的成熟业务中选择</text>
<g id="quick-body" transform="translate(33 89)">
<image xmlns="http://www.w3.org/2000/svg" href="../images/layers/05/a25aecf4be6c62a32246dac40a756bb5117f6dde47d5ac8566eaf7b93db68514.png" x="0" y="0" width="1214" height="607" preserveAspectRatio="none" />
<rect xmlns="http://www.w3.org/2000/svg" x="17.783203125" y="22.525390625" width="322.46875" height="177.83203125" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="24.896484375" y="40.9013671875" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.4482421875" fill="#303030"><tspan x="24.896484375" dy="0" font-weight="600" fill="#12355B">首批场景首先要符合真实业务应用的定义：面向外部</tspan><tspan x="24.896484375" dy="19.2947753906">用户的某一业务主题提供数据服务或模型应用，依托</tspan><tspan x="24.896484375" dy="19.2947753906">安全可信、可计量的数据基础设施，通过数据交互、</tspan><tspan x="24.896484375" dy="19.2947753906">模型调用、可视化应用等服务方式完成真实数据流通</tspan><tspan x="24.896484375" dy="19.2947753906">应用，满足用户业务需要。单纯展示内部数据、缺少</tspan><tspan x="24.896484375" dy="19.2947753906">外部用户需求或没有实际服务闭环的事项，无法由该</tspan><tspan x="24.896484375" dy="19.2947753906">定义直接证明符合首批范围。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="375.818359375" y="81.802734375" width="491.409179688" height="266.748046875" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="382.931640625" y="98.400390625" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10.669921875" fill="#303030"><tspan x="382.931640625" dy="0" font-weight="600" fill="#12355B">三项基础共同构成首批场景的优先选择尺度。一是客户基础证明业务已有真实服务对象和需求，拟</tspan><tspan x="382.931640625" dy="16.5383789063">报事项应已面向会员单位、电力企业、政府部门、科研院所、高等院校、金融机构等开展相关业务</tspan><tspan x="382.931640625" dy="16.5383789063">，具有明确服务对象、实际业务需求和一定客户。二是数据基础证明服务具备持续供给条件，业务</tspan><tspan x="382.931640625" dy="16.5383789063">应已形成业务数据、专业数据或数据集，以及分析报告、分析模型等产品成果，并具备持续更新和</tspan><tspan x="382.931640625" dy="16.5383789063">进一步开发利用基础。三是数字化基础证明服务具备接入条件，业务应已有业务系统、专业平台、</tspan><tspan x="382.931640625" dy="16.5383789063">网站等数字化载体，或现有产品服务能够数字化交付，并可根据实际情况通过API、可信连接器</tspan><tspan x="382.931640625" dy="16.5383789063">或系统接口接入基础设施。</tspan></text>
<rect xmlns="http://www.w3.org/2000/svg" x="324.83984375" y="394.787109375" width="559.578125" height="111.44140625" rx="7.11328125" fill="#FFFFFF" fill-opacity="0.94" />
<text xmlns="http://www.w3.org/2000/svg" x="331.953125" y="413.163085938" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12.4482421875" fill="#303030"><tspan x="331.953125" dy="0" font-weight="600" fill="#12355B">三项基础分别回答谁需要服务、用什么数据和产品提供服务、通过什么数字化载体接入。各单位</tspan><tspan x="331.953125" dy="19.2947753906">应围绕已有成熟业务如实判断，首批优先选择三方面均具备较好基础的场景。</tspan></text>
</g>
</svg>
