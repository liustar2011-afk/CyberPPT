<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="../images/layers/05/a25aecf4be6c62a32246dac40a756bb5117f6dde47d5ac8566eaf7b93db68514.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none" /><rect x="30" y="38" width="544" height="300" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="42" y="69" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#303030"><tspan x="42" dy="0" font-weight="600" fill="#12355B">首批场景首先要符合真实业务应用的定义：面向外部</tspan><tspan x="42" dy="32.550000000000004">用户的某一业务主题提供数据服务或模型应用，依托</tspan><tspan x="42" dy="32.550000000000004">安全可信、可计量的数据基础设施，通过数据交互、</tspan><tspan x="42" dy="32.550000000000004">模型调用、可视化应用等服务方式完成真实数据流通</tspan><tspan x="42" dy="32.550000000000004">应用，满足用户业务需要。单纯展示内部数据、缺少</tspan><tspan x="42" dy="32.550000000000004">外部用户需求或没有实际服务闭环的事项，无法由该</tspan><tspan x="42" dy="32.550000000000004">定义直接证明符合首批范围。</tspan></text><rect x="634" y="138" width="829" height="450" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="646" y="166" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#303030"><tspan x="646" dy="0" font-weight="600" fill="#12355B">三项基础共同构成首批场景的优先选择尺度。一是客户基础证明业务已有真实服务对象和需求，拟</tspan><tspan x="646" dy="27.900000000000002">报事项应已面向会员单位、电力企业、政府部门、科研院所、高等院校、金融机构等开展相关业务</tspan><tspan x="646" dy="27.900000000000002">，具有明确服务对象、实际业务需求和一定客户。二是数据基础证明服务具备持续供给条件，业务</tspan><tspan x="646" dy="27.900000000000002">应已形成业务数据、专业数据或数据集，以及分析报告、分析模型等产品成果，并具备持续更新和</tspan><tspan x="646" dy="27.900000000000002">进一步开发利用基础。三是数字化基础证明服务具备接入条件，业务应已有业务系统、专业平台、</tspan><tspan x="646" dy="27.900000000000002">网站等数字化载体，或现有产品服务能够数字化交付，并可根据实际情况通过API、可信连接器</tspan><tspan x="646" dy="27.900000000000002">或系统接口接入基础设施。</tspan></text><rect x="548" y="666" width="944" height="188" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="560" y="697" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#303030"><tspan x="560" dy="0" font-weight="600" fill="#12355B">三项基础分别回答谁需要服务、用什么数据和产品提供服务、通过什么数字化载体接入。各单位</tspan><tspan x="560" dy="32.550000000000004">应围绕已有成熟业务如实判断，首批优先选择三方面均具备较好基础的场景。</tspan></text></svg>