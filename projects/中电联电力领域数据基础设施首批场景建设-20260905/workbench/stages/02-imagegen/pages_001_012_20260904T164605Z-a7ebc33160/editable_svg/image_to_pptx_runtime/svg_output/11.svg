<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="../images/layers/11/da370df31ebc8e9b466b0b38906930ae486ba0a1cb0bc01c95605f81864ab364.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none" /><rect x="28" y="34" width="374" height="450" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="40" y="61" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#303030"><tspan x="40" dy="0" font-weight="600" fill="#12355B">任务表围绕一个具体场景收集能够支持后续</tspan><tspan x="40" dy="26.35">判断和沟通的信息。建设单位、场景名称和</tspan><tspan x="40" dy="26.35">场景简介用于说明谁建设、服务什么对象、</tspan><tspan x="40" dy="26.35">解决什么业务需求；主要服务方式用于说明</tspan><tspan x="40" dy="26.35">拟采用数据交互、模型调用、可视化应用等</tspan><tspan x="40" dy="26.35">一种或多种服务形态；客户基础、数据基础</tspan><tspan x="40" dy="26.35">和数字化基础分别说明真实需求、可用资源</tspan><tspan x="40" dy="26.35">与接入交付条件；牵头处室、责任人及联系</tspan><tspan x="40" dy="26.35">方式用于落实后续沟通责任。任务表在示例</tspan><tspan x="40" dy="26.35">行后预留4行空白供各单位填写场景，实际</tspan><tspan x="40" dy="26.35">申报数量仍以通知正文和填表说明为准。</tspan></text><rect x="1378" y="32" width="614" height="400" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="1390" y="60" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#303030"><tspan x="1390" dy="0" font-weight="600" fill="#12355B">填报应结合现有业务如实进行，每个部门和单位原则上至少填报1个符</tspan><tspan x="1390" dy="27.900000000000002">合条件的场景，具备条件的可填报2个；暂不具备条件的，应说明有关</tspan><tspan x="1390" dy="27.900000000000002">情况。三项基础应参照通知“二、建设范围”的定义填写，主要服务方</tspan><tspan x="1390" dy="27.900000000000002">式可以选择一种或多种，避免用笼统描述代替现有客户、数据资源和数</tspan><tspan x="1390" dy="27.900000000000002">字化载体。</tspan></text><rect x="1288" y="640" width="674" height="255" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="1300" y="669" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#303030"><tspan x="1300" dy="0" font-weight="600" fill="#12355B">附件中的电力行业人才测评场景用于展示填写方法：示例说明了会员单位</tspan><tspan x="1300" dy="29.45">和电力企业的服务对象、模型调用和数据交互的服务方式，以及人才测评</tspan><tspan x="1300" dy="29.45">数据集、分析模型和现有系统等基础。该场景仅为参考示例，不代表已经</tspan><tspan x="1300" dy="29.45">确定为首批场景；专班将根据各单位实际填报情况继续沟通完善建设和接</tspan><tspan x="1300" dy="29.45">入方案。</tspan></text></svg>