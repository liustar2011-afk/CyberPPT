<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="../images/layers/10/6c748801d6dec6846aa1bc4959d46b0fba1b6b5b7c6eb60dbc6f93350e8ecec2.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none" /><rect x="48" y="34" width="634" height="240" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="60" y="64" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="60" dy="0" font-weight="600" fill="#12355B">首批场景首先由各业务部门和直属单位结合本单位业务实际明确建</tspan><tspan x="60" dy="31">设任务。每个部门和单位原则上至少推荐1个符合条件的场景，具</tspan><tspan x="60" dy="31">备条件的可推荐2个，并于2026年9月20日前把《电力领域</tspan><tspan x="60" dy="31">数据基础设施首批场景建设任务表》报送先行先试项目工作专班。</tspan></text><rect x="678" y="300" width="724" height="275" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="690" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#303030"><tspan x="690" dy="0" font-weight="600" fill="#12355B">任务报送后，工作专班将根据填报情况与有关部门和单位逐项沟通，进一步</tspan><tspan x="690" dy="31">梳理业务内容、数据基础、数字化基础、客户需求和接入方式；数智公司同</tspan><tspan x="690" dy="31">步提供技术支撑，明确接口接入、系统联调和数据安全技术保障要求。各方</tspan><tspan x="690" dy="31">共同研究形成具体场景建设和接入方案，使业务条件与技术条件在上线前完</tspan><tspan x="690" dy="31">成衔接。</tspan></text><rect x="68" y="700" width="1674" height="190" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="80" y="731" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#303030"><tspan x="80" dy="0" font-weight="600" fill="#12355B">场景按照“成熟一个、接入一个、上线一个”的原则分批推进，依次落实接口联调、专区上线、产品发布、客户接入和市场化服务，并结合运营情况持续完善服务。首批场</tspan><tspan x="80" dy="32.550000000000004">景应于2026年12月15日前完成建设并上线运行。参与并完成场景建设上线的相关部门和单位可按中电联年度绩效考核规定获得相应加分，具体认定以正式印发的年</tspan><tspan x="80" dy="32.550000000000004">度考核办法为准。</tspan></text></svg>