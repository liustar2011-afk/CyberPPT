<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" data-cyberppt-native-text-style="locked"><image href="../images/layers/04/a71c5e7cdf85b19cfe448a196c2a83a9b3135b068defaff2230ebf7cc6a50936.png" x="0" y="0" width="2048" height="1024" preserveAspectRatio="none" /><rect x="32" y="32" width="534" height="298" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="44" y="61" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#303030"><tspan x="44" dy="0" font-weight="600" fill="#12355B">首批场景建设需要在明确的国家先行先试节点下形成实际</tspan><tspan x="44" dy="29.45">应用。电力领域数据基础设施先行先试项目是全国性行业</tspan><tspan x="44" dy="29.45">协会中首个纳入国家数据基础设施先行先试的项目，也是</tspan><tspan x="44" dy="29.45">中电联落实国家数据要素和能源数智化战略、促进内部数</tspan><tspan x="44" dy="29.45">据资源协同利用的重要抓手。首批场景建设遵照中电联党</tspan><tspan x="44" dy="29.45">组会议精神和《中国电力企业联合会数据共享利用管理办</tspan><tspan x="44" dy="29.45">法（试行）》组织开展；为服务2026年底国家能源局</tspan><tspan x="44" dy="29.45">初验和2027年6月国家数据局终验，首批建设需把基</tspan><tspan x="44" dy="29.45">础设施能力落实到能够运行的场景载体中。</tspan></text><rect x="600" y="440" width="814" height="275" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="612" y="469" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#303030"><tspan x="612" dy="0" font-weight="600" fill="#12355B">场景建设围绕各业务部门和直属单位的成熟业务，统筹现有数据资源、业务平台、产品服</tspan><tspan x="612" dy="29.45">务和客户基础，建设具有中电联特色的场景专区。场景通过组织行业数据资源、连接数据</tspan><tspan x="612" dy="29.45">供需主体和培育数据产品服务，把已有业务基础接入电力领域数据基础设施；实际应用再</tspan><tspan x="612" dy="29.45">反向牵引基础设施完善。</tspan></text><rect x="1526" y="44" width="474" height="520" rx="12" fill="#FFFFFF" fill-opacity="0.94" /><text x="1538" y="73" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#303030"><tspan x="1538" dy="0" font-weight="600" fill="#12355B">场景专区将逐步成为业务展示、产品发布、供需对</tspan><tspan x="1538" dy="29.45">接和服务运营的重要渠道，并形成一批具有中电联</tspan><tspan x="1538" dy="29.45">特色、能够持续运营的数据产品和应用服务。建设</tspan><tspan x="1538" dy="29.45">成果由此落到数据资源开发利用和行业数据服务能</tspan><tspan x="1538" dy="29.45">力提升，同时为先行先试项目验收提供应用支撑。</tspan></text></svg>