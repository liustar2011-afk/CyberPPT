<g id="construction-copy" data-pptx-bounds="164 25 490 215"><text x="164" y="52" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#103B76">总体要求</text><text x="164" y="82" font-family="Microsoft YaHei" font-size="18" fill="#191919">数据供得出、流得动、用得好、保安全，</text><text x="164" y="108" font-family="Microsoft YaHei" font-size="18" fill="#191919">建设可信连接、统一目录和安全管控等能力。</text><text x="164" y="166" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#103B76">建设节点</text><line x1="164" y1="209" x2="224" y2="209" stroke="#103B76" stroke-width="2"/><circle cx="224" cy="209" r="5" fill="#103B76"/><text x="240" y="207" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#103B76">2026年12月</text><text x="240" y="237" font-family="Microsoft YaHei" font-size="20" font-weight="bold">初验</text><line x1="370" y1="209" x2="476" y2="209" stroke="#103B76" stroke-width="2"/><circle cx="476" cy="209" r="5" fill="#103B76"/><text x="490" y="207" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#103B76">2027年6月</text><text x="490" y="237" font-family="Microsoft YaHei" font-size="20" font-weight="bold">终验</text></g>
<g id="target-cards" data-pptx-bounds="143 258 885 124"><rect x="143" y="258" width="855" height="124" rx="9" fill="#EEF4FA"/><line x1="347" y1="271" x2="347" y2="369" stroke="#B7C9DC"/><line x1="559" y1="271" x2="559" y2="369" stroke="#B7C9DC"/><line x1="761" y1="271" x2="761" y2="369" stroke="#B7C9DC"/><text x="245" y="290" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#103B76">主体接入</text><text x="169" y="320" font-family="Microsoft YaHei" font-size="13">总体建设任务完成时，</text><text x="169" y="345" font-family="Microsoft YaHei" font-size="13">实现<tspan font-size="20" font-weight="bold" fill="#103B76">600家以上</tspan>数据</text><text x="169" y="368" font-family="Microsoft YaHei" font-size="13">流通利用主体接入。</text><text x="453" y="290" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#103B76">行业流通</text><text x="366" y="320" font-family="Microsoft YaHei" font-size="13">支持<tspan font-size="20" font-weight="bold" fill="#103B76">5个以上</tspan>重点行业的</text><text x="366" y="345" font-family="Microsoft YaHei" font-size="13">跨区域、跨行业数据</text><text x="366" y="368" font-family="Microsoft YaHei" font-size="13">流通利用。</text><text x="660" y="290" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#103B76">产品发布</text><text x="584" y="320" font-family="Microsoft YaHei" font-size="13">发布不少于<tspan font-size="20" font-weight="bold" fill="#103B76">1200个</tspan></text><text x="584" y="345" font-family="Microsoft YaHei" font-size="13">数据产品。</text><text x="880" y="290" text-anchor="middle" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#103B76">示范场景</text><text x="784" y="320" font-family="Microsoft YaHei" font-size="13">打造<tspan font-size="20" font-weight="bold" fill="#103B76">20个以上</tspan>示范性强、</text><text x="784" y="345" font-family="Microsoft YaHei" font-size="13">带动性广的典型应用场景。</text></g>
<g id="operations-rail" data-pptx-bounds="13 418 116 195"><rect x="13" y="418" width="116" height="195" rx="10" fill="url(#navy)"/><text x="71" y="470" text-anchor="middle" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#FFFFFF">运营期</text><line x1="32" y1="493" x2="111" y2="493" stroke="#D9E6F7"/><circle cx="71" cy="493" r="4" fill="#FFFFFF"/><rect x="41" y="519" width="57" height="57" rx="4" fill="none" stroke="#7C99BD" stroke-width="5"/><line x1="53" y1="537" x2="86" y2="537" stroke="#7C99BD" stroke-width="4"/><line x1="53" y1="551" x2="79" y2="551" stroke="#7C99BD" stroke-width="4"/></g>
<g id="operations-copy" data-pptx-bounds="149 428 850 172"><text x="149" y="444" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#103B76">持续运营评价原则</text><line x1="359" y1="470" x2="359" y2="596" stroke="#B7C9DC"/><line x1="567" y1="470" x2="567" y2="596" stroke="#B7C9DC"/><line x1="755" y1="470" x2="755" y2="596" stroke="#B7C9DC"/><text x="149" y="502" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#103B76">01　真实使用</text><text x="149" y="532" font-family="Microsoft YaHei" font-size="13">有效产品应有独立标识、明确</text><text x="149" y="555" font-family="Microsoft YaHei" font-size="13">版本、权利依据、质量说明和</text><text x="149" y="578" font-family="Microsoft YaHei" font-size="13">真实使用记录。</text><text x="379" y="502" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#103B76">02　服务质量</text><text x="379" y="532" font-family="Microsoft YaHei" font-size="13">服务等级、质量责任和客户</text><text x="379" y="555" font-family="Microsoft YaHei" font-size="13">支持要求落实到产品说明及</text><text x="379" y="578" font-family="Microsoft YaHei" font-size="13">合同文件。</text><text x="587" y="502" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#103B76">03　经营效果</text><text x="587" y="532" font-family="Microsoft YaHei" font-size="13">检验产品价格、资源投入和</text><text x="587" y="555" font-family="Microsoft YaHei" font-size="13">持续服务责任是否匹配。</text><text x="775" y="502" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#103B76">04　安全合规</text><text x="775" y="532" font-family="Microsoft YaHei" font-size="13">将分类分级、权利核查、用途</text><text x="775" y="555" font-family="Microsoft YaHei" font-size="13">限定和风险处置贯穿全过程。</text></g>
