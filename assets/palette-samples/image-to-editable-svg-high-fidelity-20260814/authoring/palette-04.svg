<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" data-reconstruction="high-fidelity-manual">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123f78"/><stop offset="1" stop-color="#06295b"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f5f3ef"/></linearGradient>
    <clipPath id="plant"><rect width="680" height="290"/></clipPath>
    <clipPath id="control"><rect y="290" width="430" height="360"/></clipPath>
    <clipPath id="desk"><rect y="631" width="700" height="256"/></clipPath>
  </defs>
  <rect width="1774" height="887" fill="url(#paper)"/>
  <g id="source-photos"><image href="../images/p04-plant.png" x="0" y="0" width="680" height="290" preserveAspectRatio="none"/><image href="../images/p04-control-room.png" x="0" y="290" width="430" height="360" preserveAspectRatio="none"/><image href="../images/p04-clipboard.png" x="0" y="631" width="700" height="256" preserveAspectRatio="none"/></g>
  <g id="center-argument" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <path d="M640 0 C735 55 660 130 550 215 C445 295 363 365 380 500 C394 610 488 684 644 700 L792 887 L382 887 L382 650 C353 555 350 421 397 337 C451 243 585 180 661 87 C690 52 698 22 690 0Z" fill="#f8f7f4" stroke="#d9dde1" stroke-width="7"/>
    <path d="M467 223 C528 211 601 216 720 238 L667 274 C597 254 526 250 462 259Z" fill="#07346c"/>
    <path d="M670 202 L722 238 L669 275Z" fill="#07346c"/>
    <circle cx="534" cy="294" r="24" fill="none" stroke="#08346c" stroke-width="6"/><circle cx="534" cy="294" r="14" fill="none" stroke="#08346c" stroke-width="5"/><path d="M534 294 l12 -12 M543 271 l8 11 M543 271 l-1 14" fill="none" stroke="#08346c" stroke-width="6"/>
    <text x="436" y="363" font-size="25" fill="#111">首期服务方向围绕</text>
    <text x="436" y="401" font-size="27" font-weight="700" fill="#103d78">需求明确、资源清晰、</text>
    <text x="436" y="437" font-size="27" font-weight="700" fill="#103d78">成果可验、价格可执行</text>
    <text x="436" y="476" font-size="25" fill="#111">的领域，优先形成可展示、</text>
    <text x="436" y="515" font-size="25" fill="#111">可交付、可复制的</text>
    <text x="436" y="552" font-size="25" fill="#111">行业服务。</text>
    <g fill="#08346c" stroke="#08346c" stroke-width="3"><circle cx="505" cy="596" r="15" fill="none"/><path d="M498 596 l6 6 12 -15" fill="none"/><ellipse cx="585" cy="596" rx="13" ry="7" fill="none"/><path d="M572 596 v14 c8 8 24 8 26 0 v-14" fill="none"/><path d="M652 580 l14 5 v14 c0 10 -7 17 -14 20 c-7-3-14-10-14-20v-14Z" fill="none"/><path d="M724 585 l18-8 12 12-17 21-16-5Z" fill="none"/></g>
    <g font-size="13" fill="#111"><text x="474" y="634">需求明确</text><text x="553" y="634">资源清晰</text><text x="641" y="634">成果可验</text><text x="725" y="634">价格可执行</text></g>
  </g>
  <g id="right-framework" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <line x1="805" y1="62" x2="1744" y2="62" stroke="#99a7b7"/><path d="M825 36 H1358 L1343 79 H825Z" fill="url(#navy)"/><path d="M805 62 h18 M805 62 v160 M805 222 h18" fill="none" stroke="#0a376f" stroke-width="3"/>
    <text x="850" y="68" font-size="25" font-weight="700" fill="white">一、选择原则｜优先形成可验证产品和场景</text>
    <g fill="#0a376f"><path d="M848 123 h36 v54 h-36z M857 115 h18 v8 h-18z" fill="none" stroke="#0a376f" stroke-width="5"/><path d="M851 137 l6 6 10-12 M851 153 l6 6 10-12 M851 169 l6 6 10-12" fill="none" stroke="#0a376f" stroke-width="4"/><path d="M1340 163 h14 v-18 h10 v18 h14 v-30 h10 v30 h13 v-44 h10 v58 h-71z"/><path d="M1338 147 l19-19 13 9 23-24" fill="none" stroke="#0a376f" stroke-width="7"/></g>
    <text x="923" y="121" font-size="23" font-weight="700" fill="#0a376f">首期标准</text><text x="923" y="153" font-size="17" fill="#222">- 重点选择真实需求明确、资源权利清晰、</text><text x="937" y="178" font-size="17" fill="#222">交付成果可验证、商务价格可执行、</text><text x="937" y="203" font-size="17" fill="#222">持续服务有条件的服务方向。</text>
    <line x1="1303" y1="101" x2="1303" y2="207" stroke="#aeb9c5"/><text x="1430" y="121" font-size="23" font-weight="700" fill="#0a376f">推进方式</text><text x="1424" y="153" font-size="17" fill="#222">- 按照成熟一项、推进一项的原则，</text><text x="1438" y="178" font-size="17" fill="#222">先形成样例、试点和首批客户，</text><text x="1438" y="203" font-size="17" fill="#222">再逐步纳入正式运营。</text><line x1="805" y1="222" x2="1744" y2="222" stroke="#aeb9c5"/>
    <path d="M825 241 H1390 L1375 282 H825Z" fill="url(#navy)"/><path d="M805 270 h18 M805 270 v417 M805 687 h18" fill="none" stroke="#0a376f" stroke-width="3"/><text x="850" y="273" font-size="25" font-weight="700" fill="white">二、六类重点｜围绕已有基础形成首期示范</text>
    <g stroke="#c3cbd3" stroke-width="1"><line x1="1125" y1="296" x2="1125" y2="669"/><line x1="1454" y1="287" x2="1454" y2="669"/><line x1="825" y1="489" x2="1742" y2="489"/></g>
    <g fill="#0a376f" font-size="18" font-weight="700"><text x="900" y="342">设备可靠性与生产运行服务</text><text x="1203" y="342">绿色低碳与电碳因子服务</text><text x="1502" y="342">电力供需与市场经营服务</text><text x="850" y="546">燃料价格预测与供应链服务</text><text x="1174" y="546">科研教育与高质量数据集服务</text><text x="1502" y="546">科技成果可信转化服务</text></g>
    <g fill="#222" font-size="15"><text x="830" y="378">- 依托可靠性数据、运维知识、质量评价规则、</text><text x="840" y="401">诊断模型和专家能力，形成可靠性分析、</text><text x="840" y="424">健康评价、故障预警、检修辅助、设备选型</text><text x="840" y="447">和质量改进服务。</text><text x="1152" y="378">- 依托电碳因子、产品碳足迹、绿色电力和</text><text x="1165" y="401">供应链碳管理等数据与方法，形成因子</text><text x="1165" y="424">查询、碳足迹核算、绿色电力评价和</text><text x="1165" y="447">节能降碳服务。</text><text x="1480" y="378">- 围绕电力供需研判、市场运行分析、经营</text><text x="1490" y="401">指标监测和辅助决策，形成数据分析、</text><text x="1490" y="424">模型预测和持续监测服务。</text><text x="830" y="580">- 围绕燃料采购、库存判断、价格偏离监测</text><text x="840" y="604">和成本测算，形成价格预测、风险监测和</text><text x="840" y="627">专题分析服务。</text><text x="1152" y="580">- 面向科研院所、高等院校和人才培养机构，</text><text x="1165" y="604">形成行业知识库、高质量数据集、模型</text><text x="1165" y="627">训练数据和教育应用服务。</text><text x="1480" y="580">- 围绕科技成果鉴定、可售证据、知识产权</text><text x="1490" y="604">保护、供需匹配和科技金融对接，形成</text><text x="1490" y="627">可信服务和场景化应用。</text></g>
    <path d="M825 702 H1437 L1421 743 H825Z" fill="url(#navy)"/><path d="M805 731 h18 M805 731 v155" fill="none" stroke="#0a376f" stroke-width="3"/><text x="850" y="734" font-size="25" font-weight="700" fill="white">三、动态调整｜储备方向条件成熟后纳入正式运营</text>
    <line x1="1274" y1="759" x2="1274" y2="870" stroke="#c3cbd3"/><text x="920" y="784" font-size="21" font-weight="700" fill="#0a376f">储备培育</text><text x="1400" y="784" font-size="21" font-weight="700" fill="#0a376f">跨行业探索</text><text x="920" y="813" font-size="16" fill="#222">- 新能源与综合能源、信用评价、产业链分析和</text><text x="934" y="837" font-size="16" fill="#222">企业经营管理等方向，先开展需求论证、资源</text><text x="934" y="861" font-size="16" fill="#222">盘点和样例设计。</text><text x="1400" y="813" font-size="16" fill="#222">- 电力与气象、交通、工业、建筑、金融等</text><text x="1414" y="837" font-size="16" fill="#222">协同方向，先明确合作主体、数据边界、</text><text x="1414" y="861" font-size="16" fill="#222">业务目标和安全条件。</text>
  </g>
</svg>
