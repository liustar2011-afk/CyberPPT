<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Master Elements — 中电联公司 Brand Chrome
       Injected by finalize_svg.py into svg_final and by svg_to_pptx.py
       into the native PowerPoint slide master.
  -->

  <!-- Top brand divider -->
  <rect id="topDivider" data-pptx-layer="master" x="0" y="84" width="1280" height="3.3" fill="#8B0000"/>

  <!-- Company logo (top-right) -->
  <image id="companyLogo" data-pptx-layer="master" x="1050" y="13" width="210" height="70" xlink:href="logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- Shared footer chrome -->
  <rect id="footerBar" data-pptx-layer="master" x="0" y="698" width="1280" height="22" fill="#123B66"/>
  <text id="footerCompany" data-pptx-layer="master" x="58" y="712" font-family="Source Han Sans CN, Hiragino Sans GB, STHeiti, Arial, sans-serif" font-size="9" fill="#FFFFFF">中国电力企业联合会</text>

  <!-- Auto page number placeholder -->
  <text id="pageNumber" data-pptx-layer="master" x="1240" y="712" text-anchor="end" font-family="Consolas, Arial, sans-serif" font-size="9" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
