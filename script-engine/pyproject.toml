[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberppt-script-engine"
version = "0.1.0"
description = "Standalone PPT script generation subsystem for CyberPPT"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cyberppt-script = "script_engine.cli:main"

[tool.setuptools.packages.find]
include = ["script_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
