[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberppt-stage02"
version = "0.1.0"
description = "CyberPPT Stage 02 visual production engine: semantic script to editable PPTX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CyberPPT maintainers" }]
keywords = ["pptx", "imagegen", "svg", "powerpoint", "visual-structure", "qa"]
dependencies = [
  "pyyaml",
  "Pillow>=10,<13",
  "rapidocr-onnxruntime>=1.4,<2",
  "python-pptx",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]

[project.scripts]
cyberppt-stage02 = "cyberppt.stage02_cli:main"
cyberppt = "cyberppt.stage02_cli:main"

[tool.setuptools.packages.find]
include = ["cyberppt*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
