[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberppt"
version = "0.1.0"
description = "CyberPPT project tooling for evidence-based, editable consulting PowerPoint workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CyberPPT maintainers" }]
keywords = ["pptx", "codex-skill", "consulting", "powerpoint", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "pyyaml",
  "rapidocr-onnxruntime>=1.4,<2",
  "python-pptx",
  "jsonschema>=4,<5",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
source = [
  "openpyxl>=3.1,<4",
  "markitdown>=0.1,<1",
]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]
dev = [
  "openpyxl>=3.1,<4",
  "markitdown>=0.1,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "build>=1,<2",
]

[project.scripts]
cyberppt = "cyberppt.cli:main"
cyberppt-script = "script_engine.cli:main"

[tool.setuptools.packages.find]
include = [
  "cyberppt*",
  "script_engine*",
  "scripts*",
  "references*",
  "contracts*",
  "assets*",
]

[tool.setuptools.package-data]
cyberppt = ["script_quality/*.yaml"]
"scripts.imagegen_pipeline" = ["style_presets/*.json"]
references = ["*.md"]
contracts = ["*.json"]
assets = ["palette-samples/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
