[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberppt"
version = "0.1.0"
description = "CyberPPT project tooling for evidence-based, editable consulting PowerPoint workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CyberPPT maintainers" }]
keywords = ["pptx", "codex-skill", "consulting", "powerpoint", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = ["pyyaml", "rapidocr-onnxruntime>=1.4,<2", "python-pptx", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]

[project.scripts]
cyberppt = "cyberppt.cli:main"

[tool.setuptools.packages.find]
include = ["cyberppt*"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
